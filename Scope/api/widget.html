<!--
  Scope Intelligence Widget
  Paste this block anywhere in your HTML page.
  Change API_BASE to your Railway URL once deployed.
-->

<style>
  #scope-widget {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 680px;
    margin: 2rem auto;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  #scope-header {
    background: #0f172a;
    color: #f8fafc;
    padding: 16px 20px;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #scope-header span { color: #38bdf8; }
  #scope-alerts {
    max-height: 280px;
    overflow-y: auto;
    border-bottom: 1px solid #e2e8f0;
  }
  .scope-alert {
    padding: 12px 20px;
    border-bottom: 1px solid #f1f5f9;
    font-size: 13px;
    line-height: 1.5;
  }
  .scope-alert:last-child { border-bottom: none; }
  .scope-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 700;
    margin-right: 6px;
  }
  .CRITICAL { background: #fee2e2; color: #b91c1c; }
  .HIGH     { background: #fef3c7; color: #b45309; }
  .MEDIUM   { background: #e0f2fe; color: #0369a1; }
  #scope-chat { padding: 16px 20px; background: #f8fafc; }
  #scope-chat-messages {
    min-height: 60px;
    max-height: 200px;
    overflow-y: auto;
    margin-bottom: 12px;
    font-size: 13px;
    line-height: 1.6;
    color: #1e293b;
  }
  .scope-msg-user { color: #6366f1; font-weight: 600; margin: 8px 0 2px; }
  .scope-msg-bot  { color: #334155; margin: 0 0 8px; }
  #scope-input-row { display: flex; gap: 8px; }
  #scope-input {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
  }
  #scope-input:focus { border-color: #38bdf8; }
  #scope-send {
    padding: 8px 16px;
    background: #0f172a;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  #scope-send:disabled { opacity: 0.5; cursor: default; }
</style>

<div id="scope-widget">
  <div id="scope-header">
    ◈ <span>Scope</span> Political Intelligence
  </div>
  <div id="scope-alerts"><div style="padding:12px 20px;color:#94a3b8;font-size:13px;">Loading alerts…</div></div>
  <div id="scope-chat">
    <div id="scope-chat-messages">
      <div class="scope-msg-bot">Ask me about any ticker, sector, or recent political activity.</div>
    </div>
    <div id="scope-input-row">
      <input id="scope-input" type="text" placeholder="e.g. what's happening with defense stocks?" />
      <button id="scope-send">Ask</button>
    </div>
  </div>
</div>

<script>
  // ← Change this to your Railway URL after deployment
  const API_BASE = "http://localhost:8000";

  // Load recent alerts
  fetch(`${API_BASE}/alerts?days=7&limit=10&severity=HIGH`)
    .then(r => r.json())
    .then(alerts => {
      const el = document.getElementById("scope-alerts");
      if (!alerts.length) { el.innerHTML = '<div style="padding:12px 20px;color:#94a3b8;font-size:13px;">No recent high-severity alerts.</div>'; return; }
      el.innerHTML = alerts.map(a => `
        <div class="scope-alert">
          <span class="scope-badge ${a.severity}">${a.severity}</span>
          <strong>${a.rule}</strong> · ${a.ticker || "—"}
          <div style="color:#475569;margin-top:3px;">${a.headline}</div>
        </div>
      `).join("");
    })
    .catch(() => {
      document.getElementById("scope-alerts").innerHTML = '<div style="padding:12px 20px;color:#f87171;font-size:13px;">Could not reach Scope API.</div>';
    });

  // Chat
  const input = document.getElementById("scope-input");
  const send  = document.getElementById("scope-send");
  const msgs  = document.getElementById("scope-chat-messages");

  function appendMsg(cls, text) {
    const div = document.createElement("div");
    div.className = cls;
    div.textContent = text;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  async function ask() {
    const q = input.value.trim();
    if (!q) return;
    input.value = "";
    send.disabled = true;
    appendMsg("scope-msg-user", q);
    appendMsg("scope-msg-bot", "Thinking…");

    try {
      const res = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: q, days: 30 }),
      });
      const data = await res.json();
      msgs.lastChild.textContent = data.answer || data.error || "No response.";
    } catch {
      msgs.lastChild.textContent = "Could not reach Scope API.";
    }
    send.disabled = false;
    input.focus();
  }

  send.addEventListener("click", ask);
  input.addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
</script>
