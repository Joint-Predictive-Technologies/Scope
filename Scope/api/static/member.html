<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member — Scope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=IBM+Plex+Mono:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0b09; --bg2: #111009; --bg3: #181610;
      --cream: #e8e0cc; --cream2: #c8bfa8;
      --amber: #c8922a; --amber2: #e8aa3a;
      --muted: #7a7060; --border: #2a2620; --border2: #3a3428;
      --red: #e55b4d; --green: #2a8a4a;
      --blue: #6ab0e0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--cream); font-family: Inter, sans-serif; min-height: 100vh; }

    nav { position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); background: rgba(12,11,9,0.92); backdrop-filter: blur(12px); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 56px; }
    .nav-brand { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.2rem; color: var(--amber); letter-spacing: 0.05em; text-decoration: none; }
    .nav-links { display: flex; gap: 2rem; align-items: center; }
    .nav-links a { font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; color: var(--cream2); text-decoration: none; letter-spacing: 0.06em; text-transform: uppercase; transition: color 0.2s; }
    .nav-links a:hover { color: var(--amber); }
    .nav-cta { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; background: var(--amber); color: var(--bg); padding: 6px 16px; border-radius: 4px; text-decoration: none; font-weight: 500; }

    .page { max-width: 960px; margin: 0 auto; padding: 3rem 2rem 5rem; }

    /* HEADER */
    .member-header { margin-bottom: 2rem; }
    .member-name { font-family: 'Playfair Display', serif; font-size: 2.4rem; font-weight: 700; color: var(--cream); margin-bottom: 0.8rem; line-height: 1.15; }
    .member-badges { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
    .badge { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 10px; border-radius: 3px; border: 1px solid; font-weight: 500; }
    .badge-D { color: var(--blue); border-color: rgba(106,176,224,0.35); background: rgba(106,176,224,0.07); }
    .badge-R { color: var(--red);  border-color: rgba(229,91,77,0.35);  background: rgba(229,91,77,0.07); }
    .badge-I { color: var(--muted); border-color: var(--border2); }
    .badge-chamber { color: var(--cream2); border-color: var(--border2); background: var(--bg2); }
    .badge-state { color: var(--cream2); border-color: var(--border2); background: var(--bg2); }
    .congress-link { display: inline-flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; letter-spacing: 0.04em; color: var(--amber); text-decoration: none; border: 1px solid rgba(200,146,42,0.3); padding: 6px 14px; border-radius: 4px; transition: background 0.15s; }
    .congress-link:hover { background: rgba(200,146,42,0.1); }

    /* SUMMARY BAR */
    .summary-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 2.5rem; }
    .sum-cell { background: var(--bg2); padding: 1.1rem 1.2rem; }
    .sum-val { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700; color: var(--amber); }
    .sum-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
    .sum-val.green { color: var(--green); }
    .sum-val.red   { color: var(--red); }
    .sum-val.ticker-val { font-size: 1.1rem; font-family: 'IBM Plex Mono', monospace; }

    /* SECTION */
    .section-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); margin-bottom: 1rem; margin-top: 2.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }

    /* TOP TICKERS */
    .tickers-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .ticker-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; padding: 6px 12px; text-decoration: none; transition: border-color 0.15s; }
    .ticker-chip:hover { border-color: var(--amber); }
    .chip-sym { font-family: 'IBM Plex Mono', monospace; font-size: 0.82rem; font-weight: 500; color: var(--amber); }
    .chip-count { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; color: var(--muted); }

    /* TRADES TABLE */
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; min-width: 560px; }
    thead { background: var(--bg3); }
    th { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 10px 14px; text-align: left; white-space: nowrap; }
    td { font-size: 0.82rem; padding: 9px 14px; border-top: 1px solid var(--border); color: var(--cream2); vertical-align: middle; }
    tbody tr:hover { background: rgba(255,255,255,0.01); }
    .td-ticker a { font-family: 'IBM Plex Mono', monospace; font-size: 0.82rem; color: var(--amber); text-decoration: none; font-weight: 500; }
    .td-ticker a:hover { text-decoration: underline; }
    .tx-badge { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem; padding: 2px 7px; border-radius: 3px; white-space: nowrap; }
    .tx-purchase { background: rgba(42,138,74,0.15); color: #4caf72; border: 1px solid rgba(42,138,74,0.3); }
    .tx-sale { background: rgba(229,91,77,0.12); color: var(--red); border: 1px solid rgba(229,91,77,0.25); }
    .tx-other { background: rgba(255,255,255,0.04); color: var(--muted); border: 1px solid var(--border); }
    .delay-normal { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--muted); }
    .delay-warn   { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--amber); font-weight: 500; }
    .delay-alert  { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--red); font-weight: 500; }

    /* ALERT CARDS */
    .alerts-list { display: flex; flex-direction: column; gap: 1px; }
    .alert-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 1rem 1.3rem; cursor: pointer; transition: border-color 0.15s; }
    .alert-card:hover { border-color: var(--border2); }
    .alert-card.expanded { border-color: var(--amber); }
    .alert-top { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .sev-badge { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; letter-spacing: 0.08em; padding: 2px 7px; border-radius: 3px; font-weight: 500; flex-shrink: 0; }
    .sev-CRITICAL { background: rgba(192,57,43,0.18); color: #e55b4d; border: 1px solid rgba(192,57,43,0.3); }
    .sev-HIGH     { background: rgba(200,146,42,0.15); color: var(--amber2); border: 1px solid rgba(200,146,42,0.3); }
    .sev-MEDIUM   { background: rgba(42,100,160,0.15); color: var(--blue); border: 1px solid rgba(42,100,160,0.25); }
    .rule-badge { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 3px; border: 1px solid var(--border2); color: var(--muted); }
    .alert-headline { font-size: 0.86rem; color: var(--cream); line-height: 1.4; flex: 1; min-width: 180px; }
    .alert-time { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; color: var(--muted); margin-left: auto; flex-shrink: 0; }
    .alert-detail-body { margin-top: 0.7rem; padding-top: 0.7rem; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--cream2); line-height: 1.6; display: none; }
    .alert-card.expanded .alert-detail-body { display: block; }

    .empty { padding: 2rem 0; font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; color: var(--muted); }
    .loading-msg { color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.82rem; padding: 4rem 0; }

    /* FUNDING PROFILE */
    .funding-bar-wrap { display: flex; flex-direction: column; gap: 0.55rem; margin-bottom: 1.4rem; }
    .funding-row { display: grid; grid-template-columns: 140px 1fr 52px; align-items: center; gap: 0.8rem; }
    .funding-label { font-size: 0.78rem; color: var(--cream2); }
    .funding-bar-track { background: var(--bg3); border-radius: 3px; height: 7px; overflow: hidden; }
    .funding-bar-fill { height: 100%; border-radius: 3px; background: var(--amber); transition: width 0.4s; }
    .funding-pct { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--amber); text-align: right; }
    .pac-list { display: flex; flex-direction: column; gap: 4px; margin-top: 0.8rem; }
    .pac-item { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--cream2); }
    .pac-amount { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--muted); }
    .conflict-note { font-size: 0.78rem; color: var(--cream2); line-height: 1.5; padding: 0.7rem 1rem; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; margin-top: 0.8rem; }
    .integrity-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-top: 0.8rem; }
    .int-cell { background: var(--bg2); padding: 1rem 1.2rem; }
    .int-val { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: var(--amber); }
    .int-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.58rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
    .fara-table { width: 100%; font-size: 0.78rem; border-collapse: collapse; margin-top: 0.8rem; }
    .fara-table td { padding: 6px 0; border-bottom: 1px solid var(--border); color: var(--cream2); vertical-align: top; }
    .fara-table td:first-child { color: var(--amber); font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; width: 120px; }
    .conflict-badge-pos { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; padding: 1px 6px; border-radius: 3px; background: rgba(42,138,74,0.15); color: #4caf72; border: 1px solid rgba(42,138,74,0.3); }
    .conflict-badge-neg { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; padding: 1px 6px; border-radius: 3px; background: rgba(122,112,96,0.15); color: var(--muted); border: 1px solid var(--border2); }

    @media (max-width: 700px) {
      .summary-bar { grid-template-columns: repeat(2, 1fr); }
      .member-name { font-size: 1.8rem; }
      .integrity-grid { grid-template-columns: repeat(2, 1fr); }
      .funding-row { grid-template-columns: 110px 1fr 44px; }
    }

    /* ── CMD PALETTE ── */
    #cmd-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:9000; backdrop-filter:blur(4px); }
    #cmd-backdrop.open { display:flex; align-items:flex-start; justify-content:center; padding-top:12vh; }
    #cmd-box { background:#1a1814; border:1px solid #3a3428; border-radius:10px; width:min(640px,92vw); overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,0.7); }
    #cmd-input { width:100%; background:transparent; border:none; border-bottom:1px solid #2a2620; outline:none; font-family:'IBM Plex Mono',monospace; font-size:0.9rem; color:#e8e0cc; padding:1rem 1.2rem; }
    #cmd-results { max-height:360px; overflow-y:auto; }
    .cmd-group-label { font-family:'IBM Plex Mono',monospace; font-size:0.6rem; letter-spacing:0.12em; text-transform:uppercase; color:#7a7060; padding:0.6rem 1.2rem 0.2rem; }
    .cmd-item { display:flex; align-items:center; gap:0.8rem; padding:0.65rem 1.2rem; cursor:pointer; text-decoration:none; border-left:2px solid transparent; }
    .cmd-item:hover,.cmd-item.active { background:#222018; border-left-color:#c8922a; }
    .cmd-item-icon { font-size:0.9rem; opacity:0.6; width:18px; text-align:center; flex-shrink:0; }
    .cmd-item-main { font-family:'IBM Plex Mono',monospace; font-size:0.75rem; color:#e8e0cc; }
    .cmd-item-sub  { font-size:0.68rem; color:#7a7060; margin-top:1px; }
    .cmd-badge { font-family:'IBM Plex Mono',monospace; font-size:0.55rem; padding:1px 5px; border-radius:2px; margin-left:auto; flex-shrink:0; }
    .cmd-badge-CRITICAL { background:rgba(229,91,77,0.2); color:#e55b4d; }
    .cmd-badge-HIGH     { background:rgba(200,146,42,0.2); color:#c8922a; }
    .cmd-badge-MEDIUM   { background:rgba(106,176,224,0.2); color:#6ab0e0; }
    .cmd-empty { font-family:'IBM Plex Mono',monospace; font-size:0.75rem; color:#7a7060; padding:1.5rem 1.2rem; text-align:center; }
    .cmd-hint { font-family:'IBM Plex Mono',monospace; font-size:0.58rem; color:#7a7060; padding:0.5rem 1.2rem; border-top:1px solid #2a2620; display:flex; gap:1.2rem; }
    .cmd-hint kbd { background:#2a2620; border:1px solid #3a3428; border-radius:3px; padding:1px 5px; font-family:inherit; font-size:0.58rem; color:#c8bfa8; }
  
    /* --- unified nav mobile (injected) --- */
    .hamburger { display: none; margin-left: auto; background: none; border: 1px solid var(--border2); color: var(--cream2); padding: 9px 13px; border-radius: 4px; cursor: pointer; font-size: 1rem; line-height: 1; }
    @media (max-width: 900px) {
      .hamburger { display: flex; }
      .nav-links { display: none; flex-direction: column; position: fixed; top: 56px; left: 0; right: 0; background: var(--bg); border-bottom: 1px solid var(--border); padding: 1.2rem 2rem; gap: 1rem; z-index: 99; }
      .nav-links.open { display: flex; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">◈ SCOPE</a>
  <button class="hamburger" onclick="document.getElementById('nav-links').classList.toggle('open')">☰</button>
  <div class="nav-links" id="nav-links">
    <a href="/">Dashboard</a>
    <a href="/feed">Alerts <span class="nav-badge" id="alert-badge" style="display:none"></span></a>
    <a href="/congress">Congress</a>
    <a href="/insiders">Insiders</a>

    <a href="/lobbying">Lobbying</a>

</nav>

<!-- CMD PALETTE -->
<div id="cmd-backdrop" onclick="if(event.target===this)closeCmd()">
  <div id="cmd-box">
    <input id="cmd-input" placeholder="Search tickers, members, headlines…" autocomplete="off" />
    <div id="cmd-results"><div class="cmd-empty">Type to search…</div></div>
    <div class="cmd-hint"><span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>
  </div>
</div>


<div class="page">
  <div id="content"><div class="loading-msg">Loading member profile…</div></div>
</div>

<script>
  const bioguideId = window.location.pathname.split('/').pop();

  function timeAgo(dateStr) {
    if (!dateStr) return 'Unknown';
    let ts;
    if (typeof dateStr === 'number' || /^\d{10,13}$/.test(String(dateStr))) {
      const n = Number(dateStr); ts = n > 1e10 ? n : n * 1000;
    } else {
      const s = String(dateStr).trim().replace(' ', 'T');
      ts = new Date(s + (s.includes('Z') || s.includes('+') ? '' : 'Z')).getTime();
    }
    if (isNaN(ts)) return 'Unknown';
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 0) return 'just now';
    if (diff < 60) return `${diff}s ago`;
    if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
    return `${Math.floor(diff/86400)}d ago`;
  }

  function partyClass(party) {
    if (!party) return 'badge-I';
    const p = party.toLowerCase();
    if (p.includes('democrat')) return 'badge-D';
    if (p.includes('republican')) return 'badge-R';
    return 'badge-I';
  }

  function partyShort(party) {
    if (!party) return 'Independent';
    const p = party.toLowerCase();
    if (p.includes('democrat')) return 'Democrat';
    if (p.includes('republican')) return 'Republican';
    return party;
  }

  function chamberShort(chamber) {
    if (!chamber) return '';
    return chamber.toLowerCase().includes('senate') ? 'Senate' : 'House';
  }

  function txClass(type) {
    if (!type) return 'tx-other';
    const t = type.toLowerCase();
    if (t.includes('purchase')) return 'tx-purchase';
    if (t.includes('sale')) return 'tx-sale';
    return 'tx-other';
  }

  function txLabel(type) {
    if (!type) return '—';
    const t = type.toLowerCase();
    if (t.includes('purchase')) return 'Purchase';
    if (t.includes('sale_partial')) return 'Sale (partial)';
    if (t.includes('sale')) return 'Sale';
    return type.replace(/_/g, ' ');
  }

  function delayCell(delay) {
    if (delay == null || delay < 0) return '<span class="delay-normal">—</span>';
    const cls = delay > 40 ? 'delay-alert' : delay > 30 ? 'delay-warn' : 'delay-normal';
    const flag = delay > 40 ? ' ⚑' : delay > 30 ? ' ▲' : '';
    return `<span class="${cls}">${delay}d${flag}</span>`;
  }

  function renderSummaryBar(stats, m) {
    const pct = stats.total_trades > 0
      ? Math.round((stats.total_purchases / stats.total_trades) * 100) : 0;
    return `
      <div class="summary-bar">
        <div class="sum-cell">
          <div class="sum-val">${stats.total_trades}</div>
          <div class="sum-label">Total Trades</div>
        </div>
        <div class="sum-cell">
          <div class="sum-val green">${stats.total_purchases}</div>
          <div class="sum-label">Purchases</div>
        </div>
        <div class="sum-cell">
          <div class="sum-val red">${stats.total_sales}</div>
          <div class="sum-label">Sales</div>
        </div>
        <div class="sum-cell">
          <div class="sum-val ticker-val">${stats.most_traded_ticker || '—'}</div>
          <div class="sum-label">Top Ticker</div>
        </div>
        <div class="sum-cell">
          <div class="sum-val" style="font-size:1rem;font-family:'IBM Plex Mono',monospace">${stats.most_recent_trade || '—'}</div>
          <div class="sum-label">Latest Trade</div>
        </div>
      </div>`;
  }

  function renderTopTickers(tickers) {
    if (!tickers.length) return '';
    return `
      <div class="section-label">Most Traded Tickers</div>
      <div class="tickers-grid">
        ${tickers.map(t => `
          <a href="/ticker/${t.ticker}" class="ticker-chip">
            <span class="chip-sym">${t.ticker}</span>
            <span class="chip-count">${t.trade_count}×</span>
          </a>`).join('')}
      </div>`;
  }

  function renderTrades(trades) {
    if (!trades.length) {
      return `
        <div class="section-label">Trade History</div>
        <div class="empty">No transactions on record yet.</div>`;
    }
    const rows = trades.map(t => `
      <tr>
        <td>${t.transaction_date || '—'}</td>
        <td class="td-ticker">${t.ticker
          ? `<a href="/ticker/${t.ticker}">${t.ticker}</a>`
          : '<span style="color:var(--muted)">—</span>'}</td>
        <td><span class="tx-badge ${txClass(t.transaction_type)}">${txLabel(t.transaction_type)}</span></td>
        <td style="font-size:0.78rem">${t.amount_band || '—'}</td>
        <td>${delayCell(t.filing_delay)}</td>
      </tr>`).join('');

    return `
      <div class="section-label">Full Trade History — ${trades.length} records</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Trade Date</th><th>Ticker</th><th>Type</th><th>Amount</th>
              <th>Filing Delay <span style="color:var(--amber)">▲&gt;30d</span> <span style="color:var(--red)">⚑&gt;40d</span></th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  function renderAlerts(alerts) {
    if (!alerts.length) return '';
    return `
      <div class="section-label">Recent Alerts — ${alerts.length} found</div>
      <div class="alerts-list">
        ${alerts.map((a, i) => `
          <div class="alert-card" id="ac${i}" onclick="this.classList.toggle('expanded')">
            <div class="alert-top">
              <span class="sev-badge sev-${a.severity}">${a.severity}</span>
              <span class="rule-badge">${a.rule}</span>
              ${a.ticker ? `<a href="/ticker/${a.ticker.split(' ')[0].replace('$','')}" onclick="event.stopPropagation()" style="font-family:IBM Plex Mono,monospace;font-size:0.65rem;color:var(--amber);border:1px solid rgba(200,146,42,0.25);padding:2px 7px;border-radius:3px;text-decoration:none">${a.ticker.split(' ')[0]}</a>` : ''}
              ${a.conflict_score > 0.3 ? `<span class="conflict-badge-pos" title="${a.conflict_explanation || ''}">↑ Cuts against funding profile</span>` : ''}
              ${a.conflict_score < -0.3 ? `<span class="conflict-badge-neg" title="${a.conflict_explanation || ''}">~ Aligns with funding profile</span>` : ''}
              <span class="alert-headline">${a.headline}</span>
              <span class="alert-time">${timeAgo(a.created_at)}</span>
            </div>
            ${a.detail ? `<div class="alert-detail-body">${a.detail}</div>` : ''}
          </div>`).join('')}
      </div>`;
  }

  function renderFundingProfile(funding) {
    if (!funding || !funding.has_data) {
      return `<div class="section-label">Funding Profile</div>
        <div class="empty">FEC data not yet available. Run bootstrap_fec.py to populate.</div>`;
    }

    const industries = Array.isArray(funding.top_industries) ? funding.top_industries : [];
    const pac = funding.pac_summary || {};
    const top_pacs = pac.top_pacs || [];

    const bars = industries.slice(0, 5).map(ind => `
      <div class="funding-row">
        <div class="funding-label">${ind.industry}</div>
        <div class="funding-bar-track">
          <div class="funding-bar-fill" style="width:${Math.min(ind.pct, 100)}%"></div>
        </div>
        <div class="funding-pct">${ind.pct}%</div>
      </div>`).join('');

    const pacs = top_pacs.slice(0, 5).map(p => `
      <div class="pac-item">
        <span>${p.name}</span>
        <span class="pac-amount">$${(p.amount || 0).toLocaleString()}</span>
      </div>`).join('');

    const raised = funding.total_raised
      ? `$${(funding.total_raised / 1e6).toFixed(1)}M raised` : '';

    return `
      <div class="section-label">Funding Profile ${raised ? '— ' + raised : ''}</div>
      <div class="funding-bar-wrap">${bars || '<div class="empty">No industry breakdown available.</div>'}</div>
      ${top_pacs.length ? `<div style="font-family:IBM Plex Mono,monospace;font-size:0.62rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin-bottom:0.4rem">Top PAC Contributions</div>
        <div class="pac-list">${pacs}</div>` : ''}
      ${funding.foreign_connected_pct > 0 ? `<div style="margin-top:0.6rem;font-size:0.78rem;color:var(--red)">⚑ Foreign-connected PAC funding: ${funding.foreign_connected_pct.toFixed(1)}%</div>` : ''}
      <div class="conflict-note">Trades that cut against this member's funding profile have historically been stronger signals. A purchase in a sector where this member receives minimal funding may indicate access to information beyond typical donor relationships.</div>`;
  }

  function renderSignalIntegrity(integrity) {
    if (!integrity || !integrity.has_data) return '';
    return `
      <div class="section-label">Historical Signal Accuracy</div>
      <div class="integrity-grid">
        <div class="int-cell">
          <div class="int-val">${integrity.win_rate}%</div>
          <div class="int-label">Win Rate (>5% 30d move)</div>
        </div>
        <div class="int-cell">
          <div class="int-val" style="color:${integrity.avg_return_30d >= 0 ? 'var(--green)' : 'var(--red)'}">
            ${integrity.avg_return_30d >= 0 ? '+' : ''}${integrity.avg_return_30d}%
          </div>
          <div class="int-label">Avg 30d Return After Disclosure</div>
        </div>
        <div class="int-cell">
          <div class="int-val">${integrity.backtested}</div>
          <div class="int-label">Backtested Trades</div>
        </div>
      </div>`;
  }

  async function load() {
    const [profileRes, fundingRes, integrityRes] = await Promise.all([
      fetch(`/members/${bioguideId}/profile`),
      fetch(`/api/member-funding/${bioguideId}`),
      fetch(`/api/signal-integrity/${bioguideId}`),
    ]);

    if (!profileRes.ok) {
      document.getElementById('content').innerHTML = '<div class="empty">Member not found.</div>';
      return;
    }
    const data      = await profileRes.json();
    const funding   = fundingRes.ok   ? await fundingRes.json()   : null;
    const integrity = integrityRes.ok ? await integrityRes.json() : null;

    const m = data.member;
    document.title = `${m.full_name} — Scope`;

    const congressUrl = `https://bioguide.congress.gov/search/bio/${bioguideId}`;
    const pClass = partyClass(m.party);

    document.getElementById('content').innerHTML = `
      <div class="member-header">
        <div class="member-name">${m.full_name}</div>
        <div class="member-badges">
          <span class="badge ${pClass}">${partyShort(m.party)}</span>
          ${m.state   ? `<span class="badge badge-state">${m.state}</span>` : ''}
          ${m.chamber ? `<span class="badge badge-chamber">${chamberShort(m.chamber)}</span>` : ''}
        </div>
        <a href="${congressUrl}" target="_blank" rel="noopener" class="congress-link">
          View on Congress.gov →
        </a>
      </div>

      ${renderSummaryBar(data.stats, m)}
      ${renderTopTickers(data.top_tickers)}
      ${renderFundingProfile(funding)}
      ${renderSignalIntegrity(integrity)}
      ${renderTrades(data.recent_trades)}
      ${renderAlerts(data.alerts)}
    `;
  }

  load();

  /* ── COMMAND PALETTE ── */
  let _cmdTimer = null, _cmdActive = -1;
  function openCmd() { document.getElementById('cmd-backdrop').classList.add('open'); document.getElementById('cmd-input').focus(); _cmdActive = -1; }
  function closeCmd() { document.getElementById('cmd-backdrop').classList.remove('open'); document.getElementById('cmd-input').value = ''; document.getElementById('cmd-results').innerHTML = '<div class=\"cmd-empty\">Type to search…</div>'; _cmdActive = -1; }
  document.addEventListener('keydown', e => {
    if ((e.metaKey||e.ctrlKey) && e.key==='k') { e.preventDefault(); openCmd(); return; }
    if (e.key==='Escape') { closeCmd(); return; }
    if (!document.getElementById('cmd-backdrop').classList.contains('open')) return;
    const items = document.querySelectorAll('.cmd-item');
    if (e.key==='ArrowDown') { e.preventDefault(); _cmdActive=Math.min(_cmdActive+1,items.length-1); items.forEach((el,i)=>el.classList.toggle('active',i===_cmdActive)); }
    if (e.key==='ArrowUp')   { e.preventDefault(); _cmdActive=Math.max(_cmdActive-1,0); items.forEach((el,i)=>el.classList.toggle('active',i===_cmdActive)); }
    if (e.key==='Enter'&&_cmdActive>=0) { items[_cmdActive]?.click(); closeCmd(); }
  });
  document.getElementById('cmd-input').addEventListener('input', e => { clearTimeout(_cmdTimer); _cmdTimer=setTimeout(()=>cmdSearch(e.target.value.trim()),200); });
  async function cmdSearch(q) {
    _cmdActive=-1;
    if (!q||q.length<2) { document.getElementById('cmd-results').innerHTML='<div class=\"cmd-empty\">Type to search…</div>'; return; }
    try {
      const c=new AbortController(); setTimeout(()=>c.abort(),5000);
      const r=await fetch('/api/search?q='+encodeURIComponent(q),{signal:c.signal});
      const d=await r.json(); let html='';
      if (d.tickers?.length) { html+='<div class=\"cmd-group-label\">Tickers</div>'; html+=d.tickers.map(t=>`<a class=\"cmd-item\" href=\"/ticker/${t.ticker}\"><span class=\"cmd-item-icon\">◎</span><div><div class=\"cmd-item-main\">${t.ticker}</div></div></a>`).join(''); }
      if (d.members?.length) { html+='<div class=\"cmd-group-label\">Members</div>'; html+=d.members.map(m=>`<a class=\"cmd-item\" href=\"/member/${m.bioguide_id}\"><span class=\"cmd-item-icon\">◈</span><div><div class=\"cmd-item-main\">${m.full_name}</div><div class=\"cmd-item-sub\">${m.state||''} · ${m.party||''}</div></div></a>`).join(''); }
      if (d.headlines?.length) { html+='<div class=\"cmd-group-label\">Signals</div>'; html+=d.headlines.map(h=>{ const rule=(h.rule||''); return `<a class=\"cmd-item\" href=\"/feed?ticker=${h.ticker||''}\"><span class=\"cmd-item-icon\">⚡</span><div><div class=\"cmd-item-main\">${(h.headline||'').slice(0,72)}</div><div class=\"cmd-item-sub\">${h.ticker||''} · ${rule}</div></div><span class=\"cmd-badge cmd-badge-${h.severity||'MEDIUM'}\">${h.severity||''}</span></a>`; }).join(''); }
      if (!html) html='<div class=\"cmd-empty\">No results for \"'+q+'\"</div>';
      document.getElementById('cmd-results').innerHTML=html;
    } catch { document.getElementById('cmd-results').innerHTML='<div class=\"cmd-empty\">Search failed.</div>'; }
  }
</script>
</body>
</html>
