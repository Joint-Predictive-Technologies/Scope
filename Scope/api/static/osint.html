<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSINT Globe — Scope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=IBM+Plex+Mono:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0b09; --bg2: #111009; --bg3: #181610;
      --cream: #e8e0cc; --cream2: #c8bfa8;
      --amber: #c8922a; --amber2: #e8aa3a;
      --muted: #7a7060; --border: #2a2620; --border2: #3a3428;
      --red: #c0392b; --green: #2a8a4a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--cream); font-family: Inter, sans-serif; min-height: 100vh; overflow-x: hidden; }

    nav { position: fixed; top: 0; z-index: 200; width: 100%; border-bottom: 1px solid var(--border); background: rgba(12,11,9,0.95); backdrop-filter: blur(12px); padding: 0 2rem; display: flex; align-items: center; gap: 1rem; height: 56px; }
    .nav-brand { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.2rem; color: var(--amber); letter-spacing: 0.05em; text-decoration: none; margin-right: 0.5rem; }
    .nav-links { display: flex; gap: 1.5rem; align-items: center; flex: 1; }
    .nav-links a { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; color: var(--cream2); text-decoration: none; letter-spacing: 0.06em; text-transform: uppercase; transition: color 0.2s; white-space: nowrap; }
    .nav-links a:hover, .nav-links a.active { color: var(--amber); }
    .hamburger { display: none; margin-left: auto; background: none; border: 1px solid var(--border2); color: var(--cream2); padding: 5px 9px; border-radius: 4px; cursor: pointer; font-size: 1rem; line-height: 1; }
    @media (max-width: 900px) {
      .hamburger { display: flex; }
      .nav-links { display: none; flex-direction: column; position: fixed; top: 56px; left: 0; right: 0; background: var(--bg); border-bottom: 1px solid var(--border); padding: 1.2rem 2rem; gap: 1rem; z-index: 199; }
      .nav-links.open { display: flex; }
    }

    /* Globe canvas — behind everything */
    #globe-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    /* Legend — top left */
    .legend {
      position: fixed; top: 72px; left: 1.5rem; z-index: 150;
      background: rgba(12,11,9,0.85); border: 1px solid var(--border2);
      border-radius: 6px; padding: 0.75rem 1rem;
      font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem;
      backdrop-filter: blur(8px);
    }
    .legend-title { color: var(--amber); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; font-size: 0.6rem; }
    .legend-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.3rem; color: var(--cream2); }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-dot.critical { background: #ff2020; box-shadow: 0 0 6px #ff2020; }
    .legend-dot.high { background: #ff7700; box-shadow: 0 0 6px #ff7700; }
    .legend-dot.medium { background: #ffcc00; box-shadow: 0 0 6px #ffcc00; }

    /* Side panel */
    .side-panel {
      position: fixed; top: 56px; right: 0; bottom: 40px;
      width: 0; overflow: hidden;
      background: rgba(12,11,9,0.97); border-left: 1px solid var(--border);
      z-index: 150; transition: width 0.3s ease;
      display: flex; flex-direction: column;
    }
    .side-panel.open { width: 340px; }
    .panel-inner { padding: 1.2rem 1.4rem; overflow-y: auto; flex: 1; min-width: 340px; }
    .panel-close {
      position: absolute; top: 0.8rem; right: 0.8rem;
      background: none; border: 1px solid var(--border2);
      color: var(--cream2); font-size: 0.8rem; cursor: pointer;
      padding: 3px 7px; border-radius: 3px; line-height: 1;
    }
    .panel-close:hover { color: var(--amber); border-color: var(--amber); }
    .panel-region { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; color: var(--cream); margin-bottom: 0.2rem; margin-top: 0.2rem; }
    .panel-sub { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; color: var(--muted); margin-bottom: 0.8rem; }
    .panel-divider { height: 1px; background: var(--border); margin: 0.8rem 0; }
    .panel-signals { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--cream2); margin-bottom: 0.5rem; }
    .panel-tickers { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
    .panel-ticker { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; color: var(--amber); border: 1px solid rgba(200,146,42,0.25); padding: 2px 8px; border-radius: 3px; text-decoration: none; }
    .panel-ticker:hover { background: rgba(200,146,42,0.1); }
    .panel-view-link { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; color: var(--amber); text-decoration: none; border: 1px solid rgba(200,146,42,0.3); padding: 4px 12px; border-radius: 3px; margin-bottom: 0.8rem; }
    .panel-view-link:hover { background: rgba(200,146,42,0.1); }
    .panel-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); margin-bottom: 0.4rem; margin-top: 0.7rem; }
    .panel-summary { font-size: 0.82rem; color: var(--cream2); line-height: 1.65; }
    .panel-loading { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--muted); }
    .panel-loading span { animation: pulse 1.2s ease-in-out infinite; display: inline-block; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    .badge { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 3px; font-weight: 500; }
    .badge-CRITICAL { background: rgba(192,57,43,0.18); color: #e55b4d; border: 1px solid rgba(192,57,43,0.3); }
    .badge-HIGH { background: rgba(200,146,42,0.15); color: var(--amber2); border: 1px solid rgba(200,146,42,0.3); }
    .badge-MEDIUM { background: rgba(42,100,160,0.15); color: #6ab0e0; border: 1px solid rgba(42,100,160,0.25); }

    .panel-corr-list { list-style: none; margin-top: 0.3rem; }
    .panel-corr-list li { font-size: 0.78rem; color: var(--cream2); padding: 0.3rem 0; border-bottom: 1px solid var(--border); line-height: 1.4; }
    .panel-corr-list li:last-child { border-bottom: none; }
    .panel-corr-list li::before { content: "• "; color: var(--amber); }

    .panel-dossier-link { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--amber); text-decoration: none; border: 1px solid rgba(200,146,42,0.3); padding: 7px 12px; border-radius: 4px; text-align: center; margin-top: 1rem; transition: background 0.15s; }
    .panel-dossier-link:hover { background: rgba(200,146,42,0.1); }

    /* Bottom conflict tape */
    .conflict-tape {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 40px; z-index: 150;
      background: var(--bg2); border-top: 1px solid var(--border);
      overflow: hidden; white-space: nowrap; display: flex; align-items: center;
    }
    .tape-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); padding: 0 1rem; flex-shrink: 0; border-right: 1px solid var(--border2); }
    .tape-scroll { flex: 1; overflow: hidden; height: 40px; display: flex; align-items: center; }
    .tape-inner { display: inline-flex; gap: 3rem; animation: tape-scroll 60s linear infinite; }
    .tape-item { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; color: var(--cream2); white-space: nowrap; }
    .tape-item .src { color: var(--amber); margin-right: 0.4rem; }
    @keyframes tape-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* Mobile fallback — show list instead of globe */
    .mobile-list { display: none; padding: 1rem 1.5rem; padding-top: 72px; padding-bottom: 50px; }
    .mobile-list h2 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--cream); margin-bottom: 1rem; }
    .region-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 0.9rem 1.2rem; margin-bottom: 0.5rem; text-decoration: none; display: block; transition: border-color 0.15s; }
    .region-card:hover { border-color: var(--border2); }
    .region-name { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--cream); margin-bottom: 0.3rem; }
    .region-meta { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; color: var(--muted); }

    @media (max-width: 768px) {
      #globe-canvas { display: none; }
      .legend { display: none; }
      .side-panel { display: none; }
      .mobile-list { display: block; }
    }
  </style>
</head>
<body>
<!-- NOTHING renders above this line except the nav -->
<nav>
  <a href="/" class="nav-brand">◈ SCOPE</a>
  <button class="hamburger" id="ham-btn">☰</button>
  <div class="nav-links" id="nav-links">
    <a href="/">Dashboard</a>
    <a href="/congress">Congress</a>
    <a href="/insiders">Insiders</a>
    <a href="/contracts">Contracts</a>
    <a href="/lobbying">Lobbying</a>
    <a href="/osint" class="active">OSINT Globe</a>
    <a href="/ask">Ask Scope</a>
    <a href="/feed">Alerts</a>
  </div>
</nav>

<!-- Desktop globe canvas -->
<canvas id="globe-canvas"></canvas>

<!-- Severity legend -->
<div class="legend">
  <div class="legend-title">Signal Severity</div>
  <div class="legend-row"><div class="legend-dot critical"></div>Critical</div>
  <div class="legend-row"><div class="legend-dot high"></div>High</div>
  <div class="legend-row"><div class="legend-dot medium"></div>Medium</div>
</div>

<!-- Side panel (opens on hotspot click) -->
<div class="side-panel" id="side-panel">
  <button class="panel-close" id="panel-close">✕</button>
  <div class="panel-inner" id="panel-inner">
    <!-- filled by JS -->
  </div>
</div>

<!-- Mobile fallback list -->
<div class="mobile-list">
  <h2>Active Regions</h2>
  <div id="mobile-regions"><div style="color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:0.75rem">Loading…</div></div>
</div>

<!-- Bottom conflict RSS tape -->
<div class="conflict-tape" id="conflict-tape">
  <div class="tape-label">Conflict Feed</div>
  <div class="tape-scroll">
    <div class="tape-inner" id="tape-inner">
      <span class="tape-item" style="color:var(--muted)">Loading conflict news…</span>
    </div>
  </div>
</div>

<!-- Three.js + OrbitControls -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
  // ── Nav hamburger ──────────────────────────────────────────────────────────
  document.getElementById('ham-btn').addEventListener('click', () => {
    document.getElementById('nav-links').classList.toggle('open');
  });

  // ── Utilities ──────────────────────────────────────────────────────────────
  function timeAgo(dateStr) {
    if (!dateStr) return '';
    const ts = new Date(dateStr.replace(' ', 'T') + (dateStr.includes('Z') ? '' : 'Z')).getTime();
    if (isNaN(ts)) return '';
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60) return `${diff}s ago`;
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    return `${Math.floor(diff / 86400)}d ago`;
  }

  // ── Lat/Lon → Three.js Vec3 ────────────────────────────────────────────────
  function latLonToVec3(lat, lng, r) {
    const phi   = (90 - lat) * Math.PI / 180;
    const theta = (lng + 180) * Math.PI / 180;
    return new THREE.Vector3(
      -r * Math.sin(phi) * Math.cos(theta),
       r * Math.cos(phi),
       r * Math.sin(phi) * Math.sin(theta)
    );
  }

  // ── Severity helpers ────────────────────────────────────────────────────────
  const SEV_COLOR = { CRITICAL: 0xff2020, HIGH: 0xff7700, MEDIUM: 0xffcc00 };
  const SEV_SIZE  = { CRITICAL: 4, HIGH: 3, MEDIUM: 2 };

  // ── Globe state ─────────────────────────────────────────────────────────────
  let scene, camera, renderer, controls, animId;
  let hotspotMeshes = [];
  let hotspotData   = [];
  let pulsers       = []; // { torus, phase }

  const GLOBE_R = 200;

  function initGlobe() {
    const canvas = document.getElementById('globe-canvas');
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x0c0b09, 1);

    scene = new THREE.Scene();

    // Camera
    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 4000);
    camera.position.set(0, 0, 600);

    // Lights
    scene.add(new THREE.AmbientLight(0x404040, 1.2));
    const dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(5, 3, 5);
    scene.add(dir);

    // Globe sphere
    const sphereGeo = new THREE.SphereGeometry(GLOBE_R, 64, 64);
    const sphereMat = new THREE.MeshPhongMaterial({ color: 0x0a1628, shininess: 40 });
    const sphere = new THREE.Mesh(sphereGeo, sphereMat);
    scene.add(sphere);

    // Wireframe overlay
    const wireGeo = new THREE.SphereGeometry(GLOBE_R + 0.5, 32, 32);
    const edges   = new THREE.EdgesGeometry(wireGeo);
    const wireMat = new THREE.LineBasicMaterial({ color: 0x1a3a5c, transparent: true, opacity: 0.3 });
    const wire    = new THREE.LineSegments(edges, wireMat);
    scene.add(wire);

    // OrbitControls
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping    = true;
    controls.dampingFactor    = 0.05;
    controls.autoRotate       = true;
    controls.autoRotateSpeed  = 0.3;
    controls.minDistance      = 250;
    controls.maxDistance      = 1200;

    // Click handler for raycasting
    renderer.domElement.addEventListener('click', onGlobeClick);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  }

  function animate() {
    animId = requestAnimationFrame(animate);
    const t = performance.now() / 1000;

    // Pulse rings: scale sinusoidally
    pulsers.forEach(p => {
      const s = 1 + Math.abs(Math.sin((t + p.phase) * Math.PI / 2)) * 1.2;
      p.torus.scale.set(s, s, s);
      p.torus.material.opacity = 0.6 - (s - 1) / 1.2 * 0.5;
    });

    controls.update();
    renderer.render(scene, camera);
  }

  function addHotspot(hs) {
    const pos  = latLonToVec3(hs.lat, hs.lng, GLOBE_R + 2);
    const color = SEV_COLOR[hs.severity] || 0xffcc00;
    const size  = SEV_SIZE[hs.severity]  || 2;

    // Dot
    const geo = new THREE.SphereGeometry(size, 12, 12);
    const mat = new THREE.MeshBasicMaterial({ color });
    const dot = new THREE.Mesh(geo, mat);
    dot.position.copy(pos);
    scene.add(dot);
    hotspotMeshes.push(dot);

    // Pulsing torus
    const tGeo = new THREE.TorusGeometry(size * 2, size * 0.3, 8, 24);
    const tMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.6, side: THREE.DoubleSide });
    const torus = new THREE.Mesh(tGeo, tMat);
    torus.position.copy(pos);
    // Orient torus to face camera direction (outward from globe)
    torus.lookAt(0, 0, 0);
    scene.add(torus);
    pulsers.push({ torus, phase: Math.random() * 2 });

    return dot;
  }

  function buildHotspots(data) {
    hotspotData = data;
    data.forEach(hs => addHotspot(hs));
  }

  // ── Raycaster ───────────────────────────────────────────────────────────────
  function onGlobeClick(e) {
    const rect = renderer.domElement.getBoundingClientRect();
    const mouse = new THREE.Vector2(
      ((e.clientX - rect.left) / rect.width)  * 2 - 1,
      -((e.clientY - rect.top)  / rect.height) * 2 + 1
    );
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(hotspotMeshes);
    if (hits.length > 0) {
      const idx  = hotspotMeshes.indexOf(hits[0].object);
      const hs   = hotspotData[idx];
      if (hs) openPanel(hs);
    } else {
      closePanel();
    }
  }

  // ── Side Panel ──────────────────────────────────────────────────────────────
  function openPanel(hs) {
    controls.autoRotate = false;
    const panel = document.getElementById('side-panel');
    const inner = document.getElementById('panel-inner');
    panel.classList.add('open');

    const tickerLinks = (hs.ticker_list || []).map(t =>
      `<a href="/ticker/${t}" class="panel-ticker">$${t}</a>`
    ).join('');

    inner.innerHTML = `
      <div style="margin-top:0.5rem; display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap;">
        <span class="badge badge-${hs.severity}">${hs.severity}</span>
      </div>
      <div class="panel-region">${hs.region}</div>
      <div class="panel-sub">${hs.count} active signal${hs.count !== 1 ? 's' : ''} · last ${timeAgo(hs.last_at)}</div>
      <div class="panel-divider"></div>
      <div class="panel-label">Affected Tickers</div>
      <div class="panel-tickers">${tickerLinks || '<span style="color:var(--muted);font-size:0.7rem">None mapped</span>'}</div>
      <a href="/feed?rule=RULE_OSINT" class="panel-view-link">View signals →</a>
      <div class="panel-divider"></div>
      <div class="panel-label">AI Summary</div>
      <div class="panel-summary" id="panel-summary">
        <span class="panel-loading"><span>Generating…</span></span>
      </div>
      <div class="panel-divider"></div>
      <div class="panel-label">Corroborating Signals</div>
      <ul class="panel-corr-list" id="panel-corr"></ul>
      <a href="/region/${encodeURIComponent(hs.region)}" class="panel-dossier-link">Full Region Dossier →</a>
    `;

    // Lazy-load AI summary
    loadPanelSummary(hs.region);

    // Lazy-load corroborating alerts
    loadPanelCorr(hs);
  }

  async function loadPanelSummary(region) {
    const el = document.getElementById('panel-summary');
    if (!el) return;
    const timeout = setTimeout(() => {
      if (el) el.innerHTML = '<span style="color:var(--muted)">Summary timed out.</span>';
    }, 8000);
    try {
      const r = await fetch(`/api/osint-summary?region=${encodeURIComponent(region)}`);
      const d = await r.json();
      clearTimeout(timeout);
      if (el) el.textContent = d.summary || 'No summary available.';
    } catch {
      clearTimeout(timeout);
      if (el) el.innerHTML = '<span style="color:var(--muted)">Unable to load summary.</span>';
    }
  }

  async function loadPanelCorr(hs) {
    const el = document.getElementById('panel-corr');
    if (!el) return;
    const tickers = (hs.ticker_list || []).slice(0, 3);
    if (!tickers.length) {
      el.innerHTML = '<li>No related signals found.</li>';
      return;
    }
    try {
      const promises = tickers.map(t =>
        fetch(`/alerts?ticker=${t}&days=30&limit=3`).then(r => r.json()).catch(() => ({ items: [] }))
      );
      const results = await Promise.all(promises);
      const items = results.flatMap(r => (r.items || []).filter(a => a.rule !== 'RULE_OSINT')).slice(0, 5);
      if (!items.length) {
        el.innerHTML = '<li>No corroborating signals found.</li>';
        return;
      }
      el.innerHTML = items.map(a =>
        `<li><strong style="color:var(--amber)">${a.ticker || ''}</strong> ${a.headline}</li>`
      ).join('');
    } catch {
      el.innerHTML = '<li>Unable to load related signals.</li>';
    }
  }

  function closePanel() {
    document.getElementById('side-panel').classList.remove('open');
    if (controls) controls.autoRotate = true;
  }

  document.getElementById('panel-close').addEventListener('click', closePanel);

  // ── Conflict tape ────────────────────────────────────────────────────────────
  async function loadConflictTape() {
    try {
      const r = await fetch('/api/conflict-news');
      const data = await r.json();
      if (!data.length) return;

      const doubled = [...data, ...data]; // loop seamlessly
      const tapeEl  = document.getElementById('tape-inner');
      tapeEl.innerHTML = doubled.map(item => {
        const src = item.source || 'OSINT';
        const title = item.title || '';
        const url   = item.url;
        return url
          ? `<a href="${url}" target="_blank" rel="noopener" class="tape-item" style="color:var(--cream2);text-decoration:none"><span class="src">${src}</span>${title}</a>`
          : `<span class="tape-item"><span class="src">${src}</span>${title}</span>`;
      }).join('');

      // Adjust animation duration based on item count
      const duration = Math.max(40, doubled.length * 4);
      tapeEl.style.animationDuration = `${duration}s`;
    } catch {
      // silent fail
    }
  }

  // ── Mobile list ──────────────────────────────────────────────────────────────
  async function loadMobileList() {
    if (window.innerWidth >= 768) return;
    const el = document.getElementById('mobile-regions');
    try {
      const r = await fetch('/api/osint-hotspots');
      const data = await r.json();
      if (!data.length) {
        el.innerHTML = '<div style="color:var(--muted);font-family:\'IBM Plex Mono\',monospace;font-size:0.75rem">No active hotspots.</div>';
        return;
      }
      data.sort((a, b) => {
        const r = { CRITICAL: 3, HIGH: 2, MEDIUM: 1 };
        return (r[b.severity] || 0) - (r[a.severity] || 0);
      });
      el.innerHTML = data.map(hs => `
        <a href="/region/${encodeURIComponent(hs.region)}" class="region-card">
          <div style="display:flex;align-items:center;gap:0.6rem;margin-bottom:0.3rem;">
            <span class="badge badge-${hs.severity}">${hs.severity}</span>
            <span class="region-name">${hs.region}</span>
          </div>
          <div class="region-meta">${hs.count} signal${hs.count !== 1 ? 's' : ''} · ${timeAgo(hs.last_at)}</div>
        </a>
      `).join('');
    } catch {
      el.innerHTML = '<div style="color:var(--muted);font-family:\'IBM Plex Mono\',monospace;font-size:0.75rem">Failed to load regions.</div>';
    }
  }

  // ── Init ─────────────────────────────────────────────────────────────────────
  async function init() {
    // Desktop globe
    if (window.innerWidth >= 768) {
      initGlobe();
      try {
        const r = await fetch('/api/osint-hotspots');
        const data = await r.json();
        buildHotspots(data);
      } catch {
        // silent — globe still shows without hotspots
      }
    }

    loadMobileList();
    loadConflictTape();
  }

  init();
</script>
</body>
