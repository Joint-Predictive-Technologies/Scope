<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSINT Globe — Scope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/tokens.css"/>
  <script src="/rule-names.js"></script>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--cream); font-family: Inter, sans-serif; min-height: 100vh; overflow-x: hidden; }

    nav { position: fixed; top: 0; z-index: 200; width: 100%; border-bottom: 1px solid var(--border); background: rgba(12,11,9,0.95); backdrop-filter: blur(12px); padding: 0 2rem; display: flex; align-items: center; gap: 1rem; height: 56px; }
    .nav-brand { font-family: var(--font-sans); font-weight: 900; font-size: 1.2rem; color: var(--amber); letter-spacing: 0.05em; text-decoration: none; margin-right: 0.5rem; }
    .nav-links { display: flex; gap: 1.5rem; align-items: center; flex: 1; }
    .nav-links a { font-family: var(--font-mono); font-size: 0.68rem; color: var(--cream2); text-decoration: none; letter-spacing: 0.06em; text-transform: uppercase; transition: color 0.2s; white-space: nowrap; }
    .nav-links a:hover, .nav-links a.active { color: var(--amber); }
    .hamburger { display: none; margin-left: auto; background: none; border: 1px solid var(--border2); color: var(--cream2); padding: 9px 13px; border-radius: 4px; cursor: pointer; font-size: 1rem; line-height: 1; }
    @media (max-width: 900px) {
      .hamburger { display: flex; }
      .nav-links { display: none; flex-direction: column; position: fixed; top: 56px; left: 0; right: 0; background: var(--bg); border-bottom: 1px solid var(--border); padding: 1.2rem 2rem; gap: 1rem; z-index: 199; }
      .nav-links.open { display: flex; }
    }

    /* Globe canvas — behind everything */
    #globe-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    /* Legend — top left */
    .legend {
      position: fixed; top: 72px; left: 1.5rem; z-index: 150;
      background: rgba(12,11,9,0.85); border: 1px solid var(--border2);
      border-radius: 6px; padding: 0.75rem 1rem;
      font-family: var(--font-mono); font-size: 0.65rem;
      backdrop-filter: blur(8px);
    }
    .legend-title { color: var(--amber); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; font-size: 0.6rem; }
    .legend-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.3rem; color: var(--cream2); }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-dot.critical { background: var(--severity-critical); }
    .legend-dot.high { background: var(--severity-high); }
    .legend-dot.medium { background: var(--severity-medium); }

    /* Side panel */
    .side-panel {
      position: fixed; top: 56px; right: 0; bottom: 40px;
      width: 0; overflow: hidden;
      background: rgba(12,11,9,0.97); border-left: 1px solid var(--border);
      z-index: 150; transition: width 0.3s ease;
      display: flex; flex-direction: column;
    }
    .side-panel.open { width: 340px; }
    .panel-inner { padding: 1.2rem 1.4rem; overflow-y: auto; flex: 1; min-width: 340px; }
    .panel-close {
      position: absolute; top: 0.8rem; right: 0.8rem;
      background: none; border: 1px solid var(--border2);
      color: var(--cream2); font-size: 0.8rem; cursor: pointer;
      padding: 3px 7px; border-radius: 3px; line-height: 1;
    }
    .panel-close:hover { color: var(--amber); border-color: var(--amber); }
    .panel-region { font-family: var(--font-sans); font-size: 1.2rem; font-weight: 700; color: var(--cream); margin-bottom: 0.2rem; margin-top: 0.2rem; }
    .panel-sub { font-family: var(--font-mono); font-size: 0.65rem; color: var(--muted); margin-bottom: 0.8rem; }
    .panel-divider { height: 1px; background: var(--border); margin: 0.8rem 0; }
    .panel-signals { font-family: var(--font-mono); font-size: 0.72rem; color: var(--cream2); margin-bottom: 0.5rem; }
    .panel-tickers { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
    .panel-ticker { font-family: var(--font-mono); font-size: 0.65rem; color: var(--amber); border: 1px solid rgba(200,146,42,0.25); padding: 2px 8px; border-radius: 3px; text-decoration: none; }
    .panel-ticker:hover { background: rgba(200,146,42,0.1); }
    .panel-view-link { display: inline-block; font-family: var(--font-mono); font-size: 0.65rem; color: var(--amber); text-decoration: none; border: 1px solid rgba(200,146,42,0.3); padding: 4px 12px; border-radius: 3px; margin-bottom: 0.8rem; }
    .panel-view-link:hover { background: rgba(200,146,42,0.1); }
    .panel-label { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); margin-bottom: 0.4rem; margin-top: 0.7rem; }
    .panel-summary { font-size: 0.82rem; color: var(--cream2); line-height: 1.65; }
    .panel-loading { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
    .panel-loading span { animation: pulse 1.2s ease-in-out infinite; display: inline-block; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    .badge { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 3px; font-weight: 500; }
    .badge-CRITICAL { background: color-mix(in srgb, var(--severity-critical) 15%, transparent); color: var(--severity-critical); border: 1px solid var(--severity-critical); }
    .badge-HIGH { background: color-mix(in srgb, var(--severity-high) 15%, transparent); color: var(--severity-high); border: 1px solid var(--severity-high); }
    .badge-MEDIUM { background: color-mix(in srgb, var(--severity-medium) 15%, transparent); color: var(--severity-medium); border: 1px solid var(--severity-medium); }

    .panel-corr-list { list-style: none; margin-top: 0.3rem; }
    .panel-corr-list li { font-size: 0.78rem; color: var(--cream2); padding: 0.3rem 0; border-bottom: 1px solid var(--border); line-height: 1.4; }
    .panel-corr-list li:last-child { border-bottom: none; }
    .panel-corr-list li::before { content: "• "; color: var(--amber); }

    .panel-dossier-link { display: block; font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--amber); text-decoration: none; border: 1px solid rgba(200,146,42,0.3); padding: 7px 12px; border-radius: 4px; text-align: center; margin-top: 1rem; transition: background 0.15s; }
    .panel-dossier-link:hover { background: rgba(200,146,42,0.1); }

    /* Bottom conflict tape */
    .conflict-tape {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 40px; z-index: 150;
      background: var(--bg2); border-top: 1px solid var(--border);
      overflow: hidden; white-space: nowrap; display: flex; align-items: center;
    }
    .tape-label { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); padding: 0 1rem; flex-shrink: 0; border-right: 1px solid var(--border2); }
    .tape-scroll { flex: 1; overflow: hidden; height: 40px; display: flex; align-items: center; }
    .tape-inner { display: inline-flex; gap: 3rem; animation: tape-scroll 60s linear infinite; }
    .tape-item { font-family: var(--font-mono); font-size: 0.65rem; color: var(--cream2); white-space: nowrap; }
    .tape-item .src { color: var(--amber); margin-right: 0.4rem; }
    @keyframes tape-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* Mobile fallback — show list instead of globe */
    .mobile-list { display: none; padding: 1rem 1.5rem; padding-top: 72px; padding-bottom: 50px; }
    .mobile-list h2 { font-family: var(--font-sans); font-size: 1.4rem; color: var(--cream); margin-bottom: 1rem; }
    .region-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 0.9rem 1.2rem; margin-bottom: 0.5rem; text-decoration: none; display: block; transition: border-color 0.15s; }
    .region-card:hover { border-color: var(--border2); }
    .region-name { font-family: var(--font-sans); font-size: 1rem; color: var(--cream); margin-bottom: 0.3rem; }
    .region-meta { font-family: var(--font-mono); font-size: 0.65rem; color: var(--muted); }

    @media (max-width: 768px) {
      #globe-canvas { display: none; }
      .legend { display: none; }
      .side-panel { display: none; }
      .mobile-list { display: block; }
    }

    /* ── CMD PALETTE ── */
    #cmd-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:9000; backdrop-filter:blur(4px); }
    #cmd-backdrop.open { display:flex; align-items:flex-start; justify-content:center; padding-top:12vh; }
    #cmd-box { background:#1a1814; border:1px solid #3a3428; border-radius:10px; width:min(640px,92vw); overflow:hidden; }
    #cmd-input { width:100%; background:transparent; border:none; border-bottom:1px solid #2a2620; outline:none; font-family:var(--font-mono); font-size:0.9rem; color:#e8e0cc; padding:1rem 1.2rem; }
    #cmd-results { max-height:360px; overflow-y:auto; }
    .cmd-group-label { font-family:var(--font-mono); font-size:0.6rem; letter-spacing:0.12em; text-transform:uppercase; color:#7a7060; padding:0.6rem 1.2rem 0.2rem; }
    .cmd-item { display:flex; align-items:center; gap:0.8rem; padding:0.65rem 1.2rem; cursor:pointer; text-decoration:none; border-left:2px solid transparent; }
    .cmd-item:hover,.cmd-item.active { background:#222018; border-left-color:#c8922a; }
    .cmd-item-icon { font-size:0.9rem; opacity:0.6; width:18px; text-align:center; flex-shrink:0; }
    .cmd-item-main { font-family:var(--font-mono); font-size:0.75rem; color:#e8e0cc; }
    .cmd-item-sub  { font-size:0.68rem; color:#7a7060; margin-top:1px; }
    .cmd-badge { font-family:var(--font-mono); font-size:0.55rem; padding:1px 5px; border-radius:2px; margin-left:auto; flex-shrink:0; }
    .cmd-badge-CRITICAL { background:rgba(229,91,77,0.2); color:#e55b4d; }
    .cmd-badge-HIGH     { background:rgba(200,146,42,0.2); color:#c8922a; }
    .cmd-badge-MEDIUM   { background:rgba(106,176,224,0.2); color:#6ab0e0; }
    .cmd-empty { font-family:var(--font-mono); font-size:0.75rem; color:#7a7060; padding:1.5rem 1.2rem; text-align:center; }
    .cmd-hint { font-family:var(--font-mono); font-size:0.58rem; color:#7a7060; padding:0.5rem 1.2rem; border-top:1px solid #2a2620; display:flex; gap:1.2rem; }
    .cmd-hint kbd { background:#2a2620; border:1px solid #3a3428; border-radius:3px; padding:1px 5px; font-family:inherit; font-size:0.58rem; color:#c8bfa8; }
  </style>
</head>
<body>
<!-- NOTHING renders above this line except the nav -->
<nav>
  <a href="/" class="nav-brand">◈ SCOPE</a>
  <button class="hamburger" id="ham-btn">☰</button>
  <div class="nav-links" id="nav-links">
    <a href="/">Brief</a><a href="/home">Dashboard</a>
    <a href="/feed">Alerts <span class="nav-badge" id="alert-badge" style="display:none"></span></a>
    <a href="/congress">Congress</a>
    <a href="/insiders">Insiders</a>
    <a href="/contracts">Contracts</a>
    <a href="/lobbying">Lobbying</a>
    <a href="/intelligence">Intelligence</a>
    <a href="/clusters">Clusters</a>
    <a href="/osint" class="active">OSINT Globe</a>

  </div>
</nav>

<!-- CMD PALETTE -->
<div id="cmd-backdrop" onclick="if(event.target===this)closeCmd()">
  <div id="cmd-box">
    <input id="cmd-input" placeholder="Search tickers, members, headlines…" autocomplete="off" />
    <div id="cmd-results"><div class="cmd-empty">Type to search…</div></div>
    <div class="cmd-hint"><span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>
  </div>
</div>


<!-- Desktop globe canvas -->
<canvas id="globe-canvas"></canvas>

<!-- Severity legend -->
<div class="legend">
  <div class="legend-title">Signal Severity</div>
  <div class="legend-row"><div class="legend-dot critical"></div>Critical</div>
  <div class="legend-row"><div class="legend-dot high"></div>High</div>
  <div class="legend-row"><div class="legend-dot medium"></div>Medium</div>
</div>

<!-- Side panel (opens on hotspot click) -->
<div class="side-panel" id="side-panel">

  </div>

<!-- Mobile fallback list -->
<div class="mobile-list">

</div>

<!-- Bottom conflict RSS tape -->
<div class="conflict-tape" id="conflict-tape">
  <div class="tape-label">Conflict Feed</div>
  <div class="tape-scroll">
    <div class="tape-inner" id="tape-inner">
      <span class="tape-item" style="color:var(--muted)">Loading conflict news…</span>
    </div>
  </div>
</div>

<!-- Three.js + OrbitControls -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
  // ── Nav hamburger ──────────────────────────────────────────────────────────
  document.getElementById('ham-btn').addEventListener('click', () => {
    document.getElementById('nav-links').classList.toggle('open');
  });

  // ── Utilities ──────────────────────────────────────────────────────────────
  function timeAgo(dateStr) {
    if (!dateStr) return '';
    const ts = new Date(dateStr.replace(' ', 'T') + (dateStr.includes('Z') ? '' : 'Z')).getTime();
    if (isNaN(ts)) return '';
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60) return `${diff}s ago`;
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    return `${Math.floor(diff / 86400)}d ago`;
  }

  // ── Lat/Lon → Three.js Vec3 ────────────────────────────────────────────────
  function latLonToVec3(lat, lng, r) {
    const phi   = (90 - lat) * Math.PI / 180;
    const theta = (lng + 180) * Math.PI / 180;
    return new THREE.Vector3(
      -r * Math.sin(phi) * Math.cos(theta),
       r * Math.cos(phi),
       r * Math.sin(phi) * Math.sin(theta)
    );
  }

  // ── Severity helpers ────────────────────────────────────────────────────────
  // Severity → design severity tokens (hex mirrors tokens.css; WebGL can't read
  // CSS vars). Copper/orange/red instead of the old uniform bright-red noise.
  const SEV_COLOR = { CRITICAL: 0xe06868, HIGH: 0xe88b4a, MEDIUM: 0xc89664 };
  // Dot size is driven by SIGNAL COUNT (below), not severity — bigger = busier.
  const dotSize = (count) => Math.max(1.8, Math.min(7.5, 1.8 + Math.sqrt(count || 1) * 1.1));

  // ── Globe state ─────────────────────────────────────────────────────────────
  let scene, camera, renderer, controls, animId;
  let hotspotMeshes = [];
  let hotspotData   = [];
  let pulsers       = []; // { torus, phase }

  const GLOBE_R = 200;

  function initGlobe() {
    const canvas = document.getElementById('globe-canvas');
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x0a0a0c, 1);   // ocean/void == --surface-canvas

    scene = new THREE.Scene();

    // Camera
    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 4000);
    camera.position.set(0, 0, 600);

    // Lights — sun-like for satellite look
    // Neutral, dim lighting — a dark instrument globe, not a bright satellite photo.
    scene.add(new THREE.AmbientLight(0x2a2a30, 0.75));
    const sun = new THREE.DirectionalLight(0xffffff, 0.85);
    sun.position.set(5, 3, 5);
    scene.add(sun);

    // Globe sphere: Blue Marble relief tinted dark so oceans read near
    // --surface-canvas and landmasses near --surface-2 — geography stays legible
    // but muted, no photographic ornament.
    const texLoader = new THREE.TextureLoader();
    const earthTex  = texLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
    const sphereGeo = new THREE.SphereGeometry(GLOBE_R, 64, 64);
    const sphereMat = new THREE.MeshPhongMaterial({ map: earthTex, color: 0x3a3a42, shininess: 2 });
    const sphere    = new THREE.Mesh(sphereGeo, sphereMat);
    scene.add(sphere);

    // Atmosphere glow removed — the design system is glow/bloom-free.

    // OrbitControls
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping    = true;
    controls.dampingFactor    = 0.05;
    controls.autoRotate       = true;
    controls.autoRotateSpeed  = 0.3;
    controls.minDistance      = 250;
    controls.maxDistance      = 1200;

    // Click handler for raycasting
    renderer.domElement.addEventListener('click', onGlobeClick);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  }

  function animate() {
    animId = requestAnimationFrame(animate);
    const t = performance.now() / 1000;

    // Pulse rings: scale sinusoidally
    pulsers.forEach(p => {
      const s = 1 + Math.abs(Math.sin((t + p.phase) * Math.PI / 2)) * 1.2;
      p.torus.scale.set(s, s, s);
      p.torus.material.opacity = 0.6 - (s - 1) / 1.2 * 0.5;
    });

    controls.update();
    renderer.render(scene, camera);
  }

  function addHotspot(hs) {
    const pos  = latLonToVec3(hs.lat, hs.lng, GLOBE_R + 2);
    const color = SEV_COLOR[hs.severity] || 0xc89664;
    const size  = dotSize(hs.count);   // size by signal count, not severity

    // Dot
    const geo = new THREE.SphereGeometry(size, 12, 12);
    const mat = new THREE.MeshBasicMaterial({ color });
    const dot = new THREE.Mesh(geo, mat);
    dot.position.copy(pos);
    dot.userData.baseSize = size;      // for hover-expand
    scene.add(dot);
    hotspotMeshes.push(dot);

    // A single hairline ring marks the dot as a point of interest — static, no
    // continuous pulse (the globe is an instrument, not an animation).
    const tGeo = new THREE.TorusGeometry(size * 1.7, Math.max(0.25, size * 0.14), 8, 28);
    const tMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
    const torus = new THREE.Mesh(tGeo, tMat);
    torus.position.copy(pos);
    // Orient torus to face camera direction (outward from globe)
    torus.lookAt(0, 0, 0);
    scene.add(torus);
    // (No pulsers.push — the ring is static; the globe carries no idle animation.)

    return dot;
  }

  function buildHotspots(data) {
    hotspotData = data;
    data.forEach(hs => addHotspot(hs));
  }

  // ── Raycaster ───────────────────────────────────────────────────────────────
  function onGlobeClick(e) {
    const rect = renderer.domElement.getBoundingClientRect();
    const mouse = new THREE.Vector2(
      ((e.clientX - rect.left) / rect.width)  * 2 - 1,
      -((e.clientY - rect.top)  / rect.height) * 2 + 1
    );
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(hotspotMeshes);
    if (hits.length > 0) {
      const idx  = hotspotMeshes.indexOf(hits[0].object);
      const hs   = hotspotData[idx];
      if (hs) openPanel(hs);
    } else {
      closePanel();
    }
  }

  // ── Side Panel ──────────────────────────────────────────────────────────────
  function openPanel(hs) {
    controls.autoRotate = false;
    const panel = document.getElementById('side-panel');
    const inner = document.getElementById('panel-inner');
    panel.classList.add('open');

    const tickerLinks = (hs.ticker_list || []).map(t =>
      `<a href="/ticker/${t}" class="panel-ticker">$${t}</a>`
    ).join('');

    inner.innerHTML = `
      <div style="margin-top:0.5rem; display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap;">
        <span class="badge badge-${hs.severity}">${hs.severity}</span>
      </div>
      <div class="panel-region">${hs.region}</div>
      <div class="panel-sub">${hs.count} active signal${hs.count !== 1 ? 's' : ''} · last ${timeAgo(hs.last_at)}</div>
      <div class="panel-divider"></div>
      <div class="panel-label">Affected Tickers</div>
      <div class="panel-tickers">${tickerLinks || '<span style="color:var(--muted);font-size:0.7rem">None mapped</span>'}</div>
      <a href="/feed?rule=RULE_OSINT" class="panel-view-link">View signals →</a>
      <div class="panel-divider"></div>
      <div class="panel-label">AI Summary</div>
      <div class="panel-summary" id="panel-summary">
        <span class="panel-loading"><span>Generating…</span></span>
      </div>
      <div class="panel-divider"></div>
      <div class="panel-label">Corroborating Signals</div>
      <ul class="panel-corr-list" id="panel-corr"></ul>
      <a href="/region/${encodeURIComponent(hs.region)}" class="panel-dossier-link">Full Region Dossier →</a>
    `;

    // Lazy-load AI summary
    loadPanelSummary(hs.region);

    // Lazy-load corroborating alerts
    loadPanelCorr(hs);
  }

  async function loadPanelSummary(region) {
    const el = document.getElementById('panel-summary');
    if (!el) return;
    const timeout = setTimeout(() => {
      if (el) el.innerHTML = '<span style="color:var(--muted)">Summary timed out.</span>';
    }, 8000);
    try {
      const r = await fetch(`/api/osint-summary?region=${encodeURIComponent(region)}`);
      const d = await r.json();
      clearTimeout(timeout);
      if (el) el.textContent = d.summary || 'No summary available.';
    } catch {
      clearTimeout(timeout);
      if (el) el.innerHTML = '<span style="color:var(--muted)">Unable to load summary.</span>';
    }
  }

  async function loadPanelCorr(hs) {
    const el = document.getElementById('panel-corr');
    if (!el) return;
    const tickers = (hs.ticker_list || []).slice(0, 3);
    if (!tickers.length) {
      el.innerHTML = '<li>No related signals found.</li>';
      return;
    }
    try {
      const promises = tickers.map(t =>
        fetch(`/alerts?ticker=${t}&days=30&limit=3`).then(r => r.json()).catch(() => ({ items: [] }))
      );
      const results = await Promise.all(promises);
      const items = results.flatMap(r => (r.items || []).filter(a => a.rule !== 'RULE_OSINT')).slice(0, 5);
      if (!items.length) {
        el.innerHTML = '<li>No corroborating signals found.</li>';
        return;
      }
      el.innerHTML = items.map(a =>
        `<li><strong style="color:var(--amber)">${a.ticker || ''}</strong> ${a.headline}</li>`
      ).join('');
    } catch {
      el.innerHTML = '<li>Unable to load related signals.</li>';
    }
  }

  function closePanel() {
    document.getElementById('side-panel').classList.remove('open');
    if (controls) controls.autoRotate = true;
  }

  document.getElementById('panel-close').addEventListener('click', closePanel);

  // ── Conflict tape ────────────────────────────────────────────────────────────
  async function loadConflictTape() {
    try {
      const r = await fetch('/api/conflict-news');
      const data = await r.json();
      if (!data.length) return;

      const doubled = [...data, ...data]; // loop seamlessly
      const tapeEl  = document.getElementById('tape-inner');
      tapeEl.innerHTML = doubled.map(item => {
        const src = item.source || 'OSINT';
        const title = item.title || '';
        const url   = item.url;
        return url
          ? `<a href="${url}" target="_blank" rel="noopener" class="tape-item" style="color:var(--cream2);text-decoration:none"><span class="src">${src}</span>${title}</a>`
          : `<span class="tape-item"><span class="src">${src}</span>${title}</span>`;
      }).join('');

      // Adjust animation duration based on item count
      const duration = Math.max(40, doubled.length * 4);
      tapeEl.style.animationDuration = `${duration}s`;
    } catch {
      // silent fail
    }
  }

  // ── Mobile list ──────────────────────────────────────────────────────────────
  async function loadMobileList() {
    if (window.innerWidth >= 768) return;
    const el = document.getElementById('mobile-regions');
    try {
      const r = await fetch('/api/osint-hotspots');
      const data = await r.json();
      if (!data.length) {
        el.innerHTML = '<div style="color:var(--muted);font-family:var(--font-mono);font-size:0.75rem">No active hotspots.</div>';
        return;
      }
      data.sort((a, b) => {
        const r = { CRITICAL: 3, HIGH: 2, MEDIUM: 1 };
        return (r[b.severity] || 0) - (r[a.severity] || 0);
      });
      el.innerHTML = data.map(hs => `
        <a href="/region/${encodeURIComponent(hs.region)}" class="region-card">
          <div style="display:flex;align-items:center;gap:0.6rem;margin-bottom:0.3rem;">
            <span class="badge badge-${hs.severity}">${hs.severity}</span>
            <span class="region-name">${hs.region}</span>
          </div>
          <div class="region-meta">${hs.count} signal${hs.count !== 1 ? 's' : ''} · ${timeAgo(hs.last_at)}</div>
        </a>
      `).join('');
    } catch {
      el.innerHTML = '<div style="color:var(--muted);font-family:var(--font-mono);font-size:0.75rem">Failed to load regions.</div>';
    }
  }

  // ── Init ─────────────────────────────────────────────────────────────────────
  async function init() {
    // Desktop globe
    if (window.innerWidth >= 768) {
      initGlobe();
      try {
        const r = await fetch('/api/osint-hotspots');
        const data = await r.json();
        buildHotspots(data);
      } catch {
        // silent — globe still shows without hotspots
      }
    }

    loadMobileList();
    loadConflictTape();
  }

  init();

  /* ── COMMAND PALETTE ── */
  let _cmdTimer = null, _cmdActive = -1;
  function openCmd() { document.getElementById('cmd-backdrop').classList.add('open'); document.getElementById('cmd-input').focus(); _cmdActive = -1; }
  function closeCmd() { document.getElementById('cmd-backdrop').classList.remove('open'); document.getElementById('cmd-input').value = ''; document.getElementById('cmd-results').innerHTML = '<div class=\"cmd-empty\">Type to search…</div>'; _cmdActive = -1; }
  document.addEventListener('keydown', e => {
    if ((e.metaKey||e.ctrlKey) && e.key==='k') { e.preventDefault(); openCmd(); return; }
    if (e.key==='Escape') { closeCmd(); return; }
    if (!document.getElementById('cmd-backdrop').classList.contains('open')) return;
    const items = document.querySelectorAll('.cmd-item');
    if (e.key==='ArrowDown') { e.preventDefault(); _cmdActive=Math.min(_cmdActive+1,items.length-1); items.forEach((el,i)=>el.classList.toggle('active',i===_cmdActive)); }
    if (e.key==='ArrowUp')   { e.preventDefault(); _cmdActive=Math.max(_cmdActive-1,0); items.forEach((el,i)=>el.classList.toggle('active',i===_cmdActive)); }
    if (e.key==='Enter'&&_cmdActive>=0) { items[_cmdActive]?.click(); closeCmd(); }
  });
  document.getElementById('cmd-input').addEventListener('input', e => { clearTimeout(_cmdTimer); _cmdTimer=setTimeout(()=>cmdSearch(e.target.value.trim()),200); });
  async function cmdSearch(q) {
    _cmdActive=-1;
    if (!q||q.length<2) { document.getElementById('cmd-results').innerHTML='<div class=\"cmd-empty\">Type to search…</div>'; return; }
    try {
      const c=new AbortController(); setTimeout(()=>c.abort(),5000);
      const r=await fetch('/api/search?q='+encodeURIComponent(q),{signal:c.signal});
      const d=await r.json(); let html='';
      if (d.tickers?.length) { html+='<div class=\"cmd-group-label\">Tickers</div>'; html+=d.tickers.map(t=>`<a class=\"cmd-item\" href=\"/ticker/${t.ticker}\"><span class=\"cmd-item-icon\">◎</span><div><div class=\"cmd-item-main\">${t.ticker}</div></div></a>`).join(''); }
      if (d.members?.length) { html+='<div class=\"cmd-group-label\">Members</div>'; html+=d.members.map(m=>`<a class=\"cmd-item\" href=\"/member/${m.bioguide_id}\"><span class=\"cmd-item-icon\">◈</span><div><div class=\"cmd-item-main\">${m.full_name}</div><div class=\"cmd-item-sub\">${m.state||''} · ${m.party||''}</div></div></a>`).join(''); }
      if (d.headlines?.length) { html+='<div class=\"cmd-group-label\">Signals</div>'; html+=d.headlines.map(h=>{ const rule=(h.rule||''); return `<a class=\"cmd-item\" href=\"/feed?ticker=${h.ticker||''}\"><span class=\"cmd-item-icon\">⚡</span><div><div class=\"cmd-item-main\">${(h.headline||'').slice(0,72)}</div><div class=\"cmd-item-sub\">${h.ticker||''} · ${rule}</div></div><span class=\"cmd-badge cmd-badge-${h.severity||'MEDIUM'}\">${h.severity||''}</span></a>`; }).join(''); }
      if (!html) html='<div class=\"cmd-empty\">No results for \"'+q+'\"</div>';
      document.getElementById('cmd-results').innerHTML=html;
    } catch { document.getElementById('cmd-results').innerHTML='<div class=\"cmd-empty\">Search failed.</div>'; }
  }
</script>
<script src="/cmdk.js" defer></script>
</body>
