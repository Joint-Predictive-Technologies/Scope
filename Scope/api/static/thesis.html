<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thesis War Room — Scope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/tokens.css"/>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--cream); font-family: Inter, sans-serif; min-height: 100vh; }
    nav { position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); background: rgba(12,11,9,0.95); backdrop-filter: blur(12px); padding: 0 2rem; display: flex; align-items: center; gap: 1rem; height: 56px; }
    .nav-brand { font-family: var(--font-sans); font-weight: 900; font-size: 1.2rem; color: var(--amber); letter-spacing: 0.05em; text-decoration: none; margin-right: 0.5rem; }
    .nav-links { display: flex; gap: 1.4rem; align-items: center; flex: 1; flex-wrap: wrap; }
    .nav-links a { font-family: var(--font-mono); font-size: 0.68rem; color: var(--cream2); text-decoration: none; letter-spacing: 0.06em; text-transform: uppercase; transition: color 0.2s; }
    .nav-links a:hover { color: var(--amber); }

    .page { max-width: 940px; margin: 0 auto; padding: 2.2rem 2rem; }
    .status-badge { font-family: var(--font-mono); font-size: 0.58rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 9px; border-radius: 3px; }
    .st-emerging { background: rgba(122,112,96,0.2); color: var(--cream2); }
    .st-developing { background: rgba(106,176,224,0.15); color: var(--blue); }
    .st-confirmed { background: rgba(200,146,42,0.18); color: var(--amber2); }
    .st-saturated { background: rgba(122,112,96,0.15); color: var(--muted); }
    .st-fading { background: rgba(122,112,96,0.15); color: var(--muted); }
    .st-resolved { background: rgba(77,196,122,0.14); color: var(--green-light); }
    .t-title { font-family: var(--font-sans); font-size: 1.9rem; font-weight: 700; color: var(--cream); margin: 0.5rem 0 0.3rem; }
    .t-meta { font-family: var(--font-mono); font-size: 0.66rem; color: var(--muted); }
    .tick-chip { font-family: var(--font-mono); font-size: 0.66rem; background: var(--surface-2); border: 1px solid var(--border-default); color: var(--amber); padding: 2px 8px; border-radius: 3px; margin: 0 4px 4px 0; display: inline-block; text-decoration: none; }
    .tick-chip:hover { border-color: var(--amber); }

    .score-row { display: flex; gap: 1rem; flex-wrap: wrap; margin: 1.4rem 0; }
    .score-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.2rem; flex: 1; min-width: 150px; position: relative; }
    .score-label { font-family: var(--font-mono); font-size: 0.58rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .score-value { font-family: var(--font-sans); font-size: 2rem; font-weight: 800; line-height: 1.1; }
    .bar { height: 6px; border-radius: 3px; background: var(--bg3); overflow: hidden; margin-top: 0.5rem; }
    .bar > span { display: block; height: 100%; }
    .score-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem 1rem; font-family: var(--font-mono); font-size: 0.66rem; color: var(--cream2); }
    .score-meta .m { color: var(--muted); }
    .spark { margin-top: 0.5rem; }

    .decomp { cursor: help; font-size: 0.7rem; color: var(--muted); }
    .decomp-pop { display: none; position: absolute; z-index: 40; left: 1rem; top: 100%; margin-top: 4px; background: var(--surface-2); border: 1px solid var(--border-default); border-radius: 6px; padding: 0.6rem 0.8rem; min-width: 220px; }
    .signal-card.open .decomp-pop, .score-card.open .decomp-pop { display: block; }
    .decomp-row { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.66rem; color: var(--cream2); padding: 2px 0; }
    .decomp-row .v { color: var(--cream); }
    .decomp-row.total { border-top: 1px solid var(--border2); margin-top: 3px; padding-top: 4px; color: var(--amber2); }

    .section { margin-top: 1.8rem; }
    .section h3 { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); margin-bottom: 0.8rem; }
    .what-changed { background: rgba(200,146,42,0.06); border-left: 2px solid var(--amber); padding: 0.8rem 1rem; font-size: 0.85rem; color: var(--cream2); line-height: 1.6; }
    .invalidation { background: rgba(229,91,77,0.07); border-left: 3px solid var(--red-light); border-radius: 4px; padding: 0.9rem 1.1rem; }
    .invalidation h3 { color: var(--red-light); }
    .invalidation ul { color: var(--cream2); font-size: 0.84rem; line-height: 1.7; padding-left: 1.1rem; }
    .invalidation.empty { background: rgba(122,112,96,0.06); border-left-color: var(--muted); }
    .invalidation.empty .prompt { color: var(--muted); font-size: 0.82rem; font-style: italic; }

    .timeline-day { margin-bottom: 1rem; }
    .timeline-date { font-family: var(--font-mono); font-size: 0.64rem; color: var(--muted); margin-bottom: 0.4rem; }
    .signal-card { background: var(--bg2); border: 1px solid var(--border); border-left-width: 3px; border-radius: 6px; padding: 0.7rem 1rem; margin-bottom: 0.4rem; position: relative; }
    .signal-card.critical { border-left-color: var(--red-light); }
    .signal-card.high { border-left-color: var(--amber); }
    .signal-card.medium { border-left-color: var(--blue); }
    .sig-top { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
    .rule-badge { font-family: var(--font-mono); font-size: 0.56rem; color: var(--muted); border: 1px solid var(--border2); padding: 1px 6px; border-radius: 3px; }
    .sig-ticker { font-family: var(--font-mono); color: var(--amber); font-size: 0.72rem; }
    .sig-headline { font-size: 0.82rem; color: var(--cream); margin-top: 0.3rem; }
    .sig-why { font-size: 0.74rem; color: var(--muted); margin-top: 0.2rem; line-height: 1.5; }
    .sig-scores { font-family: var(--font-mono); font-size: 0.6rem; color: var(--muted); margin-top: 0.3rem; }
    .sig-scores b { color: var(--blue); } .sig-scores i { color: var(--green-light); font-style: normal; cursor: help; border-bottom: 1px dotted var(--muted); }
    .verify-link { font-family: var(--font-mono); font-size: 0.62rem; color: var(--amber); text-decoration: none; }

    .rate-btn { background: transparent; border: 1px solid var(--border2); padding: 2px 6px; border-radius: 3px; cursor: pointer; font-size: 0.66rem; line-height: 1; filter: grayscale(0.85); opacity: 0.5; transition: all 0.15s; }
    .rate-btn:hover { opacity: 1; filter: none; border-color: var(--amber); }
    .rate-btn.rated { opacity: 1; filter: none; border-color: var(--amber); background: rgba(200,146,42,0.12); }
    .annot { display: inline-flex; gap: 4px; margin-left: auto; }

    .chip { font-family: var(--font-mono); font-size: 0.62rem; background: var(--surface-2); border: 1px solid var(--border-default); color: var(--cream2); padding: 2px 8px; border-radius: 3px; margin: 0 4px 4px 0; display: inline-block; }
    .related-card { display: flex; gap: 0.7rem; align-items: center; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem 0.9rem; margin-bottom: 0.4rem; text-decoration: none; color: var(--cream2); font-size: 0.8rem; }
    .related-card:hover { border-color: var(--amber); }
    .related-card .score { margin-left: auto; font-family: var(--font-mono); font-size: 0.68rem; color: var(--green-light); }
    .notes-area { width: 100%; min-height: 90px; background: var(--bg2); border: 1px solid var(--border2); border-radius: 6px; color: var(--cream); font-family: Inter, sans-serif; font-size: 0.82rem; padding: 0.7rem 0.9rem; resize: vertical; }
    .notes-save { font-family: var(--font-mono); font-size: 0.62rem; margin-top: 0.4rem; color: var(--muted); }
    .loading, .empty { padding: 3rem; text-align: center; font-family: var(--font-mono); color: var(--muted); }
    .muted { color: var(--muted); font-size: 0.8rem; }
  
    /* --- unified nav mobile (injected) --- */
    .hamburger { display: none; margin-left: auto; background: none; border: 1px solid var(--border2); color: var(--cream2); padding: 9px 13px; border-radius: 4px; cursor: pointer; font-size: 1rem; line-height: 1; }
    @media (max-width: 900px) {
      .hamburger { display: flex; }
      .nav-links { display: none; flex-direction: column; position: fixed; top: 56px; left: 0; right: 0; background: var(--bg); border-bottom: 1px solid var(--border); padding: 1.2rem 2rem; gap: 1rem; z-index: 99; }
      .nav-links.open { display: flex; }
    }

    /* Functional motion — reduced motion: keep opacity fades, drop transform/scale.
       (Count-up is gated in JS via REDUCE_MOTION — see script below.) */
    @keyframes receipts-reveal-reduced { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      details.receipts[open] .receipts-body { animation: receipts-reveal-reduced 180ms var(--ease-out); }
    }
  </style>
<style>
/* --- alert receipts (provenance block) --- */
/* receipts — the evidence block; amplified + tokenized (Principle 2). member
   NAMES are sans (prose); sizes/dates/IDs/links are mono (data). */
details.receipts{margin-top:var(--space-2);background:var(--surface-2);border:1px solid var(--border-subtle);border-left:2px solid var(--accent);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3)}
details.receipts>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:var(--space-2);font-size:var(--text-sm);color:var(--text-secondary)}
details.receipts>summary::-webkit-details-marker{display:none}
details.receipts>summary::marker{content:''}
details.receipts>summary:hover .receipts-summary{color:var(--text-primary)}
.receipts-label{font-family:var(--font-mono);font-size:var(--text-2xs);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--accent);flex-shrink:0}
.receipts-summary{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
details.receipts[open]>summary{margin-bottom:var(--space-2);padding-bottom:var(--space-2);border-bottom:1px solid var(--border-subtle)}
.receipts-body{display:flex;flex-direction:column;gap:var(--space-2)}
details.receipts[open] .receipts-body{animation:receipts-reveal 180ms var(--ease-out)}
@keyframes receipts-reveal{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.receipt-item{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:baseline;font-size:var(--text-sm);color:var(--text-secondary)}
.receipt-primary{font-weight:var(--weight-medium);color:var(--text-primary)}
.receipt-secondary{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-tertiary);font-variant-numeric:tabular-nums}
a.receipt-link{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--accent);text-decoration:none;white-space:nowrap}
a.receipt-link:hover{text-decoration:underline}
.receipt-source{margin-top:var(--space-1)}
.receipt-gap{font-size:var(--text-2xs);color:var(--text-tertiary);font-style:italic}
</style>
<script>
/* renderReceipts — factual alert provenance (server-assembled; never LLM). */
function renderReceipts(r){
  if(!r) return '';
  const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const lk=(u,l)=>u?`<a class="receipt-link" href="${e(u)}"${/^https?:/.test(u)?' target="_blank" rel="noopener"':''}>${e(l||'open')} →</a>`:'';
  const items=(r.items||[]).map(it=>`<div class="receipt-item"><span class="receipt-primary">${e(it.primary)}</span>${it.secondary?`<span class="receipt-secondary">${e(it.secondary)}</span>`:''}${lk(it.url,it.url_label)}</div>`).join('');
  const src=r.source&&r.source.url?`<div class="receipt-source">${lk(r.source.url,r.source.label)}</div>`:'';
  const gap=r.gap?`<div class="receipt-gap">⚠ ${e(r.gap)}</div>`:'';
  const body=(items+src+gap)||'<div class="receipt-gap">No further detail captured.</div>';
  return `<details class="receipts"><summary><span class="receipts-label">Receipts</span><span class="receipts-summary">${e(r.summary||'')}</span></summary><div class="receipts-body">${body}</div></details>`;
}
</script>
</head>

<div class="page" id="page"><div class="loading">Loading thesis…</div></div>

<script>
  const id = parseInt(location.pathname.split('/thesis/')[1] || '0');
  const esc = s => (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const ago = s => { if(!s) return '—'; const t=new Date(String(s).replace(' ','T')+(String(s).includes('Z')?'':'Z')).getTime(); if(isNaN(t))return'—'; const d=Math.floor((Date.now()-t)/1000); return d<3600?Math.floor(d/60)+'m ago':d<86400?Math.floor(d/3600)+'h ago':Math.floor(d/86400)+'d ago'; };
  const tk = t => (t||'').replace(/\$/g,'').split(' ')[0];
  const annotCache = {};

  // ── Functional motion (c): count-up for opportunity/evidence-confidence figures ──
  const REDUCE_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function countUp(el, target) {
    target = Math.round(target || 0);
    if (!el) return;
    if (REDUCE_MOTION) { el.textContent = target; return; }
    const start = performance.now(), duration = 400;
    function tick(now) {
      const p = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3); // ease-out cubic
      el.textContent = Math.round(target * eased);
      if (p < 1) requestAnimationFrame(tick);
      else el.textContent = target;
    }
    requestAnimationFrame(tick);
  }

  // opportunity-score decomposition — mirrors jpt_common.opportunity_score_breakdown
  function decomp(novelty, absorption, horizon, win=0.5){
    const hs = {IMMEDIATE:1.0,SHORT:0.85,MEDIUM:0.65,LONG:0.45}[horizon] ?? 0.7;
    const c = [
      {label:`novelty ${Math.round((novelty||0)*1000)/1000}`, value:Math.round((novelty||0)*40*10)/10},
      {label:`absorption ${Math.round((absorption||0)*10)/10}%`, value:Math.round(-((absorption||0)/100)*30*10)/10},
      {label:`${horizon||'—'} horizon`, value:Math.round(hs*20*10)/10},
      {label:`base weight (uncalibrated placeholder)`, value:Math.round(win*10*10)/10},
    ];
    const total = Math.min(Math.max(Math.round(c.reduce((s,x)=>s+x.value,0)*10)/10,0),100);
    return {c, total};
  }
  function decompHTML(dc){ return dc.c.map(x=>`<div class="decomp-row"><span>${esc(x.label)}</span><span class="v">${x.value>=0?'+':''}${x.value}</span></div>`).join('')
    + `<div class="decomp-row total"><span>opportunity</span><span class="v">${dc.total}</span></div><div class="muted" style="margin-top:4px;font-size:0.56rem">detection-time value — never recomputed. The base weight is a fixed placeholder, not a measured win rate.</div>`; }
  function toggleCard(el){ el.closest('.signal-card,.score-card').classList.toggle('open'); }

  // sparkline of detection-time scores (chronological)
  function spark(vals, color){
    if(!vals.length) return '';
    const w=180,h=30,max=100,min=0;
    const pts = vals.map((v,i)=>{ const x=vals.length<2?0:(i/(vals.length-1))*w; const y=h-((v-min)/(max-min))*h; return `${x.toFixed(1)},${y.toFixed(1)}`; }).join(' ');
    return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
  }

  // per-alert annotations (Part 1)
  async function loadAnnotations(ids){ if(!ids.length) return;
    try { const d=await (await fetch(`/api/annotations?alert_ids=${ids.join(',')}`)).json();
      for(const [i,v] of Object.entries(d)) annotCache[i]=v.annotation; ids.forEach(updAnnot);} catch{} }
  function updAnnot(i){ const cur=annotCache[String(i)]||null;
    const up=document.getElementById(`ra-up-${i}`), dn=document.getElementById(`ra-dn-${i}`);
    if(up) up.classList.toggle('rated',cur==='up'); if(dn) dn.classList.toggle('rated',cur==='down'); }
  async function annot(e,i,val){ e.stopPropagation(); const k=String(i); const prev=annotCache[k]||null;
    annotCache[k]=(prev===val)?null:val; updAnnot(i);
    try { const r=await fetch('/api/annotations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({alert_id:i,annotation:val})});
      if(!r.ok) throw 0; annotCache[k]=(await r.json()).annotation; updAnnot(i);
    } catch { annotCache[k]=prev; updAnnot(i); } }
  const annotBtns = i => `<span class="annot"><button class="rate-btn" id="ra-up-${i}" title="Thumbs up" onclick="annot(event,${i},'up')">👍</button><button class="rate-btn" id="ra-dn-${i}" title="Thumbs down" onclick="annot(event,${i},'down')">👎</button></span>`;

  // theme-level annotation + notes
  let themeAnnot=null;
  function updThemeAnnot(){ const up=document.getElementById('th-up'),dn=document.getElementById('th-dn');
    if(up) up.classList.toggle('rated',themeAnnot==='up'); if(dn) dn.classList.toggle('rated',themeAnnot==='down'); }
  async function themeAnnotate(val){ const prev=themeAnnot; themeAnnot=(prev===val)?null:val; updThemeAnnot();
    try { const r=await fetch('/api/warroom/annotation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entity_type:'theme',entity_id:String(id),annotation:val})});
      if(!r.ok) throw 0; themeAnnot=(await r.json()).annotation; updThemeAnnot();
    } catch { themeAnnot=prev; updThemeAnnot(); } }
  let noteTimer=null;
  function noteChanged(){ clearTimeout(noteTimer); document.getElementById('note-status').textContent='editing…'; noteTimer=setTimeout(saveNote,800); }
  async function saveNote(){ const v=document.getElementById('note-area').value; document.getElementById('note-status').textContent='saving…';
    try { await fetch('/api/warroom/note',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entity_type:'theme',entity_id:String(id),note:v})});
      document.getElementById('note-status').textContent='saved '+new Date().toLocaleTimeString(); } catch { document.getElementById('note-status').textContent='save failed'; } }

  Promise.all([
    fetch(`/api/themes/${id}`).then(r=>{ if(!r.ok) throw new Error('404'); return r.json(); }),
    fetch(`/api/warroom/theme/${id}`).then(r=>r.ok?r.json():{note:null,annotation:null}).catch(()=>({note:null,annotation:null})),
  ]).then(([d, war]) => {
    const t = d.theme;
    const stCls = 'st-' + (t.status||'emerging').toLowerCase();
    const timeline = (d.timeline||[]).map(day => `
      <div class="timeline-day">
        <div class="timeline-date">${esc(day.date)}</div>
        ${day.signals.map(s => { const dc=decomp(s.novelty_score,s.absorption_pct,s.time_horizon); return `
          <div class="signal-card ${(s.severity||'').toLowerCase()}">
            <div class="sig-top">
              <span class="rule-badge">${esc(s.rule)}</span>
              ${tk(s.ticker) ? `<span class="sig-ticker">${esc(tk(s.ticker))}</span>` : ''}
              <span class="muted" style="font-family:var(--font-mono);font-size:0.6rem">${ago(s.created_at)}</span>
              ${annotBtns(s.id)}
            </div>
            <div class="sig-headline">${esc(s.headline)}</div>
            ${s.why_matters ? `<div class="sig-why">${esc(s.why_matters)}</div>` : ''}
            ${s.receipts ? renderReceipts(s.receipts) : ''}
            <div class="sig-scores">EC <b id="sig-ec-${s.id}">0</b> · OPP <i onclick="toggleCard(this)"><span id="sig-opp-${s.id}">0</span> ⓘ</i></div>
            <div class="decomp-pop">${decompHTML(dc)}</div>
            ${(s.verify_url||s.source_url) ? `<a class="verify-link" href="${esc(s.verify_url||s.source_url)}" target="_blank" rel="noopener">Verify source →</a>` : ''}
          </div>`; }).join('')}
      </div>`).join('') || '<div class="muted">No linked evidence yet.</div>';

    // detection-time score trends (chronological order = oldest first)
    const chron = (d.signals||[]).slice().reverse();
    const ecSpark = spark(chron.map(s=>s.evidence_confidence||0), 'var(--blue)');
    const opSpark = spark(chron.map(s=>s.opportunity_score||0), 'var(--green-light)');

    const rules = (t.supporting_rules||[]).map(r => `<span class="chip">${esc(r)}</span>`).join('') || '<span class="muted">—</span>';
    const affected = (t.affected_tickers||[]).map(x => `<a class="tick-chip" href="/ticker/${esc(tk(x))}">${esc(x)}</a>`).join('');
    const related = (d.related||[]).map(r => `
      <a class="related-card" href="/thesis/${r.id}">
        <span class="status-badge st-${(r.status||'emerging').toLowerCase()}">${esc(r.status)}</span>
        ${esc(r.title)}
        <span class="score"><span id="rel-opp-${r.id}">0</span> opp</span>
      </a>`).join('');

    const inval = (t.invalidation_conditions&&t.invalidation_conditions.length)
      ? `<div class="section invalidation"><h3>Thesis invalidated if</h3><ul>${t.invalidation_conditions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`
      : `<div class="section invalidation empty"><h3>Thesis invalidated if</h3><p class="prompt">No falsification conditions set. A thesis without a "what would change my mind" is incomplete — add one in Notes below.</p></div>`;

    document.getElementById('page').innerHTML = `
      <div style="display:flex;gap:0.6rem;align-items:center;flex-wrap:wrap">
        <span class="status-badge ${stCls}">${esc(t.status||'')}</span>
        <span class="annot" style="margin-left:auto"><button class="rate-btn" id="th-up" title="Thumbs up (whole thesis)" onclick="themeAnnotate('up')">👍</button><button class="rate-btn" id="th-dn" title="Thumbs down (whole thesis)" onclick="themeAnnotate('down')">👎</button></span>
      </div>
      <div class="t-title">${esc(t.title)}</div>
      <div class="t-meta">${[t.region, t.sector].filter(Boolean).map(esc).join(' · ')} · active since ${ago(t.first_signal_at)} · ${d.signals.length} signals</div>
      <div style="margin-top:0.6rem">${t.primary_ticker?`<a class="tick-chip" href="/ticker/${esc(tk(t.primary_ticker))}">${esc(t.primary_ticker)}</a>`:''}${affected}</div>
      ${t.historical_analogue ? `<div class="t-meta" style="margin-top:0.5rem;font-style:italic">Analogue: ${esc(t.historical_analogue)}</div>` : ''}

      <div class="score-row">
        <div class="score-card">
          <div class="score-label">Evidence Confidence</div>
          <div class="score-value" id="ec-value" style="color:var(--blue)">0</div>
          <div class="bar"><span style="width:${Math.min(t.evidence_confidence||0,100)}%;background:var(--blue)"></span></div>
          ${ecSpark}
        </div>
        <div class="score-card">
          <div class="score-label">Opportunity Score</div>
          <div class="score-value" id="opp-value" style="color:var(--green-light)">0</div>
          <div class="bar"><span style="width:${Math.min(t.opportunity_score||0,100)}%;background:var(--green-light)"></span></div>
          ${opSpark}
        </div>
        <div class="score-card">
          <div class="score-meta">
            <div class="m">Novelty</div><div>${Math.round((t.novelty_score||0)*100)}%</div>
            <div class="m">Absorption</div><div>${t.absorption_pct ?? 0}%</div>
            <div class="m">Horizon</div><div>${esc(t.time_horizon||'—')}</div>
            <div class="m">Conflict</div><div>${esc(t.conflict_status||'—')}</div>
          </div>
        </div>
      </div>

      ${inval}

      ${t.what_changed ? `<div class="section"><h3>What changed</h3><div class="what-changed">${esc(t.what_changed)}</div></div>` : ''}

      <div class="section"><h3>Signal timeline — ${d.signals.length} signals</h3>${timeline}</div>

      <div class="section"><h3>Supporting rules</h3>${rules}</div>

      ${(t.watch_triggers&&t.watch_triggers.length) ? `<div class="section"><h3>Watch for</h3><ul style="color:var(--cream2);font-size:0.82rem;line-height:1.7;padding-left:1.1rem">${t.watch_triggers.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      ${t.conflicting_evidence ? `<div class="section"><h3>Conflicting evidence</h3><p class="muted" style="line-height:1.6">${esc(t.conflicting_evidence)}</p></div>` : ''}
      ${related ? `<div class="section"><h3>Related intelligence</h3>${related}</div>` : ''}

      <div class="section"><h3>Notes</h3>
        <textarea id="note-area" class="notes-area" placeholder="Your reasoning about this thesis…" oninput="noteChanged()">${esc(war.note||'')}</textarea>
        <div class="notes-save" id="note-status">${war.note?'saved':''}</div>
      </div>
    `;

    themeAnnot = war.annotation || null; updThemeAnnot();
    loadAnnotations((d.signals||[]).map(s=>s.id));

    // Functional motion (c): count up opportunity/evidence-confidence figures.
    countUp(document.getElementById('ec-value'), t.evidence_confidence ?? 0);
    countUp(document.getElementById('opp-value'), t.opportunity_score ?? 0);
    (d.signals||[]).forEach(s => {
      countUp(document.getElementById(`sig-ec-${s.id}`), s.evidence_confidence ?? 0);
      countUp(document.getElementById(`sig-opp-${s.id}`), s.opportunity_score ?? 0);
    });
    (d.related||[]).forEach(r => countUp(document.getElementById(`rel-opp-${r.id}`), r.opportunity_score ?? 0));
  }).catch(() => {
    document.getElementById('page').innerHTML = `<div class="empty">Thesis not found.<br><a href="/intelligence" style="color:var(--amber)">← Back to Theses</a></div>`;
  });
</script>
</body>
</html>
