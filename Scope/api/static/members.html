<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Members — Scope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/tokens.css"/>
  <script src="/rule-names.js"></script>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--cream); font-family: Inter, sans-serif; min-height: 100vh; }
    nav { position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); background: var(--surface-nav); backdrop-filter: blur(12px); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 56px; }
    .nav-brand { font-family: var(--font-sans); font-weight: 900; font-size: 1.2rem; color: var(--amber); letter-spacing: 0.05em; text-decoration: none; }
    .nav-links { display: flex; gap: 2rem; align-items: center; }
    .nav-links a { font-family: var(--font-mono); font-size: 0.75rem; color: var(--cream2); text-decoration: none; letter-spacing: 0.06em; text-transform: uppercase; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--amber); }
    .nav-cta { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; background: var(--amber); color: var(--bg); padding: 6px 16px; border-radius: 4px; text-decoration: none; font-weight: 500; }

    .page { max-width: 1000px; margin: 0 auto; padding: 3rem 2rem; }
    .page-tag { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); margin-bottom: 0.5rem; }
    .page-title { font-family: var(--font-sans); font-size: 2rem; font-weight: 700; color: var(--cream); margin-bottom: 1.5rem; }

    .controls { display: flex; gap: 0.7rem; flex-wrap: wrap; margin-bottom: 1.5rem; align-items: center; }
    .search-input { flex: 1; min-width: 200px; font-family: Inter, sans-serif; font-size: 0.85rem; background: var(--bg2); border: 1px solid var(--border); color: var(--cream); padding: 9px 14px; border-radius: 4px; outline: none; }
    .search-input:focus { border-color: var(--amber); }
    .search-input::placeholder { color: var(--muted); }
    .filter-select { font-family: var(--font-mono); font-size: 0.72rem; background: var(--bg2); border: 1px solid var(--border); color: var(--cream2); padding: 9px 12px; border-radius: 4px; outline: none; appearance: none; }
    .filter-select:focus { border-color: var(--amber); }
    .result-count { font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); margin-left: auto; }

    .members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1px; }
    .member-card { background: var(--bg2); border: 1px solid var(--border); padding: 1rem 1.2rem; text-decoration: none; display: flex; flex-direction: column; gap: 0.4rem; transition: border-color 0.15s; }
    .member-card:first-child { border-radius: 6px 6px 0 0; }
    .member-card:last-child  { border-radius: 0 0 6px 6px; }
    .member-card:hover { border-color: var(--amber); z-index: 1; position: relative; }
    .m-name { font-size: 0.9rem; color: var(--cream); font-weight: 500; }
    .m-meta { display: flex; gap: 0.4rem; align-items: center; }
    .m-badge { font-family: var(--font-mono); font-size: 0.58rem; letter-spacing: 0.06em; padding: 2px 6px; border-radius: 3px; border: 1px solid; }
    .m-D { color: var(--blue); border-color: color-mix(in srgb, var(--link) 30%, transparent); background: color-mix(in srgb, var(--link) 6%, transparent); }
    .m-R { color: var(--red);  border-color: color-mix(in srgb, var(--severity-critical) 30%, transparent);  background: color-mix(in srgb, var(--severity-critical) 6%, transparent); }
    .m-I { color: var(--muted); border-color: var(--border2); }
    .m-chamber { color: var(--muted); border-color: var(--border2); }
    .m-state { font-family: var(--font-mono); font-size: 0.62rem; color: var(--muted); }

    .empty { padding: 3rem; text-align: center; font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }
    .loading { padding: 3rem; text-align: center; font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }

    @media (max-width: 600px) { .members-grid { grid-template-columns: 1fr; } }

    /* ── CMD PALETTE ── */
    #cmd-backdrop { display:none; position:fixed; inset:0; background:var(--surface-overlay); z-index:9000; backdrop-filter:blur(4px); }
    #cmd-backdrop.open { display:flex; align-items:flex-start; justify-content:center; padding-top:12vh; }
    #cmd-box { background:var(--bg2); border:1px solid var(--border2); border-radius:10px; width:min(640px,92vw); overflow:hidden; }
    #cmd-input { width:100%; background:transparent; border:none; border-bottom:1px solid var(--border); outline:none; font-family:var(--font-mono); font-size:0.9rem; color:var(--cream); padding:1rem 1.2rem; }
    #cmd-results { max-height:360px; overflow-y:auto; }
    .cmd-group-label { font-family:var(--font-mono); font-size:0.6rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); padding:0.6rem 1.2rem 0.2rem; }
    .cmd-item { display:flex; align-items:center; gap:0.8rem; padding:0.65rem 1.2rem; cursor:pointer; text-decoration:none; border-left:2px solid transparent; }
    .cmd-item:hover,.cmd-item.active { background:var(--bg3); border-left-color:var(--amber); }
    .cmd-item-icon { font-size:0.9rem; opacity:0.6; width:18px; text-align:center; flex-shrink:0; }
    .cmd-item-main { font-family:var(--font-mono); font-size:0.75rem; color:var(--cream); }
    .cmd-item-sub  { font-size:0.68rem; color:var(--muted); margin-top:1px; }
    .cmd-badge { font-family:var(--font-mono); font-size:0.55rem; padding:1px 5px; border-radius:2px; margin-left:auto; flex-shrink:0; }
    .cmd-badge-CRITICAL { background:color-mix(in srgb, var(--severity-critical) 20%, transparent); color:var(--severity-critical); }
    .cmd-badge-HIGH     { background:color-mix(in srgb, var(--amber) 20%, transparent); color:var(--amber); }
    .cmd-badge-MEDIUM   { background:color-mix(in srgb, var(--link) 20%, transparent); color:var(--link); }
    .cmd-empty { font-family:var(--font-mono); font-size:0.75rem; color:var(--muted); padding:1.5rem 1.2rem; text-align:center; }
    .cmd-hint { font-family:var(--font-mono); font-size:0.58rem; color:var(--muted); padding:0.5rem 1.2rem; border-top:1px solid var(--border); display:flex; gap:1.2rem; }
    .cmd-hint kbd { background:var(--border); border:1px solid var(--border2); border-radius:3px; padding:1px 5px; font-family:inherit; font-size:0.58rem; color:var(--cream2); }
  
    /* --- unified nav mobile (injected) --- */
    .hamburger { display: none; margin-left: auto; background: none; border: 1px solid var(--border2); color: var(--cream2); padding: 9px 13px; border-radius: 4px; cursor: pointer; font-size: 1rem; line-height: 1; }
    @media (max-width: 900px) {
      .hamburger { display: flex; }
      .nav-links { display: none; flex-direction: column; position: fixed; top: 56px; left: 0; right: 0; background: var(--bg); border-bottom: 1px solid var(--border); padding: 1.2rem 2rem; gap: 1rem; z-index: 99; }
      .nav-links.open { display: flex; }
    }
  </style>
</head>
<body>
<!-- NOTHING renders above this line except the nav -->
<nav>
  <a href="/" class="nav-brand">◈ SCOPE</a>
  <button class="hamburger" onclick="document.getElementById('nav-links').classList.toggle('open')">☰</button>
  <div class="nav-links" id="nav-links">
    <a href="/">Brief</a><a href="/home">Dashboard</a>
    <a href="/feed">Alerts <span class="nav-badge" id="alert-badge" style="display:none"></span></a>
    <a href="/congress">Congress</a>
    <a href="/insiders">Insiders</a>
    <a href="/contracts">Contracts</a>
    <a href="/lobbying">Lobbying</a>
    <a href="/intelligence">Intelligence</a>
    <a href="/clusters">Clusters</a>
    <a href="/osint">OSINT Globe</a>
    <a href="/ask">Ask Scope</a>
  </div>
  <a href="/feed" class="nav-cta">Live Feed →</a>
</nav>

<!-- CMD PALETTE -->
<div id="cmd-backdrop" onclick="if(event.target===this)closeCmd()">
  <div id="cmd-box">
    <input id="cmd-input" placeholder="Search tickers, members, headlines…" autocomplete="off" />
    <div id="cmd-results"><div class="cmd-empty">Type to search…</div></div>
    <div class="cmd-hint"><span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>
  </div>
</div>


<div class="page">
  <div class="page-tag">Congressional Directory</div>
  <div class="page-title">Members of Congress</div>

  <div class="controls">
    <input class="search-input" id="search" placeholder="Search by name…" oninput="filter()" />
    <select class="filter-select" id="f-chamber" onchange="filter()">
      <option value="">All chambers</option>
      <option value="house">House</option>
      <option value="senate">Senate</option>
    </select>
    <select class="filter-select" id="f-party" onchange="filter()">
      <option value="">All parties</option>
      <option value="democratic">Democrat</option>
      <option value="republican">Republican</option>
    </select>
    <span class="result-count" id="count"></span>
  </div>

  <div id="grid"><div class="loading">Loading members…</div></div>
</div>

<script>
  let all = [];

  function partyCode(party) {
    if (!party) return 'I';
    const p = party.toLowerCase();
    if (p.includes('democrat')) return 'D';
    if (p.includes('republican')) return 'R';
    return 'I';
  }

  function chamberShort(c) {
    if (!c) return '';
    return c.toLowerCase().includes('senate') ? 'Senate' : 'House';
  }

  function render(list) {
    const grid = document.getElementById('grid');
    document.getElementById('count').textContent = list.length + ' member' + (list.length !== 1 ? 's' : '');
    if (!list.length) { grid.innerHTML = '<div class="empty">No members match this filter.</div>'; return; }
    grid.innerHTML = '<div class="members-grid">' + list.map(m => {
      const pc = partyCode(m.party);
      return `<a href="/member/${m.bioguide_id}" class="member-card">
        <div class="m-name">${m.full_name}</div>
        <div class="m-meta">
          <span class="m-badge m-${pc}">${pc === 'D' ? 'Dem' : pc === 'R' ? 'Rep' : 'Ind'}</span>
          ${m.chamber ? `<span class="m-badge m-chamber">${chamberShort(m.chamber)}</span>` : ''}
          ${m.state ? `<span class="m-state">${m.state}</span>` : ''}
        </div>
      </a>`;
    }).join('') + '</div>';
  }

  function filter() {
    const q       = document.getElementById('search').value.toLowerCase();
    const chamber = document.getElementById('f-chamber').value;
    const party   = document.getElementById('f-party').value;
    render(all.filter(m => {
      if (q && !m.full_name.toLowerCase().includes(q)) return false;
      if (chamber && !(m.chamber || '').toLowerCase().includes(chamber)) return false;
      if (party && !(m.party || '').toLowerCase().includes(party)) return false;
      return true;
    }));
  }

  fetch('/members?limit=5000')
    .then(r => r.json())
    .then(data => { all = data; render(data); })
    .catch(() => { document.getElementById('grid').innerHTML = '<div class="empty">Failed to load members.</div>'; });

  document.getElementById('search').addEventListener('keydown', e => { if (e.key === 'Escape') { e.target.value = ''; filter(); } });

  /* ── COMMAND PALETTE ── */
  let _cmdTimer = null, _cmdActive = -1;
  function openCmd() { document.getElementById('cmd-backdrop').classList.add('open'); document.getElementById('cmd-input').focus(); _cmdActive = -1; }
  function closeCmd() { document.getElementById('cmd-backdrop').classList.remove('open'); document.getElementById('cmd-input').value = ''; document.getElementById('cmd-results').innerHTML = '<div class=\"cmd-empty\">Type to search…</div>'; _cmdActive = -1; }
  document.addEventListener('keydown', e => {
    if ((e.metaKey||e.ctrlKey) && e.key==='k') { e.preventDefault(); openCmd(); return; }
    if (e.key==='Escape') { closeCmd(); return; }
    if (!document.getElementById('cmd-backdrop').classList.contains('open')) return;
    const items = document.querySelectorAll('.cmd-item');
    if (e.key==='ArrowDown') { e.preventDefault(); _cmdActive=Math.min(_cmdActive+1,items.length-1); items.forEach((el,i)=>el.classList.toggle('active',i===_cmdActive)); }
    if (e.key==='ArrowUp')   { e.preventDefault(); _cmdActive=Math.max(_cmdActive-1,0); items.forEach((el,i)=>el.classList.toggle('active',i===_cmdActive)); }
    if (e.key==='Enter'&&_cmdActive>=0) { items[_cmdActive]?.click(); closeCmd(); }
  });
  document.getElementById('cmd-input').addEventListener('input', e => { clearTimeout(_cmdTimer); _cmdTimer=setTimeout(()=>cmdSearch(e.target.value.trim()),200); });
  async function cmdSearch(q) {
    _cmdActive=-1;
    if (!q||q.length<2) { document.getElementById('cmd-results').innerHTML='<div class=\"cmd-empty\">Type to search…</div>'; return; }
    try {
      const c=new AbortController(); setTimeout(()=>c.abort(),5000);
      const r=await fetch('/api/search?q='+encodeURIComponent(q),{signal:c.signal});
      const d=await r.json(); let html='';
      if (d.tickers?.length) { html+='<div class=\"cmd-group-label\">Tickers</div>'; html+=d.tickers.map(t=>`<a class=\"cmd-item\" href=\"/ticker/${t.ticker}\"><span class=\"cmd-item-icon\">◎</span><div><div class=\"cmd-item-main\">${t.ticker}</div></div></a>`).join(''); }
      if (d.members?.length) { html+='<div class=\"cmd-group-label\">Members</div>'; html+=d.members.map(m=>`<a class=\"cmd-item\" href=\"/member/${m.bioguide_id}\"><span class=\"cmd-item-icon\">◈</span><div><div class=\"cmd-item-main\">${m.full_name}</div><div class=\"cmd-item-sub\">${m.state||''} · ${m.party||''}</div></div></a>`).join(''); }
      if (d.headlines?.length) { html+='<div class=\"cmd-group-label\">Signals</div>'; html+=d.headlines.map(h=>{ const rule=(h.rule||''); return `<a class=\"cmd-item\" href=\"/feed?ticker=${h.ticker||''}\"><span class=\"cmd-item-icon\">⚡</span><div><div class=\"cmd-item-main\">${(h.headline||'').slice(0,72)}</div><div class=\"cmd-item-sub\">${h.ticker||''} · ${rule}</div></div><span class=\"cmd-badge cmd-badge-${h.severity||'MEDIUM'}\">${h.severity||''}</span></a>`; }).join(''); }
      if (!html) html='<div class=\"cmd-empty\">No results for \"'+q+'\"</div>';
      document.getElementById('cmd-results').innerHTML=html;
    } catch { document.getElementById('cmd-results').innerHTML='<div class=\"cmd-empty\">Search failed.</div>'; }
  }
</script>
<script src="/cmdk.js" defer></script>
</body>
</html>
