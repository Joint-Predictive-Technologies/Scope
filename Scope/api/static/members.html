<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Members — Scope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=IBM+Plex+Mono:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0b09; --bg2: #111009; --bg3: #181610;
      --cream: #e8e0cc; --cream2: #c8bfa8;
      --amber: #c8922a; --amber2: #e8aa3a;
      --muted: #7a7060; --border: #2a2620; --border2: #3a3428;
      --red: #e55b4d; --blue: #6ab0e0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--cream); font-family: Inter, sans-serif; min-height: 100vh; }
    nav { position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); background: rgba(12,11,9,0.92); backdrop-filter: blur(12px); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 56px; }
    .nav-brand { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.2rem; color: var(--amber); letter-spacing: 0.05em; text-decoration: none; }
    .nav-links { display: flex; gap: 2rem; align-items: center; }
    .nav-links a { font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; color: var(--cream2); text-decoration: none; letter-spacing: 0.06em; text-transform: uppercase; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--amber); }
    .nav-cta { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; background: var(--amber); color: var(--bg); padding: 6px 16px; border-radius: 4px; text-decoration: none; font-weight: 500; }

    .page { max-width: 1000px; margin: 0 auto; padding: 3rem 2rem; }
    .page-tag { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); margin-bottom: 0.5rem; }
    .page-title { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; color: var(--cream); margin-bottom: 1.5rem; }

    .controls { display: flex; gap: 0.7rem; flex-wrap: wrap; margin-bottom: 1.5rem; align-items: center; }
    .search-input { flex: 1; min-width: 200px; font-family: Inter, sans-serif; font-size: 0.85rem; background: var(--bg2); border: 1px solid var(--border); color: var(--cream); padding: 9px 14px; border-radius: 4px; outline: none; }
    .search-input:focus { border-color: var(--amber); }
    .search-input::placeholder { color: var(--muted); }
    .filter-select { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; background: var(--bg2); border: 1px solid var(--border); color: var(--cream2); padding: 9px 12px; border-radius: 4px; outline: none; appearance: none; }
    .filter-select:focus { border-color: var(--amber); }
    .result-count { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; color: var(--muted); margin-left: auto; }

    .members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1px; }
    .member-card { background: var(--bg2); border: 1px solid var(--border); padding: 1rem 1.2rem; text-decoration: none; display: flex; flex-direction: column; gap: 0.4rem; transition: border-color 0.15s; }
    .member-card:first-child { border-radius: 6px 6px 0 0; }
    .member-card:last-child  { border-radius: 0 0 6px 6px; }
    .member-card:hover { border-color: var(--amber); z-index: 1; position: relative; }
    .m-name { font-size: 0.9rem; color: var(--cream); font-weight: 500; }
    .m-meta { display: flex; gap: 0.4rem; align-items: center; }
    .m-badge { font-family: 'IBM Plex Mono', monospace; font-size: 0.58rem; letter-spacing: 0.06em; padding: 2px 6px; border-radius: 3px; border: 1px solid; }
    .m-D { color: var(--blue); border-color: rgba(106,176,224,0.3); background: rgba(106,176,224,0.06); }
    .m-R { color: var(--red);  border-color: rgba(229,91,77,0.3);  background: rgba(229,91,77,0.06); }
    .m-I { color: var(--muted); border-color: var(--border2); }
    .m-chamber { color: var(--muted); border-color: var(--border2); }
    .m-state { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem; color: var(--muted); }

    .empty { padding: 3rem; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; color: var(--muted); }
    .loading { padding: 3rem; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; color: var(--muted); }

    @media (max-width: 600px) { .members-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<!-- NOTHING renders above this line except the nav -->
<nav>
  <a href="/" class="nav-brand">◈ SCOPE</a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/feed">Alerts</a>
    <a href="/members-list" class="active">Members</a>
    <a href="/watchlist">Watchlist</a>
    <a href="/osint">OSINT Globe</a>
    <a href="/ask">Chat</a>
  </div>
  <a href="/feed" class="nav-cta">Live Feed →</a>
</nav>

<div class="page">
  <div class="page-tag">Congressional Directory</div>
  <div class="page-title">Members of Congress</div>

  <div class="controls">
    <input class="search-input" id="search" placeholder="Search by name…" oninput="filter()" />
    <select class="filter-select" id="f-chamber" onchange="filter()">
      <option value="">All chambers</option>
      <option value="house">House</option>
      <option value="senate">Senate</option>
    </select>
    <select class="filter-select" id="f-party" onchange="filter()">
      <option value="">All parties</option>
      <option value="democratic">Democrat</option>
      <option value="republican">Republican</option>
    </select>
    <span class="result-count" id="count"></span>
  </div>

  <div id="grid"><div class="loading">Loading members…</div></div>
</div>

<script>
  let all = [];

  function partyCode(party) {
    if (!party) return 'I';
    const p = party.toLowerCase();
    if (p.includes('democrat')) return 'D';
    if (p.includes('republican')) return 'R';
    return 'I';
  }

  function chamberShort(c) {
    if (!c) return '';
    return c.toLowerCase().includes('senate') ? 'Senate' : 'House';
  }

  function render(list) {
    const grid = document.getElementById('grid');
    document.getElementById('count').textContent = list.length + ' member' + (list.length !== 1 ? 's' : '');
    if (!list.length) { grid.innerHTML = '<div class="empty">No members match this filter.</div>'; return; }
    grid.innerHTML = '<div class="members-grid">' + list.map(m => {
      const pc = partyCode(m.party);
      return `<a href="/member/${m.bioguide_id}" class="member-card">
        <div class="m-name">${m.full_name}</div>
        <div class="m-meta">
          <span class="m-badge m-${pc}">${pc === 'D' ? 'Dem' : pc === 'R' ? 'Rep' : 'Ind'}</span>
          ${m.chamber ? `<span class="m-badge m-chamber">${chamberShort(m.chamber)}</span>` : ''}
          ${m.state ? `<span class="m-state">${m.state}</span>` : ''}
        </div>
      </a>`;
    }).join('') + '</div>';
  }

  function filter() {
    const q       = document.getElementById('search').value.toLowerCase();
    const chamber = document.getElementById('f-chamber').value;
    const party   = document.getElementById('f-party').value;
    render(all.filter(m => {
      if (q && !m.full_name.toLowerCase().includes(q)) return false;
      if (chamber && !(m.chamber || '').toLowerCase().includes(chamber)) return false;
      if (party && !(m.party || '').toLowerCase().includes(party)) return false;
      return true;
    }));
  }

  fetch('/members?limit=5000')
    .then(r => r.json())
    .then(data => { all = data; render(data); })
    .catch(() => { document.getElementById('grid').innerHTML = '<div class="empty">Failed to load members.</div>'; });

  document.getElementById('search').addEventListener('keydown', e => { if (e.key === 'Escape') { e.target.value = ''; filter(); } });
</script>
</body>
</html>
