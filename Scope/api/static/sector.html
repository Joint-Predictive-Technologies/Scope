<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sector War Room — Scope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/tokens.css"/>
  <script src="/rule-names.js"></script>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--cream); font-family: Inter, sans-serif; min-height: 100vh; }
    nav { position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); background: var(--surface-nav); backdrop-filter: blur(12px); padding: 0 2rem; display: flex; align-items: center; gap: 1rem; height: 56px; }
    .nav-brand { font-family: var(--font-sans); font-weight: 900; font-size: 1.2rem; color: var(--amber); letter-spacing: 0.05em; text-decoration: none; margin-right: 0.5rem; }
    .nav-links { display: flex; gap: 1.4rem; align-items: center; flex: 1; flex-wrap: wrap; }
    .nav-links a { font-family: var(--font-mono); font-size: 0.68rem; color: var(--cream2); text-decoration: none; letter-spacing: 0.06em; text-transform: uppercase; transition: color 0.2s; white-space: nowrap; }
    .nav-links a:hover, .nav-links a.active { color: var(--amber); }

    .page { max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem; }
    .hero { display: flex; align-items: flex-end; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 2rem; }
    .page-tag { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); margin-bottom: 0.4rem; }
    .page-title { font-family: var(--font-sans); font-size: 2.1rem; font-weight: 700; color: var(--cream); }
    .heat-badge { text-align: center; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem 1.4rem; }
    .heat-score { font-family: var(--font-sans); font-size: 2.4rem; font-weight: 900; line-height: 1; }
    .heat-label { font-family: var(--font-mono); font-size: 0.58rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 0.3rem; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    .panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 1.2rem 1.3rem; }
    .panel-title { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--amber); margin-bottom: 0.9rem; display: flex; justify-content: space-between; }
    .panel-title .cnt { color: var(--muted); }
    .row { display: flex; align-items: center; gap: 0.6rem; padding: 0.45rem 0; border-bottom: 1px solid var(--border); font-size: 0.78rem; }
    .row:last-child { border-bottom: none; }
    .badge { font-family: var(--font-mono); font-size: 0.56rem; letter-spacing: 0.06em; padding: 1px 6px; border-radius: 3px; flex-shrink: 0; }
    .b-CRITICAL { background: color-mix(in srgb, var(--severity-critical) 18%, transparent); color: var(--red-light); }
    .b-HIGH { background: color-mix(in srgb, var(--amber) 15%, transparent); color: var(--amber2); }
    .b-MEDIUM { background: color-mix(in srgb, var(--link) 15%, transparent); color: var(--link); }
    .tkr { font-family: var(--font-mono); color: var(--amber); text-decoration: none; font-size: 0.72rem; flex-shrink: 0; min-width: 42px; }
    .tkr:hover { color: var(--amber2); }
    .hl { color: var(--cream2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .muted-row { color: var(--muted); font-size: 0.76rem; padding: 0.5rem 0; }
    .rule-tag { font-family: var(--font-mono); font-size: 0.56rem; color: var(--muted); flex-shrink: 0; }
    .tickers-strip { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.3rem; }
    .tchip { font-family: var(--font-mono); font-size: 0.66rem; background: var(--bg3); border: 1px solid var(--border2); border-radius: 4px; padding: 3px 8px; color: var(--cream2); text-decoration: none; }
    .tchip:hover { border-color: var(--amber); color: var(--amber); }
    .tchip .n { color: var(--amber2); }
    .member-row a { color: var(--cream); text-decoration: none; }
    .member-row a:hover { color: var(--amber); }
    .full { grid-column: 1 / -1; }
    .loading { padding: 3rem; text-align: center; font-family: var(--font-mono); color: var(--muted); }
  
    /* --- unified nav mobile (injected) --- */
    .hamburger { display: none; margin-left: auto; background: none; border: 1px solid var(--border2); color: var(--cream2); padding: 9px 13px; border-radius: 4px; cursor: pointer; font-size: 1rem; line-height: 1; }
    @media (max-width: 900px) {
      .hamburger { display: flex; }
      .nav-links { display: none; flex-direction: column; position: fixed; top: 56px; left: 0; right: 0; background: var(--bg); border-bottom: 1px solid var(--border); padding: 1.2rem 2rem; gap: 1rem; z-index: 99; }
      .nav-links.open { display: flex; }
    }
  </style>
</head>
<body>
<nav>
  <a href="/" class="nav-brand">◈ SCOPE</a>
  <button class="hamburger" onclick="document.getElementById('nav-links').classList.toggle('open')">☰</button>
  <div class="nav-links" id="nav-links">
    <a href="/">Brief</a><a href="/home">Dashboard</a>
    <a href="/feed">Alerts <span class="nav-badge" id="alert-badge" style="display:none"></span></a>
    <a href="/congress">Congress</a>
    <a href="/insiders">Insiders</a>
    <a href="/contracts">Contracts</a>
    <a href="/lobbying">Lobbying</a>
    <a href="/intelligence">Intelligence</a>
    <a href="/clusters">Clusters</a>
    <a href="/osint">OSINT Globe</a>
    <a href="/ask">Ask Scope</a>
  </div>
</nav>

<div class="page" id="page"><div class="loading">Loading sector intelligence…</div></div>

<script>
  const slug = decodeURIComponent(location.pathname.split('/sector/')[1] || '').toLowerCase();
  // Text, so it follows the tokens (asserted for both themes) — see sectors.html.
  const heatCol = s => s >= 60 ? 'var(--severity-critical)' : s >= 35 ? 'var(--severity-high)'
                     : s >= 15 ? 'var(--severity-medium)' : 'var(--direction-buy)';
  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const tkr = t => (t||'').replace(/\$/g,'').split(' ')[0];

  function sigRows(list, empty) {
    if (!list || !list.length) return `<div class="muted-row">${empty}</div>`;
    return list.map(a => `<div class="row">
      <span class="badge b-${a.severity}">${a.severity}</span>
      ${tkr(a.ticker) ? `<a class="tkr" href="/ticker/${tkr(a.ticker)}">${tkr(a.ticker)}</a>` : ''}
      <span class="hl">${esc(a.headline)}</span>
      <span class="rule-tag">${a.rule}</span>
    </div>`).join('');
  }

  fetch(`/api/intel/sector/${encodeURIComponent(slug)}?days=30`)
    .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
    .then(d => {
      const h = d.heat || {};
      const trendSym = h.trend === 'up' ? '↑' : h.trend === 'down' ? '↓' : '→';
      document.getElementById('page').innerHTML = `
        <div class="hero">
          <div>
            <div class="page-tag">Sector War Room</div>
            <div class="page-title">${esc(d.sector)}</div>
          </div>
          <div class="heat-badge">
            <div class="heat-score" style="color:${heatCol(h.score||0)}">${h.score ?? 0}</div>
            <div class="heat-label">Heat ${trendSym} · ${h.alert_count||0} signals · ${h.dominant_rule||'—'}</div>
          </div>
        </div>

        <div class="panel full" style="margin-bottom:1.2rem">
          <div class="panel-title">Watchlist Tickers <span class="cnt">${d.tickers.length}</span></div>
          <div class="tickers-strip">
            ${d.tickers.map(t => `<a class="tchip" href="/ticker/${t.ticker}">${t.ticker} <span class="n">${t.signals}</span></a>`).join('')}
          </div>
        </div>

        <div class="grid">
          <div class="panel">
            <div class="panel-title">Active Signals <span class="cnt">${d.active_signals.length}</span></div>
            ${sigRows(d.active_signals, 'No high-severity signals in the last 30 days.')}
          </div>
          <div class="panel">
            <div class="panel-title">Most Active Members <span class="cnt">${d.top_members.length}</span></div>
            ${d.top_members.length ? d.top_members.map(m => `<div class="row member-row">
              <a href="/member/${m.bioguide_id}">${esc(m.full_name)}</a>
              <span class="rule-tag">${m.party||''} ${m.state||''}</span>
              <span class="hl" style="text-align:right;color:var(--amber2)">${m.trade_count} trades</span>
            </div>`).join('') : '<div class="muted-row">No member trades in this sector (90d).</div>'}
          </div>
          <div class="panel">
            <div class="panel-title">Regulatory Pipeline <span class="cnt">RULE_08</span></div>
            ${sigRows(d.regulatory, 'No Federal Register activity mapped.')}
          </div>
          <div class="panel">
            <div class="panel-title">Contract Awards <span class="cnt">RULE_11</span></div>
            ${sigRows(d.contracts, 'No recent contract awards.')}
          </div>
          <div class="panel">
            <div class="panel-title">Patent Activity <span class="cnt">RULE_14</span></div>
            ${sigRows(d.patents, 'No patent clusters flagged.')}
          </div>
          <div class="panel">
            <div class="panel-title">Foreign Pressure <span class="cnt">RULE_12</span></div>
            ${sigRows(d.foreign, 'No foreign lobbying mapped to this sector.')}
          </div>
        </div>`;
    })
    .catch(() => {
      document.getElementById('page').innerHTML = `<div class="loading">
        Unknown sector "<b>${esc(slug)}</b>".<br><br>
        <a href="/sectors" style="color:var(--amber)">← Back to all sectors</a>
      </div>`;
    });
</script>
<script src="/cmdk.js" defer></script>
</body>
</html>
