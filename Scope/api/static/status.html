<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Status — Scope</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="/theme.js"></script>
  <script src="/nav.js"></script>
  <link rel="stylesheet" href="/tokens.css"/>
  <script src="/rule-names.js"></script>
  <style>
* { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--cream); font-family:Inter,sans-serif; min-height:100vh; }
    nav { position:sticky; top:0; border-bottom:1px solid var(--border); background:var(--surface-nav); padding:0 2rem; display:flex; align-items:center; gap:1.4rem; height:56px; }
    .nav-brand { font-family:var(--font-sans); font-weight:900; font-size:1.2rem; color:var(--amber); text-decoration:none; }
    nav a { font-family:var(--font-mono); font-size:0.68rem; color:var(--cream2); text-decoration:none; letter-spacing:0.06em; text-transform:uppercase; }
    nav a:hover { color:var(--amber); }
    .page { max-width:1000px; margin:0 auto; padding:2.5rem 2rem; }
    .page-title { font-family:var(--font-sans); font-size:2rem; font-weight:700; margin-bottom:0.3rem; }
    .page-sub { color:var(--cream2); font-size:0.85rem; margin-bottom:1.5rem; }
    .status-pill { display:inline-block; font-family:var(--font-mono); font-size:0.66rem; padding:3px 10px; border-radius:20px; margin-bottom:1.5rem; }
    .ok { background:color-mix(in srgb, var(--direction-buy) 15%, transparent); color:var(--green); } .bad { background:color-mix(in srgb, var(--severity-critical) 15%, transparent); color:var(--red); }
    table { width:100%; border-collapse:collapse; font-family:var(--font-mono); font-size:0.7rem; }
    th { text-align:left; color:var(--muted); font-size:0.58rem; letter-spacing:0.06em; text-transform:uppercase; padding:0.5rem 0.6rem; border-bottom:1px solid var(--border2); }
    td { padding:0.55rem 0.6rem; border-bottom:1px solid var(--border); }
    tr.stale td { background:color-mix(in srgb, var(--severity-critical) 6%, transparent); }
    .flag { color:var(--red); font-weight:600; }
    .fresh { color:var(--green); }
    .src { color:var(--amber2); }
    .loading { padding:3rem; text-align:center; color:var(--muted); font-family:var(--font-mono); }
  </style>
</head>
<body>
<nav>
  <a href="/" class="nav-brand">◈ SCOPE</a>
  <a href="/">Brief</a><a href="/home">Dashboard</a><a href="/performance">Performance</a><a href="/feed">Alerts</a>
</nav>
<div class="page">
  <div class="page-title">System Status</div>
  <div class="page-sub">Scheduler health — every job's cadence and when it last actually ran. A job that hasn't run in more than 2× its interval is flagged (it may be silently failing).</div>
  <div id="pill"></div>
  <div id="content"><div class="loading">Loading scheduler status…</div></div>
</div>
<script>
  // Expected cadence (seconds) per activity_log source — used to flag staleness.
  const EXPECTED = {
    RULE_OSINT:900, RULE_ADSB:300, RULE_07:1200, RULE_REDDIT:1800, RULE_01B:7200,
    RULE_06:7200, RULE_10:3600, RULE_ANOMALY:10800, RULE_11:21600, RULE_08:14400,
    RULE_15:21600, RULE_CLUSTER:14400, SCORING:600, RULE_09:86400, RULE_12:604800,
    RULE_13:86400, RULE_14:302400, DECAY:86400, BACKTEST:604800, BRIEF:86400,
    RULE_COLLECTOR:21600,
  };
  // Doorways to the ticker-universe ball pit (/universe) — a browsable field of
  // collected NAMES, not a signal surface. Only RULE_COLLECTOR writes
  // ticker_universe; RULE_REDDIT links too because it ingests the reddit
  // mentions the collector evaluates — but it is a separate, alert-emitting rule.
  const UNIVERSE_LINKED = new Set(['RULE_COLLECTOR', 'RULE_REDDIT']);
  const ago = s => { if(!s) return null; const t=new Date(String(s).replace(' ','T')+(String(s).includes('Z')?'':'Z')).getTime(); return isNaN(t)?null:(Date.now()-t)/1000; };
  const fmtAgo = sec => sec==null?'never':sec<3600?Math.floor(sec/60)+'m ago':sec<86400?Math.floor(sec/3600)+'h ago':Math.floor(sec/86400)+'d ago';
  const fmtInt = sec => sec==null?'—':sec<3600?Math.round(sec/60)+'m':sec<86400?Math.round(sec/3600)+'h':Math.round(sec/86400)+'d';

  fetch('/api/scheduler-status').then(r=>r.json()).then(d => {
    document.getElementById('pill').innerHTML =
      `<span class="status-pill ${d.status==='running'?'ok':'bad'}">Scheduler ${d.status} · ${d.job_count||0} jobs</span>`;
    const act = d.activity || {};
    // Build a row per known source using activity_log ground truth.
    const sources = Object.keys(EXPECTED).filter(s => act[s] || EXPECTED[s]);
    const rows = sources.map(src => {
      const a = act[src] || {};
      const sec = ago(a.last_run);
      const exp = EXPECTED[src];
      const stale = a.last_run ? (sec > exp*2) : true;
      return {src, sec, exp, stale, last_run:a.last_run, emitted:a.last_emitted};
    }).sort((x,y)=> (y.stale-x.stale) || ((y.sec||1e12)-(x.sec||1e12)));
    document.getElementById('content').innerHTML = `
      <table>
        <thead><tr><th>Source</th><th>Expected every</th><th>Last run</th><th>Last emitted</th><th>Status</th></tr></thead>
        <tbody>${rows.map(r=>`
          <tr class="${r.stale?'stale':''}">
            <td class="src">${UNIVERSE_LINKED.has(r.src)
              ? `<a href="/universe" class="src" style="text-decoration:none;border-bottom:1px dotted var(--border2)" title="Open the ticker universe — the coverage list built from reddit mentions (currently a seeded demo; live wiring pending)">${ruleName(r.src)} ◍</a>`
              : `<span title="${r.src}">${ruleName(r.src)}</span>`}</td>
            <td>${fmtInt(r.exp)}</td>
            <td>${fmtAgo(r.sec)}</td>
            <td>${r.emitted!=null?r.emitted:'—'}</td>
            <td>${r.stale?'<span class="flag">⚠ STALE</span>':'<span class="fresh">✓ healthy</span>'}</td>
          </tr>`).join('')}</tbody>
      </table>
      <div style="margin-top:1.5rem;color:var(--muted);font-family:var(--font-mono);font-size:0.62rem">
        Note: "last run" reflects the activity_log written by each rule's run(). A source with no row has never logged a run in this environment.
      </div>`;
  }).catch(()=>{ document.getElementById('content').innerHTML = '<div class="loading">Status unavailable.</div>'; });
</script>
<script src="/cmdk.js" defer></script>
</body>
</html>
