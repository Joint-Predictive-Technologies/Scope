<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Government Contracts — Scope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=IBM+Plex+Mono:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0b09; --bg2: #111009; --bg3: #181610;
      --cream: #e8e0cc; --cream2: #c8bfa8;
      --amber: #c8922a; --amber2: #e8aa3a;
      --muted: #7a7060; --border: #2a2620; --border2: #3a3428;
      --red: #e55b4d; --green: #4dc47a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--cream); font-family: Inter, sans-serif; min-height: 100vh; }

    nav { position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); background: rgba(12,11,9,0.95); backdrop-filter: blur(12px); padding: 0 2rem; display: flex; align-items: center; gap: 1rem; height: 56px; }
    .nav-brand { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.2rem; color: var(--amber); letter-spacing: 0.05em; text-decoration: none; margin-right: 0.5rem; }
    .nav-links { display: flex; gap: 1.5rem; align-items: center; flex: 1; }
    .nav-links a { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; color: var(--cream2); text-decoration: none; letter-spacing: 0.06em; text-transform: uppercase; transition: color 0.2s; white-space: nowrap; }
    .nav-links a:hover, .nav-links a.active { color: var(--amber); }
    .hamburger { display: none; margin-left: auto; background: none; border: 1px solid var(--border2); color: var(--cream2); padding: 5px 9px; border-radius: 4px; cursor: pointer; font-size: 1rem; line-height: 1; }
    @media (max-width: 900px) {
      .hamburger { display: flex; }
      .nav-links { display: none; flex-direction: column; position: fixed; top: 56px; left: 0; right: 0; background: var(--bg); border-bottom: 1px solid var(--border); padding: 1.2rem 2rem; gap: 1rem; z-index: 99; }
      .nav-links.open { display: flex; }
    }

    .page { max-width: 1100px; margin: 0 auto; padding: 3rem 2rem; }
    .page-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); margin-bottom: 0.5rem; }
    .page-title { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; color: var(--cream); margin-bottom: 0.4rem; }
    .page-sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 2rem; }

    .filters { display: flex; gap: 0.7rem; flex-wrap: wrap; margin-bottom: 1.5rem; align-items: center; }
    .filter-input, .filter-select { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; background: var(--bg2); border: 1px solid var(--border); color: var(--cream2); padding: 7px 12px; border-radius: 4px; outline: none; }
    .filter-input:focus, .filter-select:focus { border-color: var(--amber); color: var(--cream); }
    .filter-input::placeholder { color: var(--muted); }
    .filter-select { appearance: none; }
    .filter-btn { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; background: var(--amber); color: var(--bg); border: none; padding: 7px 16px; border-radius: 4px; cursor: pointer; font-weight: 500; }
    .filter-btn:hover { background: var(--amber2); }
    .filter-count { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; color: var(--muted); margin-left: auto; }

    /* ALERT CARDS (RULE_11) */
    .alerts-section { margin-bottom: 2.5rem; }
    .section-header { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.8rem; padding-bottom: 0.4rem; border-bottom: 1px solid var(--border); }
    .card-list { display: flex; flex-direction: column; gap: 1px; margin-bottom: 1rem; }
    .alert-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 1rem 1.3rem; cursor: pointer; transition: border-color 0.15s; }
    .alert-card:hover { border-color: var(--border2); }
    .alert-card.expanded { border-color: var(--amber); }
    .alert-top { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .badge { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; letter-spacing: 0.08em; padding: 2px 7px; border-radius: 3px; font-weight: 500; flex-shrink: 0; }
    .badge-CRITICAL { background: rgba(229,91,77,0.15); color: var(--red); border: 1px solid rgba(229,91,77,0.3); }
    .badge-HIGH { background: rgba(200,146,42,0.15); color: var(--amber2); border: 1px solid rgba(200,146,42,0.3); }
    .badge-MEDIUM { background: rgba(42,100,160,0.15); color: #6ab0e0; border: 1px solid rgba(42,100,160,0.25); }
    .badge-source { background: transparent; color: var(--muted); border: 1px solid var(--border2); font-size: 0.58rem; }
    .ticker-chip { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem; color: var(--amber); border: 1px solid rgba(200,146,42,0.25); padding: 2px 7px; border-radius: 3px; flex-shrink: 0; text-decoration: none; }
    .ticker-chip:hover { background: rgba(200,146,42,0.1); }
    .alert-headline { font-size: 0.86rem; color: var(--cream); flex: 1; min-width: 200px; }
    .alert-time { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; color: var(--muted); flex-shrink: 0; cursor: help; }
    .alert-detail { margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px solid var(--border); font-size: 0.82rem; color: var(--cream2); line-height: 1.6; display: none; }
    .alert-card.expanded .alert-detail { display: block; }
    .verify-link { display: inline-block; margin-top: 0.6rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem; color: var(--amber); border: 1px solid rgba(200,146,42,0.3); padding: 3px 10px; border-radius: 3px; text-decoration: none; }
    .verify-link:hover { background: rgba(200,146,42,0.1); }

    /* CONTRACTS TABLE */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    thead th { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 0.7rem 1rem; border-bottom: 1px solid var(--border); text-align: left; cursor: pointer; white-space: nowrap; user-select: none; }
    thead th:hover { color: var(--amber); }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
    tbody tr:hover { background: var(--bg2); }
    tbody td { padding: 0.7rem 1rem; color: var(--cream2); vertical-align: top; }
    .td-amount { font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; color: var(--amber); white-space: nowrap; }
    .td-ticker a { font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; color: var(--amber); text-decoration: none; }
    .td-ticker a:hover { text-decoration: underline; }
    .td-desc { max-width: 280px; font-size: 0.78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .empty { padding: 3rem; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; color: var(--muted); }
    .loading { padding: 3rem; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; color: var(--muted); }
    @media (max-width: 700px) { .alert-time { display: none; } }
  </style>
</head>
<body>
<nav>
  <a href="/" class="nav-brand">◈ SCOPE</a>
  <button class="hamburger" id="ham-btn">☰</button>
  <div class="nav-links" id="nav-links">
    <a href="/">Dashboard</a>
    <a href="/congress">Congress</a>
    <a href="/insiders">Insiders</a>
    <a href="/contracts" class="active">Contracts</a>
    <a href="/lobbying">Lobbying</a>
    <a href="/ask">Ask Scope</a>
    <a href="/feed">Alerts</a>
  </div>
</nav>

<div class="page">
  <div class="page-eyebrow">USASpending.gov · RULE_11</div>
  <div class="page-title">Government Contracts</div>
  <div class="page-sub">Federal contracts $50M+ awarded to publicly traded companies. Source: USASpending.gov.</div>

  <div class="filters">
    <input class="filter-input" id="f-ticker" placeholder="Ticker (e.g. LMT)" style="width:120px" />
    <input class="filter-input" id="f-agency" placeholder="Agency keyword" style="width:160px" />
    <select class="filter-select" id="f-min">
      <option value="0">Any amount</option>
      <option value="100000000">$100M+</option>
      <option value="500000000">$500M+</option>
      <option value="1000000000">$1B+</option>
    </select>
    <select class="filter-select" id="f-sort">
      <option value="amount">Largest first</option>
      <option value="date">Most recent</option>
    </select>
    <button class="filter-btn" onclick="load()">Filter</button>
    <button class="filter-btn" id="refresh-btn" onclick="refreshData()" style="background:transparent;color:var(--amber);border:1px solid rgba(200,146,42,0.4)">↺ Refresh</button>
    <span class="filter-count" id="result-count"></span>
  </div>
  <div id="refresh-status" style="display:none;font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--muted);margin-bottom:1rem;padding:0.8rem 1rem;background:var(--bg2);border:1px solid var(--border);border-radius:4px"></div>

  <div class="alerts-section">
    <div class="section-header">Rule 11 Alerts</div>
    <div class="card-list" id="alerts-list"><div class="loading">Loading alerts…</div></div>
  </div>

  <div class="section-header">All Contracts</div>
  <div id="table-area"><div class="loading">Loading contracts…</div></div>
</div>

<script>
  document.getElementById('ham-btn').addEventListener('click', () => {
    document.getElementById('nav-links').classList.toggle('open');
  });

  function withTimeout(ms) { const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; }

  function timeAgo(dateStr) {
    if (!dateStr) return '';
    let ts;
    if (typeof dateStr === 'number' || /^\d{10,13}$/.test(String(dateStr))) {
      const n = Number(dateStr);
      ts = n > 1e10 ? n : n * 1000;
    } else {
      const s = String(dateStr).trim().replace(' ', 'T');
      ts = new Date(s + (s.includes('Z') || s.includes('+') ? '' : 'Z')).getTime();
    }
    if (isNaN(ts)) return '';
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 0)    return 'just now';
    if (diff < 60)   return 'just now';
    if (diff < 3600) return Math.floor(diff/60) + 'm ago';
    if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
    return Math.floor(diff/86400) + 'd ago';
  }
  function exactTime(ts) {
    if (!ts) return '';
    return new Date(ts.includes('Z') ? ts : ts + 'Z').toLocaleString();
  }
  function fmtAmount(n) {
    if (!n) return '—';
    if (n >= 1e9) return '$' + (n/1e9).toFixed(1) + 'B';
    if (n >= 1e6) return '$' + (n/1e6).toFixed(0) + 'M';
    return '$' + n.toLocaleString();
  }

  let sortKey = 'amount', sortDir = -1;

  async function load() {
    const ticker  = document.getElementById('f-ticker').value.trim();
    const agency  = document.getElementById('f-agency').value.trim();
    const minAmt  = document.getElementById('f-min').value;
    const sortVal = document.getElementById('f-sort').value;

    // Load alerts
    const alertsEl = document.getElementById('alerts-list');
    alertsEl.innerHTML = '<div class="loading">Loading…</div>';
    let alertUrl = '/alerts?rule=RULE_11&days=365&limit=50';
    if (ticker) alertUrl += `&ticker=${encodeURIComponent(ticker)}`;
    const alerts = await fetch(alertUrl, { signal: withTimeout(8000) }).then(r=>r.json()).catch(()=>[]);

    if (!alerts.length) {
      alertsEl.innerHTML = '<div class="empty">No RULE_11 alerts yet. Run rule_11_contracts.py to populate.</div>';
    } else {
      alertsEl.innerHTML = alerts.map((a, i) => {
        const t = a.ticker ? a.ticker.replace(/\$/g,'').split(' ')[0] : null;
        const tChip = t ? `<a href="/ticker/${t}" class="ticker-chip" onclick="event.stopPropagation()">${t}</a>` : '';
        return `
          <div class="alert-card" onclick="this.classList.toggle('expanded')" id="ac-${i}">
            <div class="alert-top">
              <span class="badge badge-${a.severity}">${a.severity}</span>
              ${tChip}
              <span class="badge badge-source">SOURCE: USASpending.gov</span>
              <span class="alert-headline">${a.headline}</span>
              <span class="alert-time" title="${exactTime(a.created_at)}">${timeAgo(a.created_at)}</span>
            </div>
            <div class="alert-detail">
              ${a.detail ? `<div>${a.detail}</div>` : ''}
              ${(() => {
                const parts = (a.tags || '').split('|');
                const awardId = (parts[2] || '').trim();
                const recipient = encodeURIComponent((parts[0] || '').trim());
                const url = awardId
                  ? `https://www.usaspending.gov/award/${awardId}/`
                  : `https://www.usaspending.gov/search/?query=${recipient}`;
                return `<a href="${url}" target="_blank" rel="noopener" class="verify-link">Verify → USASpending.gov</a>`;
              })()}
            </div>
          </div>`;
      }).join('');
    }

    // Load contracts table
    const tableEl = document.getElementById('table-area');
    tableEl.innerHTML = '<div class="loading">Loading…</div>';
    let url = `/contracts/data?sort=${sortVal}&limit=200`;
    if (ticker)  url += `&ticker=${encodeURIComponent(ticker)}`;
    if (agency)  url += `&agency=${encodeURIComponent(agency)}`;
    if (minAmt)  url += `&min_amount=${minAmt}`;
    const data = await fetch(url, { signal: withTimeout(10000) }).then(r=>r.json()).catch(()=>[]);
    document.getElementById('result-count').textContent = data.length + ' contracts';

    if (!data.length) {
      tableEl.innerHTML = '<div class="empty">No contracts found. Run rule_11_contracts.py to populate.</div>';
      return;
    }

    tableEl.innerHTML = `<div class="table-wrap"><table>
      <thead><tr>
        <th>Recipient</th>
        <th>Ticker</th>
        <th>Amount</th>
        <th>Agency</th>
        <th>Date</th>
        <th>Source</th>
      </tr></thead>
      <tbody>${data.map(c => {
        const url = c.award_id
          ? `https://www.usaspending.gov/award/${c.award_id}/`
          : `https://www.usaspending.gov/search/?query=${encodeURIComponent(c.recipient_name || '')}`;
        return `
        <tr>
          <td>${c.recipient_name || '—'}</td>
          <td class="td-ticker">${c.ticker ? `<a href="/ticker/${c.ticker}">${c.ticker}</a>` : '—'}</td>
          <td class="td-amount">${fmtAmount(c.amount)}</td>
          <td style="font-size:0.78rem">${c.agency || '—'}</td>
          <td style="font-family:'IBM Plex Mono',monospace;font-size:0.72rem;white-space:nowrap">${c.award_date || '—'}</td>
          <td><a href="${url}" target="_blank" rel="noopener" class="verify-link" style="margin-top:0;padding:2px 7px">↗</a></td>
        </tr>`;
      }).join('')}
      </tbody>
    </table></div>`;
  }

  async function refreshData() {
    const btn = document.getElementById('refresh-btn');
    const status = document.getElementById('refresh-status');
    btn.disabled = true;
    btn.textContent = '↺ Fetching…';
    status.style.display = 'block';
    status.textContent = '⟳ Fetching contracts from USASpending.gov — this takes ~30 seconds…';
    try {
      const r = await fetch('/contracts/refresh', { method: 'POST' });
      const d = await r.json();
      if (r.ok) {
        status.textContent = `✓ Done — ${d.output ? d.output.length + ' contract events processed' : 'refresh complete'}. Reloading…`;
        await load();
        setTimeout(() => { status.style.display = 'none'; }, 3000);
      } else {
        status.style.color = 'var(--red)';
        status.textContent = `✗ Error: ${d.error || 'refresh failed'}`;
      }
    } catch (e) {
      status.style.color = 'var(--red)';
      status.textContent = `✗ Network error: ${e.message}`;
    }
    btn.disabled = false;
    btn.textContent = '↺ Refresh';
  }

  async function init() {
    await load();
    // Auto-trigger if both alerts and contracts are empty (fresh deploy)
    const alertsEmpty = document.getElementById('alerts-list').querySelector('.empty');
    const tableEmpty  = document.getElementById('table-area').querySelector('.empty');
    if (alertsEmpty && tableEmpty) {
      refreshData();
    }
  }

  init();
  document.getElementById('f-ticker').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
</script>
</body>
</html>
