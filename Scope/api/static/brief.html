<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Brief — Scope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=IBM+Plex+Mono:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0b09; --bg2: #111009; --bg3: #181610;
      --cream: #e8e0cc; --cream2: #c8bfa8;
      --amber: #c8922a; --amber2: #e8aa3a;
      --muted: #7a7060; --border: #2a2620; --border2: #3a3428;
      --red: #e55b4d; --green: #4dc47a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--cream); font-family: Inter, sans-serif; min-height: 100vh; }

    nav { position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); background: rgba(12,11,9,0.95); backdrop-filter: blur(12px); padding: 0 2rem; display: flex; align-items: center; gap: 1rem; height: 56px; }
    .nav-brand { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.2rem; color: var(--amber); letter-spacing: 0.05em; text-decoration: none; margin-right: 0.5rem; }
    .nav-links { display: flex; gap: 1.5rem; align-items: center; flex: 1; }
    .nav-links a { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; color: var(--cream2); text-decoration: none; letter-spacing: 0.06em; text-transform: uppercase; transition: color 0.2s; white-space: nowrap; }
    .nav-links a:hover, .nav-links a.active { color: var(--amber); }
    .hamburger { display: none; margin-left: auto; background: none; border: 1px solid var(--border2); color: var(--cream2); padding: 5px 9px; border-radius: 4px; cursor: pointer; font-size: 1rem; line-height: 1; }
    @media (max-width: 900px) {
      .hamburger { display: flex; }
      .nav-links { display: none; flex-direction: column; position: fixed; top: 56px; left: 0; right: 0; background: var(--bg); border-bottom: 1px solid var(--border); padding: 1.2rem 2rem; gap: 1rem; z-index: 99; }
      .nav-links.open { display: flex; }
    }

    .page { max-width: 820px; margin: 0 auto; padding: 3rem 2rem 5rem; }
    .page-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); margin-bottom: 0.6rem; }
    .page-title { font-family: 'Playfair Display', serif; font-size: 2.4rem; font-weight: 900; color: var(--cream); margin-bottom: 0.4rem; line-height: 1.1; }
    .page-date { font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; color: var(--muted); margin-bottom: 2rem; }

    /* AI SUMMARY BOX */
    .ai-summary { background: #100f0a; border: 1px solid rgba(200,146,42,0.35); border-radius: 10px; padding: 1.8rem 2rem; margin-bottom: 2rem; position: relative; }
    .ai-summary-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.58rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.5rem; }
    .ai-badge { background: rgba(200,146,42,0.12); border: 1px solid rgba(200,146,42,0.25); padding: 2px 7px; border-radius: 3px; }
    .ai-summary-text { font-family: 'Playfair Display', serif; font-size: 1.05rem; color: var(--cream); line-height: 1.7; font-style: italic; }
    .ai-model-credit { font-family: 'IBM Plex Mono', monospace; font-size: 0.58rem; color: var(--muted); margin-top: 1rem; letter-spacing: 0.06em; }

    /* NOTICE BANNER */
    .notice { background: rgba(200,146,42,0.06); border: 1px solid rgba(200,146,42,0.2); border-radius: 6px; padding: 0.7rem 1rem; margin-bottom: 1.5rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--amber); }

    /* SECTION CARDS */
    .sections-grid { display: flex; flex-direction: column; gap: 0.8rem; }
    .section-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 1.2rem 1.6rem; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; transition: border-color 0.15s; }
    .section-card:hover { border-color: var(--border2); }
    .section-left { flex: 1; }
    .section-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); margin-bottom: 0.35rem; }
    .section-one-liner { font-size: 0.88rem; color: var(--cream); line-height: 1.5; }
    .section-link { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); text-decoration: none; border: 1px solid var(--border2); padding: 5px 12px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; transition: color 0.15s, border-color 0.15s; }
    .section-link:hover { color: var(--amber); border-color: rgba(200,146,42,0.3); }

    .gen-at { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem; color: var(--muted); margin-top: 2rem; }
    .regen-btn { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; letter-spacing: 0.06em; text-transform: uppercase; background: transparent; border: 1px solid var(--border2); color: var(--muted); padding: 6px 14px; border-radius: 4px; cursor: pointer; margin-top: 0.8rem; transition: border-color 0.15s, color 0.15s; }
    .regen-btn:hover { border-color: var(--amber); color: var(--amber); }
    .regen-btn:disabled { opacity: 0.4; cursor: default; }

    .loading { padding: 4rem; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; color: var(--muted); }
    .error-box { background: rgba(229,91,77,0.07); border: 1px solid rgba(229,91,77,0.2); border-radius: 8px; padding: 1.2rem 1.6rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; color: var(--red); }
  </style>
</head>
<body>
<nav>
  <a href="/" class="nav-brand">◈ SCOPE</a>
  <button class="hamburger" id="ham-btn">☰</button>
  <div class="nav-links" id="nav-links">
    <a href="/">Dashboard</a>
    <a href="/congress">Congress</a>
    <a href="/insiders">Insiders</a>
    <a href="/contracts">Contracts</a>
    <a href="/lobbying">Lobbying</a>
    <a href="/ask">Ask Scope</a>
    <a href="/feed">Alerts</a>
  </div>
</nav>

<div class="page">
  <div class="page-eyebrow">Daily Intelligence Brief</div>
  <div class="page-title">What Changed Overnight</div>
  <div class="page-date" id="page-date">Loading…</div>

  <div id="notice-area"></div>
  <div id="summary-area"><div class="loading">Generating daily brief with AI…</div></div>
  <div class="sections-grid" id="sections-area"></div>
  <div class="gen-at" id="gen-at"></div>
  <button class="regen-btn" id="regen-btn" onclick="regen()">↺ Regenerate brief</button>
</div>

<script>
  document.getElementById('ham-btn').addEventListener('click', () => {
    document.getElementById('nav-links').classList.toggle('open');
  });

  const SECTIONS = [
    { key: 'congressional',      label: 'Congressional Activity', href: '/congress' },
    { key: 'insider',            label: 'Insider Activity',       href: '/insiders' },
    { key: 'regulatory',         label: 'Regulatory Filings',     href: '/feed?rule=RULE_08' },
    { key: 'prediction_markets', label: 'Prediction Markets',     href: '/feed?rule=RULE_07' },
    { key: 'corroborations',     label: 'Corroborations',         href: '/feed?rule=RULE_10' },
    { key: 'lobbying',           label: 'Lobbying Activity',      href: '/lobbying' },
    { key: 'contracts',          label: 'Gov Contracts',          href: '/contracts' },
  ];

  function timeAgo(ts) {
    if (!ts) return '';
    const d = new Date(ts.includes('Z') ? ts : ts + 'Z');
    const s = Math.floor((Date.now() - d) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';
  }

  function render(data) {
    document.getElementById('page-date').textContent =
      new Date(data.date || Date.now()).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});

    if (!data.is_today) {
      document.getElementById('notice-area').innerHTML =
        `<div class="notice">Showing ${data.date || 'yesterday\'s'} brief · ${data.note || ''}</div>`;
    }

    if (!data.content_json) {
      document.getElementById('summary-area').innerHTML =
        `<div class="error-box">No brief available yet. Click Regenerate to generate one.</div>`;
      return;
    }

    let parsed;
    try { parsed = JSON.parse(data.content_json); } catch {
      document.getElementById('summary-area').innerHTML =
        `<div class="error-box">Failed to parse brief content.</div>`;
      return;
    }

    document.getElementById('summary-area').innerHTML = `
      <div class="ai-summary">
        <div class="ai-summary-label">
          <span>AI Summary</span>
          <span class="ai-badge">Groq Llama 3.3</span>
        </div>
        <div class="ai-summary-text">${parsed.ai_summary || 'Summary not available.'}</div>
        <div class="ai-model-credit">AI SUMMARY · Groq Llama 3.3 · Not investment advice</div>
      </div>`;

    const sections = parsed.sections || {};
    document.getElementById('sections-area').innerHTML = SECTIONS.map(s => {
      const sec = sections[s.key] || {};
      const oneLiner = sec.one_liner || 'No data for this section.';
      return `
        <div class="section-card">
          <div class="section-left">
            <div class="section-label">${s.label}</div>
            <div class="section-one-liner">${oneLiner}</div>
          </div>
          <a href="${s.href}" class="section-link">View →</a>
        </div>`;
    }).join('');

    if (data.generated_at) {
      document.getElementById('gen-at').textContent =
        `Generated ${timeAgo(data.generated_at)} · ${new Date(data.generated_at.includes('Z') ? data.generated_at : data.generated_at + 'Z').toLocaleString()}`;
    }
  }

  async function load() {
    try {
      const r = await fetch('/brief/data');
      const d = await r.json();
      render(d);
    } catch (e) {
      document.getElementById('summary-area').innerHTML =
        `<div class="error-box">Failed to load brief: ${e.message}</div>`;
    }
  }

  async function regen() {
    const btn = document.getElementById('regen-btn');
    btn.disabled = true; btn.textContent = 'Generating…';
    document.getElementById('summary-area').innerHTML = '<div class="loading">Regenerating with AI… 10-15 seconds.</div>';
    document.getElementById('sections-area').innerHTML = '';
    try {
      const r = await fetch('/brief/generate?force=true', { method: 'POST' });
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      render(d);
    } catch (e) {
      document.getElementById('summary-area').innerHTML =
        `<div class="error-box">Regeneration failed: ${e.message}</div>`;
    }
    btn.disabled = false; btn.textContent = '↺ Regenerate brief';
  }

  load();
</script>
</body>
</html>
