<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Brief — Scope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/tokens.css"/>
  <script src="/rule-names.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--cream); font-family: Inter, sans-serif; min-height: 100vh; }

    nav { position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); background: rgba(12,11,9,0.95); backdrop-filter: blur(12px); padding: 0 2rem; display: flex; align-items: center; gap: 1rem; height: 56px; }
    .nav-brand { font-family: var(--font-sans); font-weight: 900; font-size: 1.2rem; color: var(--amber); letter-spacing: 0.05em; text-decoration: none; margin-right: 0.5rem; }
    .nav-links { display: flex; gap: 1.5rem; align-items: center; flex: 1; }
    .nav-links a { font-family: var(--font-mono); font-size: 0.68rem; color: var(--cream2); text-decoration: none; letter-spacing: 0.06em; text-transform: uppercase; transition: color 0.2s; white-space: nowrap; }
    .nav-links a:hover, .nav-links a.active { color: var(--amber); }
    .hamburger { display: none; margin-left: auto; background: none; border: 1px solid var(--border2); color: var(--cream2); padding: 9px 13px; border-radius: 4px; cursor: pointer; font-size: 1rem; line-height: 1; }
    @media (max-width: 900px) {
      .hamburger { display: flex; }
      .nav-links { display: none; flex-direction: column; position: fixed; top: 56px; left: 0; right: 0; background: var(--bg); border-bottom: 1px solid var(--border); padding: 1.2rem 2rem; gap: 1rem; z-index: 99; }
      .nav-links.open { display: flex; }
    }

    .page { max-width: 820px; margin: 0 auto; padding: 3rem 2rem 5rem; }
    .page-eyebrow { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); margin-bottom: 0.6rem; }
    .page-title { font-family: var(--font-serif); font-size: 2.4rem; font-weight: 900; color: var(--cream); margin-bottom: 0.4rem; line-height: 1.1; }
    .page-date { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); margin-bottom: 2rem; }

    /* AI SUMMARY BOX */
    .ai-summary { background: #100f0a; border: 1px solid rgba(200,146,42,0.35); border-radius: 10px; padding: 1.8rem 2rem; margin-bottom: 2rem; position: relative; }
    .ai-summary-label { font-family: var(--font-mono); font-size: 0.58rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.5rem; }
    .ai-badge { background: rgba(200,146,42,0.12); border: 1px solid rgba(200,146,42,0.25); padding: 2px 7px; border-radius: 3px; }
    .ai-summary-text { font-family: var(--font-sans); font-size: 1.05rem; color: var(--cream); line-height: 1.7; font-style: italic; }
    .ai-model-credit { font-family: var(--font-mono); font-size: 0.58rem; color: var(--muted); margin-top: 1rem; letter-spacing: 0.06em; }

    /* NOTICE BANNER */
    .notice { background: rgba(200,146,42,0.06); border: 1px solid rgba(200,146,42,0.2); border-radius: 6px; padding: 0.7rem 1rem; margin-bottom: 1.5rem; font-family: var(--font-mono); font-size: 0.7rem; color: var(--amber); }

    /* SECTION CARDS */
    .sections-grid { display: flex; flex-direction: column; gap: 0.8rem; }
    .section-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 1.2rem 1.6rem; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; transition: border-color 0.15s; }
    .section-card:hover { border-color: var(--border2); }
    .section-left { flex: 1; }
    .section-label { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); margin-bottom: 0.35rem; }
    .section-one-liner { font-size: 0.88rem; color: var(--cream); line-height: 1.5; }
    .section-link { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); text-decoration: none; border: 1px solid var(--border2); padding: 5px 12px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; transition: color 0.15s, border-color 0.15s; }
    .section-link:hover { color: var(--amber); border-color: rgba(200,146,42,0.3); }

    .gen-at { font-family: var(--font-mono); font-size: 0.62rem; color: var(--muted); margin-top: 2rem; }
    .regen-btn { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.06em; text-transform: uppercase; background: transparent; border: 1px solid var(--border2); color: var(--muted); padding: 6px 14px; border-radius: 4px; cursor: pointer; margin-top: 0.8rem; transition: border-color 0.15s, color 0.15s; }
    .regen-btn:hover { border-color: var(--amber); color: var(--amber); }
    .regen-btn:disabled { opacity: 0.4; cursor: default; }

    .loading { padding: 4rem; text-align: center; font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }
    .error-box { background: rgba(229,91,77,0.07); border: 1px solid rgba(229,91,77,0.2); border-radius: 8px; padding: 1.2rem 1.6rem; font-family: var(--font-mono); font-size: 0.75rem; color: var(--red); }

    /* ── CMD PALETTE ── */
    #cmd-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:9000; backdrop-filter:blur(4px); }
    #cmd-backdrop.open { display:flex; align-items:flex-start; justify-content:center; padding-top:12vh; }
    #cmd-box { background:#1a1814; border:1px solid #3a3428; border-radius:10px; width:min(640px,92vw); overflow:hidden; }
    #cmd-input { width:100%; background:transparent; border:none; border-bottom:1px solid #2a2620; outline:none; font-family:var(--font-mono); font-size:0.9rem; color:#e8e0cc; padding:1rem 1.2rem; }
    #cmd-results { max-height:360px; overflow-y:auto; }
    .cmd-group-label { font-family:var(--font-mono); font-size:0.6rem; letter-spacing:0.12em; text-transform:uppercase; color:#7a7060; padding:0.6rem 1.2rem 0.2rem; }
    .cmd-item { display:flex; align-items:center; gap:0.8rem; padding:0.65rem 1.2rem; cursor:pointer; text-decoration:none; border-left:2px solid transparent; }
    .cmd-item:hover,.cmd-item.active { background:#222018; border-left-color:#c8922a; }
    .cmd-item-icon { font-size:0.9rem; opacity:0.6; width:18px; text-align:center; flex-shrink:0; }
    .cmd-item-main { font-family:var(--font-mono); font-size:0.75rem; color:#e8e0cc; }
    .cmd-item-sub  { font-size:0.68rem; color:#7a7060; margin-top:1px; }
    .cmd-badge { font-family:var(--font-mono); font-size:0.55rem; padding:1px 5px; border-radius:2px; margin-left:auto; flex-shrink:0; }
    .cmd-badge-CRITICAL { background:rgba(229,91,77,0.2); color:#e55b4d; }
    .cmd-badge-HIGH     { background:rgba(200,146,42,0.2); color:#c8922a; }
    .cmd-badge-MEDIUM   { background:rgba(106,176,224,0.2); color:#6ab0e0; }
    .cmd-empty { font-family:var(--font-mono); font-size:0.75rem; color:#7a7060; padding:1.5rem 1.2rem; text-align:center; }
    .cmd-hint { font-family:var(--font-mono); font-size:0.58rem; color:#7a7060; padding:0.5rem 1.2rem; border-top:1px solid #2a2620; display:flex; gap:1.2rem; }
    .cmd-hint kbd { background:#2a2620; border:1px solid #3a3428; border-radius:3px; padding:1px 5px; font-family:inherit; font-size:0.58rem; color:#c8bfa8; }
  </style>
</head>
<body>
<!-- NOTHING renders above this line except the nav -->
<nav>
  <a href="/" class="nav-brand">◈ SCOPE</a>
  <button class="hamburger" id="ham-btn">☰</button>
  <div class="nav-links" id="nav-links">
    <a href="/">Brief</a><a href="/home">Dashboard</a>
    <a href="/feed">Alerts <span class="nav-badge" id="alert-badge" style="display:none"></span></a>
    <a href="/congress">Congress</a>
    <a href="/insiders">Insiders</a>
    <a href="/contracts">Contracts</a>
    <a href="/lobbying">Lobbying</a>
    <a href="/intelligence">Intelligence</a>
    <a href="/clusters">Clusters</a>
    <a href="/osint">OSINT Globe</a>
    <a href="/ask">Ask Scope</a>
  </div>
</nav>

<!-- CMD PALETTE -->
<div id="cmd-backdrop" onclick="if(event.target===this)closeCmd()">
  <div id="cmd-box">
    <input id="cmd-input" placeholder="Search tickers, members, headlines…" autocomplete="off" />
    <div id="cmd-results"><div class="cmd-empty">Type to search…</div></div>
    <div class="cmd-hint"><span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>
  </div>
</div>


<div class="page">
  <div class="page-eyebrow">Daily Intelligence Brief</div>
  <div class="page-title">What Changed Overnight</div>
  <div class="page-date" id="page-date">Loading…</div>

  <div id="notice-area"></div>
  <div id="summary-area"><div class="loading">Generating daily brief with AI…</div></div>
  <div class="sections-grid" id="sections-area"></div>
  <div class="gen-at" id="gen-at"></div>
  <button class="regen-btn" id="regen-btn" onclick="regen()">↺ Regenerate brief</button>
</div>

<script>
  document.getElementById('ham-btn').addEventListener('click', () => {
    document.getElementById('nav-links').classList.toggle('open');
  });

  // Card order is presentation only — which cards APPEAR is decided by what the
  // brief actually produced (see the filter in render()). Previously all seven
  // rendered unconditionally, so RULE_11 held a permanent "Gov Contracts" card
  // whatever the ranking said, and 'lobbying' / 'prediction_markets' showed a
  // permanent "No data for this section." because the generator never emitted
  // those keys ('prediction' vs 'prediction_markets' was a plain key mismatch).
  const SECTIONS = [
    { key: 'corroborations',     label: 'Corroborations',         href: '/feed?rule=RULE_10' },
    { key: 'congressional',      label: 'Congressional Activity', href: '/congress' },
    { key: 'insider',            label: 'Insider Activity',       href: '/insiders' },
    { key: 'contracts',          label: 'Gov Contracts',          href: '/contracts' },
    { key: 'regulatory',         label: 'Regulatory Filings',     href: '/feed?rule=RULE_08' },
    { key: 'prediction_markets', label: 'Prediction Markets',     href: '/feed?rule=RULE_07' },
    { key: 'lobbying',           label: 'Lobbying Activity',      href: '/lobbying' },
  ];

  function withTimeout(ms) { const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; }

  function timeAgo(dateStr) {
    if (!dateStr) return 'Unknown';
    let ts;
    if (typeof dateStr === 'number' || /^\d{10,13}$/.test(String(dateStr))) {
      const n = Number(dateStr); ts = n > 1e10 ? n : n * 1000;
    } else {
      const s = String(dateStr).trim().replace(' ', 'T');
      ts = new Date(s + (s.includes('Z') || s.includes('+') ? '' : 'Z')).getTime();
    }
    if (isNaN(ts)) return 'Unknown';
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 0) return 'just now';
    if (diff < 60) return `${diff}s ago`;
    if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
    return `${Math.floor(diff/86400)}d ago`;
  }

  function render(data) {
    document.getElementById('page-date').textContent =
      new Date(data.date || Date.now()).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});

    if (!data.is_today) {
      document.getElementById('notice-area').innerHTML =
        `<div class="notice">Showing ${data.date || 'yesterday\'s'} brief · ${data.note || ''}</div>`;
    }

    if (!data.content_json) {
      document.getElementById('summary-area').innerHTML =
        `<div class="error-box">No brief available yet. Click Regenerate to generate one.</div>`;
      return;
    }

    let parsed;
    try { parsed = JSON.parse(data.content_json); } catch {
      document.getElementById('summary-area').innerHTML =
        `<div class="error-box">Failed to parse brief content.</div>`;
      return;
    }

    document.getElementById('summary-area').innerHTML = `
      <div class="ai-summary">
        <div class="ai-summary-label">
          <span>AI Summary</span>
          <span class="ai-badge">Groq Llama 3.3</span>
        </div>
        <div class="ai-summary-text">${parsed.ai_summary || 'Summary not available.'}</div>
        <div class="ai-model-credit">AI SUMMARY · Groq Llama 3.3 · Not investment advice</div>
      </div>`;

    const sections = parsed.sections || {};
    // Only render a card the brief actually produced. A rule that did not fire
    // gets no card, rather than a guaranteed slot with filler text. Older stored
    // briefs still render, because they carry a one_liner for every key.
    const present = SECTIONS.filter(s => {
      const sec = sections[s.key];
      return sec && typeof sec.one_liner === 'string' && sec.one_liner.trim();
    });

    if (!present.length) {
      document.getElementById('sections-area').innerHTML =
        `<div class="notice">No individual sections fired in this window — see the summary above.</div>`;
      return;
    }

    document.getElementById('sections-area').innerHTML = present.map(s => {
      const sec = sections[s.key] || {};
      const oneLiner = sec.one_liner;
      return `
        <div class="section-card">
          <div class="section-left">
            <div class="section-label">${s.label}</div>
            <div class="section-one-liner">${oneLiner}</div>
          </div>
          <a href="${s.href}" class="section-link">View →</a>
        </div>`;
    }).join('');

    if (data.generated_at) {
      document.getElementById('gen-at').textContent =
        `Generated ${timeAgo(data.generated_at)} · ${new Date(data.generated_at.includes('Z') ? data.generated_at : data.generated_at + 'Z').toLocaleString()}`;
    }
  }

  async function load() {
    try {
      const r = await fetch('/brief/data', { signal: withTimeout(12000) });
      const d = await r.json();
      render(d);
    } catch (e) {
      document.getElementById('summary-area').innerHTML =
        `<div class="error-box">Failed to load brief: ${e.message}</div>`;
    }
  }

  async function regen() {
    const btn = document.getElementById('regen-btn');
    btn.disabled = true; btn.textContent = 'Generating…';
    document.getElementById('summary-area').innerHTML = '<div class="loading">Regenerating with AI… 10-15 seconds.</div>';
    document.getElementById('sections-area').innerHTML = '';
    try {
      const r = await fetch('/brief/generate?force=true', { method: 'POST' });
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      render(d);
    } catch (e) {
      document.getElementById('summary-area').innerHTML =
        `<div class="error-box">Regeneration failed: ${e.message}</div>`;
    }
    btn.disabled = false; btn.textContent = '↺ Regenerate brief';
  }

  load();

  /* ── COMMAND PALETTE ── */
  let _cmdTimer = null, _cmdActive = -1;
  function openCmd() { document.getElementById('cmd-backdrop').classList.add('open'); document.getElementById('cmd-input').focus(); _cmdActive = -1; }
  function closeCmd() { document.getElementById('cmd-backdrop').classList.remove('open'); document.getElementById('cmd-input').value = ''; document.getElementById('cmd-results').innerHTML = '<div class=\"cmd-empty\">Type to search…</div>'; _cmdActive = -1; }
  document.addEventListener('keydown', e => {
    if ((e.metaKey||e.ctrlKey) && e.key==='k') { e.preventDefault(); openCmd(); return; }
    if (e.key==='Escape') { closeCmd(); return; }
    if (!document.getElementById('cmd-backdrop').classList.contains('open')) return;
    const items = document.querySelectorAll('.cmd-item');
    if (e.key==='ArrowDown') { e.preventDefault(); _cmdActive=Math.min(_cmdActive+1,items.length-1); items.forEach((el,i)=>el.classList.toggle('active',i===_cmdActive)); }
    if (e.key==='ArrowUp')   { e.preventDefault(); _cmdActive=Math.max(_cmdActive-1,0); items.forEach((el,i)=>el.classList.toggle('active',i===_cmdActive)); }
    if (e.key==='Enter'&&_cmdActive>=0) { items[_cmdActive]?.click(); closeCmd(); }
  });
  document.getElementById('cmd-input').addEventListener('input', e => { clearTimeout(_cmdTimer); _cmdTimer=setTimeout(()=>cmdSearch(e.target.value.trim()),200); });
  async function cmdSearch(q) {
    _cmdActive=-1;
    if (!q||q.length<2) { document.getElementById('cmd-results').innerHTML='<div class=\"cmd-empty\">Type to search…</div>'; return; }
    try {
      const c=new AbortController(); setTimeout(()=>c.abort(),5000);
      const r=await fetch('/api/search?q='+encodeURIComponent(q),{signal:c.signal});
      const d=await r.json(); let html='';
      if (d.tickers?.length) { html+='<div class=\"cmd-group-label\">Tickers</div>'; html+=d.tickers.map(t=>`<a class=\"cmd-item\" href=\"/ticker/${t.ticker}\"><span class=\"cmd-item-icon\">◎</span><div><div class=\"cmd-item-main\">${t.ticker}</div></div></a>`).join(''); }
      if (d.members?.length) { html+='<div class=\"cmd-group-label\">Members</div>'; html+=d.members.map(m=>`<a class=\"cmd-item\" href=\"/member/${m.bioguide_id}\"><span class=\"cmd-item-icon\">◈</span><div><div class=\"cmd-item-main\">${m.full_name}</div><div class=\"cmd-item-sub\">${m.state||''} · ${m.party||''}</div></div></a>`).join(''); }
      if (d.headlines?.length) { html+='<div class=\"cmd-group-label\">Signals</div>'; html+=d.headlines.map(h=>{ const rule=(h.rule||''); return `<a class=\"cmd-item\" href=\"/feed?ticker=${h.ticker||''}\"><span class=\"cmd-item-icon\">⚡</span><div><div class=\"cmd-item-main\">${(h.headline||'').slice(0,72)}</div><div class=\"cmd-item-sub\">${h.ticker||''} · ${rule}</div></div><span class=\"cmd-badge cmd-badge-${h.severity||'MEDIUM'}\">${h.severity||''}</span></a>`; }).join(''); }
      if (!html) html='<div class=\"cmd-empty\">No results for \"'+q+'\"</div>';
      document.getElementById('cmd-results').innerHTML=html;
    } catch { document.getElementById('cmd-results').innerHTML='<div class=\"cmd-empty\">Search failed.</div>'; }
  }
</script>
<script src="/cmdk.js" defer></script>
</body>
</html>
