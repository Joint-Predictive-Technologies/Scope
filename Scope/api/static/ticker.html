<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticker — Scope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/tokens.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--cream); font-family: Inter, sans-serif; min-height: 100vh; }
    nav { position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); background: rgba(12,11,9,0.92); backdrop-filter: blur(12px); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 56px; }
    .nav-brand { font-family: var(--font-sans); font-weight: 900; font-size: 1.2rem; color: var(--amber); letter-spacing: 0.05em; text-decoration: none; }
    .nav-links { display: flex; gap: 2rem; align-items: center; }
    .nav-links a { font-family: var(--font-mono); font-size: 0.75rem; color: var(--cream2); text-decoration: none; letter-spacing: 0.06em; text-transform: uppercase; transition: color 0.2s; }
    .nav-links a:hover { color: var(--amber); }
    .nav-cta { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; background: var(--amber); color: var(--bg); padding: 6px 16px; border-radius: 4px; text-decoration: none; font-weight: 500; }

    .page { max-width: 900px; margin: 0 auto; padding: 3rem 2rem; }

    .ticker-hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 2.5rem; flex-wrap: wrap; }
    .ticker-symbol { font-family: var(--font-sans); font-size: 3rem; font-weight: 900; color: var(--amber); }
    .ticker-meta-line { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); letter-spacing: 0.06em; margin-top: 0.4rem; }
    .ticker-cap { font-family: var(--font-mono); font-size: 0.7rem; color: var(--cream2); margin-top: 0.3rem; }
    .ticker-summary { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.4rem; display: flex; gap: 2rem; flex-wrap: wrap; }
    .sum-stat { text-align: center; }
    .sum-val { font-family: var(--font-sans); font-size: 1.6rem; font-weight: 700; color: var(--amber); }
    .sum-label { font-family: var(--font-mono); font-size: 0.62rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }

    .section-label { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); margin-bottom: 1rem; margin-top: 2.5rem; }
    .show-more-btn { display: block; width: 100%; margin-top: 1rem; padding: 0.7rem 1rem; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; color: var(--amber); font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.04em; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
    .show-more-btn:hover { border-color: var(--amber); background: rgba(200,146,42,0.08); }

    /* TIMELINE */
    .timeline-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.4rem; overflow-x: auto; }
    .timeline-rules { display: flex; gap: 1.2rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
    .rule-dot { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 0.65rem; color: var(--cream2); }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .timeline-track { position: relative; height: 48px; min-width: 500px; }
    .tl-line { position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border2); }
    .tl-event { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; border-radius: 50%; cursor: pointer; transition: transform 0.15s; }
    .tl-event:hover { transform: translate(-50%, -50%) scale(1.6); }
    .tl-labels { display: flex; justify-content: space-between; margin-top: 4px; font-family: var(--font-mono); font-size: 0.6rem; color: var(--muted); }

    /* TRADE HISTORY TABLE */
    .trade-table { width: 100%; border-collapse: collapse; }
    .trade-table th { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
    .trade-table td { font-size: 0.8rem; padding: 8px 10px; border-bottom: 1px solid rgba(42,38,32,0.5); color: var(--cream2); vertical-align: top; }
    .trade-table tr:hover td { background: rgba(255,255,255,0.015); }
    .trade-table td:first-child { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); }
    .tx-purchase { color: #4dc47a; font-family: var(--font-mono); font-size: 0.65rem; }
    .tx-sale     { color: #e55b4d; font-family: var(--font-mono); font-size: 0.65rem; }
    .delay-ok      { color: #9a9080; font-family: var(--font-mono); font-size: 0.65rem; }
    .delay-late    { color: #e67e22; font-family: var(--font-mono); font-size: 0.65rem; }
    .delay-overdue { color: #e55b4d; font-family: var(--font-mono); font-size: 0.65rem; }
    .window-return { font-family: var(--font-mono); font-size: 0.7rem; }
    .member-link { color: var(--cream2); text-decoration: none; border-bottom: 1px solid var(--border2); }
    .member-link:hover { color: var(--amber); }

    /* ALERT CARDS */
    .alerts-list { display: flex; flex-direction: column; gap: 1px; }
    .alert-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 1rem 1.2rem; cursor: pointer; transition: border-color 0.15s; }
    .alert-card:hover { border-color: var(--border2); }
    .alert-card.expanded { border-color: var(--amber); }
    .alert-top { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .badge { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.08em; padding: 2px 7px; border-radius: 3px; font-weight: 500; flex-shrink: 0; }
    .badge-CRITICAL { background: color-mix(in srgb, var(--severity-critical) 15%, transparent); color: var(--severity-critical); border: 1px solid var(--severity-critical); }
    .badge-HIGH     { background: color-mix(in srgb, var(--severity-high) 15%, transparent); color: var(--severity-high); border: 1px solid var(--severity-high); }
    .badge-MEDIUM   { background: color-mix(in srgb, var(--severity-medium) 15%, transparent); color: var(--severity-medium); border: 1px solid var(--severity-medium); }
    .badge-rule { background: transparent; color: var(--muted); border: 1px solid var(--border2); }
    .alert-headline { font-size: 0.86rem; color: var(--cream); line-height: 1.4; flex: 1; min-width: 200px; }
    .alert-time { font-family: var(--font-mono); font-size: 0.6rem; color: var(--muted); margin-left: auto; flex-shrink: 0; }

    /* Functional motion (b): staggered entrance on render. */
    @keyframes card-enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes card-enter-reduced { from { opacity: 0; } to { opacity: 1; } }
    .alert-card.enter { animation: card-enter 200ms ease-out both; }

    /* Functional motion (g): expand/collapse via max-height + opacity, 180ms ease-out. */
    .alert-detail { max-height: 0; opacity: 0; overflow: hidden; margin-top: 0; padding-top: 0; border-top: 1px solid transparent; font-size: 0.82rem; color: var(--cream2); line-height: 1.65; transition: max-height 180ms ease-out, opacity 180ms ease-out, margin-top 180ms ease-out, padding-top 180ms ease-out; }
    .alert-card.expanded .alert-detail { max-height: 3000px; opacity: 1; margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px solid var(--border); }
    .detail-label { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--amber); margin-bottom: 0.3rem; }
    .verify-link { display: inline-block; margin-top: 0.6rem; font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.04em; color: var(--amber); text-decoration: none; border: 1px solid rgba(200,146,42,0.3); padding: 3px 10px; border-radius: 3px; }
    .verify-link:hover { background: rgba(200,146,42,0.1); }

    /* MEMBERS */
    .members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.8rem; }
    .member-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 0.9rem 1.1rem; text-decoration: none; display: block; transition: border-color 0.15s; }
    .member-card:hover { border-color: var(--amber); }
    .member-name { font-size: 0.85rem; color: var(--cream); margin-bottom: 0.3rem; }
    .member-meta-s { font-family: var(--font-mono); font-size: 0.62rem; color: var(--muted); }

    .empty { padding: 2rem 0; font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }
    .loading { color: var(--muted); font-family: var(--font-mono); font-size: 0.78rem; padding: 2rem 0; }

    /* RELATIONSHIP GRAPH */
    .graph-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 0; overflow: hidden; }
    .graph-wrap svg { display: block; width: 100%; }
    .graph-filter-note { font-family: var(--font-mono); font-size: 0.62rem; color: var(--muted); padding: 0.5rem 1rem; }
    .rule-node { cursor: pointer; }
    .rule-node circle { transition: r 0.2s; }
    .rule-node:hover circle { filter: brightness(1.3); }
    .rule-node.active-filter circle { stroke: var(--amber); stroke-width: 2px; }

    /* ── CMD PALETTE ── */
    #cmd-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:9000; backdrop-filter:blur(4px); }
    #cmd-backdrop.open { display:flex; align-items:flex-start; justify-content:center; padding-top:12vh; }
    #cmd-box { background:#1a1814; border:1px solid #3a3428; border-radius: var(--radius-lg); width:min(640px,92vw); overflow:hidden; }
    #cmd-input { width:100%; background:transparent; border:none; border-bottom:1px solid #2a2620; outline:none; font-family:var(--font-mono); font-size:0.9rem; color:#e8e0cc; padding:1rem 1.2rem; }
    #cmd-results { max-height:360px; overflow-y:auto; }
    .cmd-group-label { font-family:var(--font-mono); font-size:0.6rem; letter-spacing:0.12em; text-transform:uppercase; color:#7a7060; padding:0.6rem 1.2rem 0.2rem; }
    .cmd-item { display:flex; align-items:center; gap:0.8rem; padding:0.65rem 1.2rem; cursor:pointer; text-decoration:none; border-left:2px solid transparent; }
    .cmd-item:hover,.cmd-item.active { background:#222018; border-left-color:#c8922a; }
    .cmd-item-icon { font-size:0.9rem; opacity:0.6; width:18px; text-align:center; flex-shrink:0; }
    .cmd-item-main { font-family:var(--font-mono); font-size:0.75rem; color:#e8e0cc; }
    .cmd-item-sub  { font-size:0.68rem; color:#7a7060; margin-top:1px; }
    .cmd-badge { font-family:var(--font-mono); font-size:0.55rem; padding:1px 5px; border-radius:2px; margin-left:auto; flex-shrink:0; }
    .cmd-badge-CRITICAL { background:rgba(229,91,77,0.2); color:#e55b4d; }
    .cmd-badge-HIGH     { background:rgba(200,146,42,0.2); color:#c8922a; }
    .cmd-badge-MEDIUM   { background:rgba(106,176,224,0.2); color:#6ab0e0; }
    .cmd-empty { font-family:var(--font-mono); font-size:0.75rem; color:#7a7060; padding:1.5rem 1.2rem; text-align:center; }
    .cmd-hint { font-family:var(--font-mono); font-size:0.58rem; color:#7a7060; padding:0.5rem 1.2rem; border-top:1px solid #2a2620; display:flex; gap:1.2rem; }
    .cmd-hint kbd { background:#2a2620; border:1px solid #3a3428; border-radius:3px; padding:1px 5px; font-family:inherit; font-size:0.58rem; color:#c8bfa8; }
  
    /* --- unified nav mobile (injected) --- */
    .hamburger { display: none; margin-left: auto; background: none; border: 1px solid var(--border2); color: var(--cream2); padding: 9px 13px; border-radius: 4px; cursor: pointer; font-size: 1rem; line-height: 1; }
    @media (max-width: 900px) {
      .hamburger { display: flex; }
      .nav-links { display: none; flex-direction: column; position: fixed; top: 56px; left: 0; right: 0; background: var(--bg); border-bottom: 1px solid var(--border); padding: 1.2rem 2rem; gap: 1rem; z-index: 99; }
      .nav-links.open { display: flex; }
    }

    /* Functional motion — reduced motion: keep opacity fades, drop transform/scale. */
    @media (prefers-reduced-motion: reduce) {
      .alert-card.enter { animation: card-enter-reduced 200ms ease-out both; }
      .alert-detail { transition: opacity 180ms ease-out; }
    }
  </style>
<style>
/* --- alert receipts (provenance block) --- */
/* receipts — the evidence block; amplified + tokenized (Principle 2). member
   NAMES are sans (prose); sizes/dates/IDs/links are mono (data). */
details.receipts{margin-top:var(--space-2);background:var(--surface-2);border:1px solid var(--border-subtle);border-left:2px solid var(--accent);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3)}
details.receipts>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:var(--space-2);font-size:var(--text-sm);color:var(--text-secondary)}
details.receipts>summary::-webkit-details-marker{display:none}
details.receipts>summary::marker{content:''}
details.receipts>summary:hover .receipts-summary{color:var(--text-primary)}
.receipts-label{font-family:var(--font-mono);font-size:var(--text-2xs);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--accent);flex-shrink:0}
.receipts-summary{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
details.receipts[open]>summary{margin-bottom:var(--space-2);padding-bottom:var(--space-2);border-bottom:1px solid var(--border-subtle)}
.receipts-body{display:flex;flex-direction:column;gap:var(--space-2)}
details.receipts[open] .receipts-body{animation:receipts-reveal 180ms var(--ease-out)}
@keyframes receipts-reveal{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.receipt-item{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:baseline;font-size:var(--text-sm);color:var(--text-secondary)}
.receipt-primary{font-weight:var(--weight-medium);color:var(--text-primary)}
.receipt-secondary{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-tertiary);font-variant-numeric:tabular-nums}
a.receipt-link{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--accent);text-decoration:none;white-space:nowrap}
a.receipt-link:hover{text-decoration:underline}
.receipt-source{margin-top:var(--space-1)}
.receipt-gap{font-size:var(--text-2xs);color:var(--text-tertiary);font-style:italic}
</style>
<script>
/* renderReceipts — factual alert provenance (server-assembled; never LLM). */
function renderReceipts(r){
  if(!r) return '';
  const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const lk=(u,l)=>u?`<a class="receipt-link" href="${e(u)}"${/^https?:/.test(u)?' target="_blank" rel="noopener"':''}>${e(l||'open')} →</a>`:'';
  const items=(r.items||[]).map(it=>`<div class="receipt-item"><span class="receipt-primary">${e(it.primary)}</span>${it.secondary?`<span class="receipt-secondary">${e(it.secondary)}</span>`:''}${lk(it.url,it.url_label)}</div>`).join('');
  const src=r.source&&r.source.url?`<div class="receipt-source">${lk(r.source.url,r.source.label)}</div>`:'';
  const gap=r.gap?`<div class="receipt-gap">⚠ ${e(r.gap)}</div>`:'';
  const body=(items+src+gap)||'<div class="receipt-gap">No further detail captured.</div>';
  return `<details class="receipts"><summary><span class="receipts-label">Receipts</span><span class="receipts-summary">${e(r.summary||'')}</span></summary><div class="receipts-body">${body}</div></details>`;
}
</script>

<script>
  // ── Functional motion: reduced-motion detection ───────────────────────────
  const REDUCE_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function withTimeout(ms) { const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; }

  const RULE_COLORS = {
    RULE_01B: '#e67e22', RULE_02: '#c8922a', RULE_06: '#6ab0e0',
    RULE_07: '#2a8a4a', RULE_08: '#9b59b6', RULE_09: '#e67e22', RULE_10: '#e55b4d',
  };

  const symbol = window.location.pathname.split('/').pop().toUpperCase();
  document.title = `${symbol} — Scope`;

  function timeAgo(dateStr) {
    if (!dateStr) return 'Unknown';
    let ts;
    if (typeof dateStr === 'number' || /^\d{10,13}$/.test(String(dateStr))) {
      const n = Number(dateStr);
      ts = n > 1e10 ? n : n * 1000;
    } else {
      const s = String(dateStr).trim().replace(' ', 'T');
      ts = new Date(s + (s.includes('Z') || s.includes('+') ? '' : 'Z')).getTime();
    }
    if (isNaN(ts)) return 'Unknown';
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 0)    return 'just now';
    if (diff < 60)   return `${diff}s ago`;
    if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
    return `${Math.floor(diff/86400)}d ago`;
  }

  function sourceUrl(a) {
    const rule = a.rule, tags = a.tags || '', ticker = (a.ticker || '').replace(/\$/g, '').split(' ')[0];
    if (rule === 'RULE_02' || rule === 'RULE_01' || rule === 'RULE_01B')
      return 'https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/';
    if (rule === 'RULE_06')
      return `https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=${ticker}&type=4&dateb=&owner=include&count=40`;
    if (rule === 'RULE_07') { const p = tags.split(','); const slug = p[p.length - 1].trim(); return slug ? `https://polymarket.com/event/${slug}` : 'https://polymarket.com/markets?category=politics'; }
    if (rule === 'RULE_08') { const p = tags.split(', '); return `https://www.federalregister.gov/search?conditions%5Bterm%5D=${encodeURIComponent(p[1] || '')}`; }
    if (rule === 'RULE_09') return 'https://lda.senate.gov/filings/public/filing/search/';
    if (rule === 'RULE_10') return `/feed?ticker=${ticker}`;
    return null;
  }

  function fmtCap(mc) {
    if (mc == null) return null;
    if (mc >= 1e12) return `$${(mc / 1e12).toFixed(1)}T`;
    if (mc >= 1e9)  return `$${(mc / 1e9).toFixed(1)}B`;
    if (mc >= 1e6)  return `$${(mc / 1e6).toFixed(0)}M`;
    return `$${mc.toLocaleString()}`;
  }

  function capLabel(mc) {
    if (mc == null) return '';
    if (mc < 300e6)  return 'Micro-cap';
    if (mc < 2e9)    return 'Small-cap';
    if (mc < 10e9)   return 'Mid-cap';
    return 'Large-cap';
  }

  function delayClass(d) {
    if (d == null) return 'delay-ok';
    if (d >= 45) return 'delay-overdue';
    if (d >= 31) return 'delay-late';
    return 'delay-ok';
  }
  function delayLabel(d) {
    if (d == null) return '—';
    if (d >= 45) return `⚑ ${d}d`;
    if (d >= 31) return `▲ ${d}d`;
    return `${d}d`;
  }

  // Lazy load price action into a <td class="window-return" data-sym data-start data-end>
  async function loadWindowReturn(td) {
    if (!td || td.dataset.loaded) return;
    td.dataset.loaded = '1';
    const { sym, start, end } = td.dataset;
    if (!sym || !start || !end) { td.textContent = '—'; return; }
    try {
      const r = await fetch(`/tickers/${sym}/price-action?start=${start}&end=${end}`);
      const d = await r.json();
      if (d.pct_change != null) {
        const pct   = d.pct_change.toFixed(1);
        const color = d.pct_change >= 0 ? '#4dc47a' : '#e55b4d';
        td.innerHTML = `<span style="color:${color}">${d.pct_change >= 0 ? '+' : ''}${pct}%</span>`;
      } else { td.textContent = '—'; }
    } catch { td.textContent = '—'; }
  }

  function renderClusters(alerts) {
    const clusters = alerts.filter(a => a.rule === 'RULE_CLUSTER');
    if (!clusters.length) return '';
    const rows = clusters.map(a => {
      let fp = '';
      try { fp = (JSON.parse(a.tags || '{}').fingerprint || ''); } catch {}
      const href = fp ? '/cluster/' + encodeURIComponent(fp.replace('CLUSTER::','').replace(/::/g,'__')) : '#';
      const sup = a.lifecycle_stage === 'superseded';
      return `<a href="${href}" style="display:flex;gap:0.7rem;align-items:center;background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:6px;padding:0.6rem 0.9rem;margin-bottom:0.4rem;text-decoration:none;color:var(--cream2);font-size:0.82rem;${sup?'opacity:0.55':''}">
        <span style="flex:1">${(a.headline||'').replace(/</g,'&lt;')}</span>
        <span style="font-family:var(--font-mono);font-size:0.62rem;color:var(--muted)">${new Date(a.created_at+'Z').toLocaleDateString('en-US',{month:'short',day:'numeric'})}${sup?' · superseded':''}</span>
      </a>`;
    }).join('');
    return `<div class="section-label">Clusters (${clusters.length})</div>${rows}`;
  }

  function renderTimeline(alerts) {
    if (!alerts.length) return '';
    const dates = alerts.map(a => new Date(a.created_at + 'Z').getTime());
    const minD = Math.min(...dates), maxD = Math.max(...dates);
    const range = maxD - minD || 1;
    const rules = [...new Set(alerts.map(a => a.rule))];
    const legend = rules.map(r => `<div class="rule-dot"><div class="dot" style="background:${RULE_COLORS[r] || '#888'}"></div>${r}</div>`).join('');
    const events = alerts.map(a => {
      const pct = ((new Date(a.created_at + 'Z').getTime() - minD) / range) * 96 + 2;
      const col = RULE_COLORS[a.rule] || '#888';
      return `<div class="tl-event" style="left:${pct}%;background:${col}" title="${a.rule}: ${a.headline.slice(0,60)}"></div>`;
    }).join('');
    const labelL = new Date(minD).toLocaleDateString('en-US', {month:'short', day:'numeric'});
    const labelR = new Date(maxD).toLocaleDateString('en-US', {month:'short', day:'numeric'});
    return `
      <div class="section-label">Signal Timeline</div>
      <div class="timeline-wrap">
        <div class="timeline-rules">${legend}</div>
        <div class="timeline-track"><div class="tl-line"></div>${events}</div>
        <div class="tl-labels"><span>${labelL}</span><span>${labelR}</span></div>
      </div>`;
  }

  const ALERTS_PAGE_SIZE = 25;
  function renderAlerts(alerts) {
    if (!alerts.length) return '<div class="empty">No alerts found for this ticker.</div>';
    const shown = _alertsExpanded ? alerts : alerts.slice(0, ALERTS_PAGE_SIZE);
    const cards = shown.map((a, i) => {
      const url = sourceUrl(a);
      const receipts = a.receipts ? renderReceipts(a.receipts) : '';
      // AI-analysis block removed (vault: 2026-07-23-remove-war-room-ai-analysis).
      // The stored alert.detail LLM narrative is no longer surfaced — factual
      // receipts + tags carry the war room. Generation code is left intact,
      // just unwired from the UI here.
      let detail = '';
      if (a.tags) detail = `<div class="detail-label">Tags</div>${a.tags}`;
      const verifyBtn = url ? `<a href="${url}" target="_blank" rel="noopener" class="verify-link">Verify Source →</a>` : '';
      const enterClass = REDUCE_MOTION ? '' : ' enter';
      const enterStyle = REDUCE_MOTION ? '' : ` style="animation-delay:${Math.min(i,7)*40}ms"`;
      return `
        <div class="alert-card${enterClass}" id="ac-${i}"${enterStyle} onclick="toggle(${i})">
          <div class="alert-top">
            <span class="badge badge-${a.severity}">${a.severity}</span>
            <span class="badge badge-rule">${a.rule}</span>
            <span class="alert-headline">${a.headline}</span>
            <span class="alert-time">${timeAgo(a.created_at)}</span>
          </div>
          ${receipts || detail || verifyBtn ? `<div class="alert-detail">${receipts}${detail}${verifyBtn}</div>` : ''}
        </div>`;
    }).join('');
    const moreBtn = alerts.length > shown.length
      ? `<button class="show-more-btn" onclick="expandAlerts(event)">Show all ${alerts.length} alerts (${alerts.length - shown.length} more) →</button>`
      : '';
    return cards + moreBtn;
  }

  function renderTransactions(txs) {
    if (!txs.length) return '<div class="empty">No congressional transactions on record.</div>';
    return `
      <div style="overflow-x:auto">
      <table class="trade-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Member</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Disclosure Delay</th>
            <th>Window Return</th>
          </tr>
        </thead>
        <tbody>
          ${txs.map((t, i) => {
            const txClass = (t.transaction_type || '').toLowerCase().includes('sale') ? 'tx-sale' : 'tx-purchase';
            const txLabel = (t.transaction_type || '—').replace(/_/g, ' ');
            const memberHref = t.member_id
              ? `<a href="/member/${t.member_id}" class="member-link">${t.full_name}</a>`
              : (t.full_name || '—');
            const dlClass = delayClass(t.filing_delay);
            const dlLabel = delayLabel(t.filing_delay);
            const hasDates = t.transaction_date && t.filing_date;
            const retCell = hasDates
              ? `<td class="window-return" data-sym="${symbol}" data-start="${t.transaction_date}" data-end="${t.filing_date}" id="wr-${i}" style="color:var(--muted)">…</td>`
              : '<td style="color:var(--muted)">—</td>';
            return `<tr>
              <td>${t.transaction_date || '—'}</td>
              <td>${memberHref}</td>
              <td><span class="${txClass}">${txLabel}</span></td>
              <td style="font-size:0.75rem;color:var(--muted)">${t.amount_band || '—'}</td>
              <td><span class="${dlClass}">${dlLabel}</span></td>
              ${retCell}
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>`;
  }

  function toggle(i) { document.getElementById(`ac-${i}`)?.classList.toggle('expanded'); }

  let _activeRuleFilter = null;

  function renderRuleGraph(alerts) {
    const ruleCount = {};
    for (const a of alerts) ruleCount[a.rule] = (ruleCount[a.rule] || 0) + 1;
    const rules = Object.keys(ruleCount);
    if (rules.length < 2) return '';

    const W = 680, H = 260, CX = W / 2, CY = H / 2;
    const centerR = 22, ruleR = 14;
    const angleStep = (2 * Math.PI) / rules.length;
    const orbitR = Math.min(CX, CY) - 40;

    const nodePositions = rules.map((r, i) => ({
      rule: r, count: ruleCount[r],
      x: CX + orbitR * Math.cos(angleStep * i - Math.PI / 2),
      y: CY + orbitR * Math.sin(angleStep * i - Math.PI / 2),
    }));
    const maxCount = Math.max(...rules.map(r => ruleCount[r]));

    const lines = nodePositions.map(n => {
      const w = Math.max(1, Math.round((n.count / maxCount) * 4));
      return `<line x1="${CX}" y1="${CY}" x2="${n.x}" y2="${n.y}" stroke="#3a3428" stroke-width="${w}" stroke-opacity="0.7"/>`;
    }).join('');

    const nodes = nodePositions.map((n, i) => {
      const col = RULE_COLORS[n.rule] || '#7a7060';
      const r = ruleR + Math.round((n.count / maxCount) * 6);
      const shortRule = n.rule.replace('RULE_', '');
      return `<g class="rule-node" id="rn-${i}" onclick="filterByRule('${n.rule}', ${i})" transform="translate(${n.x},${n.y})">
        <circle r="${r}" fill="${col}" fill-opacity="0.85"/>
        <text dy="0.35em" text-anchor="middle" fill="#e8e0cc" font-family="monospace" font-size="8">${shortRule}</text>
        <title>${n.rule}: ${n.count} alerts — click to filter</title>
      </g>`;
    }).join('');

    const center = `<g transform="translate(${CX},${CY})">
      <circle r="${centerR}" fill="#c8922a" fill-opacity="0.9"/>
      <text dy="0.35em" text-anchor="middle" fill="#0c0b09" font-family="sans-serif" font-size="11" font-weight="700">${symbol}</text>
    </g>`;

    return `
      <div class="section-label">Signal Relationship Graph</div>
      <div class="graph-wrap">
        <svg viewBox="0 0 ${W} ${H}" height="${H}">
          ${lines}${nodes}${center}
        </svg>
        <div class="graph-filter-note" id="graph-note">Click a rule node to filter the alert list below ·  <span id="clear-filter" style="color:var(--amber);cursor:pointer;display:none" onclick="clearRuleFilter()">Clear filter ×</span></div>
      </div>`;
  }

  function filterByRule(rule, idx) {
    _activeRuleFilter = _activeRuleFilter === rule ? null : rule;
    _alertsExpanded = false;
    document.querySelectorAll('.rule-node').forEach((el, i) => {
      el.classList.toggle('active-filter', i === idx && _activeRuleFilter);
    });
    document.getElementById('clear-filter').style.display = _activeRuleFilter ? 'inline' : 'none';
    applyAlertFilter();
  }

  function clearRuleFilter() {
    _activeRuleFilter = null;
    _alertsExpanded = false;
    document.querySelectorAll('.rule-node').forEach(el => el.classList.remove('active-filter'));
    document.getElementById('clear-filter').style.display = 'none';
    applyAlertFilter();
  }

  let _allAlerts = [];
  let _alertsExpanded = false;
  function expandAlerts(e) { if (e) e.stopPropagation(); _alertsExpanded = true; applyAlertFilter(); }
  function applyAlertFilter() {
    const visible = _activeRuleFilter ? _allAlerts.filter(a => a.rule === _activeRuleFilter) : _allAlerts;
    const listEl = document.querySelector('.alerts-list');
    if (listEl) listEl.innerHTML = renderAlerts(visible);
    const countEl = document.querySelector('.alerts-count-label');
    if (countEl) countEl.textContent = visible.length + (_activeRuleFilter ? ` — filtered to ${_activeRuleFilter}` : ' total');
  }

  async function load() {
    let res, data;
    try {
      res  = await fetch(`/tickers/${symbol}/alerts?days=365&limit=200`, { signal: withTimeout(10000) });
      data = await res.json();
    } catch {
      document.getElementById('content').innerHTML = '<div style="color:var(--muted);font-family:var(--font-mono);font-size:0.8rem;padding:2rem">Failed to load ticker data.</div>';
      return;
    }
    const alerts = data.alerts       || [];
    _allAlerts = alerts;
    const members = data.related_members || [];
    const txs     = data.transactions    || [];

    const last30  = alerts.filter(a => new Date(a.created_at + 'Z') >= new Date(Date.now() - 30 * 86400000));
    const ruleSet = new Set(last30.map(a => a.rule));
    const topSev  = last30.find(a => a.severity === 'CRITICAL') ? 'CRITICAL'
                  : last30.find(a => a.severity === 'HIGH')     ? 'HIGH' : 'MEDIUM';
    const sevColor = { CRITICAL: '#e55b4d', HIGH: 'var(--amber2)', MEDIUM: '#6ab0e0' }[topSev] || 'var(--amber)';

    const membersSection = members.length ? `
      <div class="section-label">Related Congressional Members</div>
      <div class="members-grid">
        ${members.map(m => `
          <a href="/member/${m.bioguide_id}" class="member-card">
            <div class="member-name">${m.full_name}</div>
            <div class="member-meta-s">${m.party || ''} · ${m.state || ''}</div>
          </a>`).join('')}
      </div>` : '';

    const txSection = txs.length ? `
      <div class="section-label">Congressional Trade History — ${txs.length} transactions</div>
      ${renderTransactions(txs)}` : '';

    document.getElementById('content').innerHTML = `
      <div class="ticker-hero">
        <div>
          <div class="ticker-symbol">${symbol}</div>
          <div class="ticker-meta-line">Political Intelligence Drill-Down · All-time signal history</div>
          <div class="ticker-cap" id="cap-line">Loading market cap…</div>
        </div>
        <div class="ticker-summary">
          <div class="sum-stat"><div class="sum-val">${last30.length}</div><div class="sum-label">Alerts (30d)</div></div>
          <div class="sum-stat"><div class="sum-val">${ruleSet.size}</div><div class="sum-label">Rules Fired</div></div>
          <div class="sum-stat"><div class="sum-val" style="color:${sevColor}">${topSev}</div><div class="sum-label">Top Severity</div></div>
          <div class="sum-stat"><div class="sum-val">${alerts.length}</div><div class="sum-label">All-time Alerts</div></div>
          <div class="sum-stat"><div class="sum-val">${txs.length}</div><div class="sum-label">Trades on Record</div></div>
        </div>
      </div>
      ${renderClusters(alerts)}
      ${renderTimeline(alerts)}
      ${renderRuleGraph(alerts)}
      ${membersSection}
      ${txSection}
      <div class="section-label">All Alerts — <span class="alerts-count-label">${alerts.length} total</span></div>
      <div class="alerts-list">${renderAlerts(alerts)}</div>
    `;

    // Fetch market cap and update cap line
    fetch(`/tickers/${symbol}/meta`, { signal: withTimeout(8000) })
      .then(r => r.json())
      .then(d => {
        const capEl = document.getElementById('cap-line');
        if (!capEl) return;
        if (d.market_cap) {
          const label = capLabel(d.market_cap);
          capEl.textContent = `${fmtCap(d.market_cap)} market cap · ${label}` +
            (d.social_spike ? ' · ⚡ Active on Stocktwits' : '');
        } else {
          capEl.textContent = 'Market cap unavailable';
        }
      })
      .catch(() => {
        const el = document.getElementById('cap-line');
        if (el) el.textContent = '';
      });

    // Lazily load all window returns
    document.querySelectorAll('.window-return[data-sym]').forEach(td => loadWindowReturn(td));
  }

  load();

  /* ── COMMAND PALETTE ── */
  let _cmdTimer = null, _cmdActive = -1;
  function openCmd() { document.getElementById('cmd-backdrop').classList.add('open'); document.getElementById('cmd-input').focus(); _cmdActive = -1; }
  function closeCmd() { document.getElementById('cmd-backdrop').classList.remove('open'); document.getElementById('cmd-input').value = ''; document.getElementById('cmd-results').innerHTML = '<div class=\"cmd-empty\">Type to search…</div>'; _cmdActive = -1; }
  document.addEventListener('keydown', e => {
    if ((e.metaKey||e.ctrlKey) && e.key==='k') { e.preventDefault(); openCmd(); return; }
    if (e.key==='Escape') { closeCmd(); return; }
    if (!document.getElementById('cmd-backdrop').classList.contains('open')) return;
    const items = document.querySelectorAll('.cmd-item');
    if (e.key==='ArrowDown') { e.preventDefault(); _cmdActive=Math.min(_cmdActive+1,items.length-1); items.forEach((el,i)=>el.classList.toggle('active',i===_cmdActive)); }
    if (e.key==='ArrowUp')   { e.preventDefault(); _cmdActive=Math.max(_cmdActive-1,0); items.forEach((el,i)=>el.classList.toggle('active',i===_cmdActive)); }
    if (e.key==='Enter'&&_cmdActive>=0) { items[_cmdActive]?.click(); closeCmd(); }
  });
  document.getElementById('cmd-input').addEventListener('input', e => { clearTimeout(_cmdTimer); _cmdTimer=setTimeout(()=>cmdSearch(e.target.value.trim()),200); });
  async function cmdSearch(q) {
    _cmdActive=-1;
    if (!q||q.length<2) { document.getElementById('cmd-results').innerHTML='<div class=\"cmd-empty\">Type to search…</div>'; return; }
    try {
      const c=new AbortController(); setTimeout(()=>c.abort(),5000);
      const r=await fetch('/api/search?q='+encodeURIComponent(q),{signal:c.signal});
      const d=await r.json(); let html='';
      if (d.tickers?.length) { html+='<div class=\"cmd-group-label\">Tickers</div>'; html+=d.tickers.map(t=>`<a class=\"cmd-item\" href=\"/ticker/${t.ticker}\"><span class=\"cmd-item-icon\">◎</span><div><div class=\"cmd-item-main\">${t.ticker}</div></div></a>`).join(''); }
      if (d.members?.length) { html+='<div class=\"cmd-group-label\">Members</div>'; html+=d.members.map(m=>`<a class=\"cmd-item\" href=\"/member/${m.bioguide_id}\"><span class=\"cmd-item-icon\">◈</span><div><div class=\"cmd-item-main\">${m.full_name}</div><div class=\"cmd-item-sub\">${m.state||''} · ${m.party||''}</div></div></a>`).join(''); }
      if (d.headlines?.length) { html+='<div class=\"cmd-group-label\">Signals</div>'; html+=d.headlines.map(h=>{ const rule=(h.rule||''); return `<a class=\"cmd-item\" href=\"/feed?ticker=${h.ticker||''}\"><span class=\"cmd-item-icon\">⚡</span><div><div class=\"cmd-item-main\">${(h.headline||'').slice(0,72)}</div><div class=\"cmd-item-sub\">${h.ticker||''} · ${rule}</div></div><span class=\"cmd-badge cmd-badge-${h.severity||'MEDIUM'}\">${h.severity||''}</span></a>`; }).join(''); }
      if (!html) html='<div class=\"cmd-empty\">No results for \"'+q+'\"</div>';
      document.getElementById('cmd-results').innerHTML=html;
    } catch { document.getElementById('cmd-results').innerHTML='<div class=\"cmd-empty\">Search failed.</div>'; }
  }
</script>
</body>
</html>
